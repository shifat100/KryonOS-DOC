<script>
/* =========================================================
   1. HARDWARE CONSTANTS & COLOR PALETTE
   ========================================================= */
const TFT_BLACK=0x0000, TFT_WHITE=0xFFFF, TFT_RED=0xF800;
const TFT_GREEN=0x07E0, TFT_BLUE=0x001F, TFT_YELLOW=0xFFE0;
const TFT_CYAN=0x07FF, TFT_MAGENTA=0xF81F, TFT_ORANGE=0xFD20;
const TFT_DARKGREY=0x7BEF, TFT_LIGHTGREY=0xC618, TFT_PURPLE=0x780F, TFT_NAVY=0x000F;

const BLACK=TFT_BLACK, WHITE=TFT_WHITE, RED=TFT_RED, GREEN=TFT_GREEN;
const BLUE=TFT_BLUE, YELLOW=TFT_YELLOW, CYAN=TFT_CYAN, MAGENTA=TFT_MAGENTA;
const ORANGE=TFT_ORANGE, DARKGREY=TFT_DARKGREY, LIGHTGREY=TFT_LIGHTGREY;
const PURPLE=TFT_PURPLE, NAVY=TFT_NAVY;

const C_BLACK=TFT_BLACK, C_WHITE=TFT_WHITE, C_RED=TFT_RED, C_GREEN=TFT_GREEN;
const C_BLUE=TFT_BLUE, C_YELLOW=TFT_YELLOW, C_CYAN=TFT_CYAN, C_MAGENTA=TFT_MAGENTA;
const C_ORANGE=TFT_ORANGE, C_DARKGREY=TFT_DARKGREY, C_PURPLE=TFT_PURPLE, C_NAVY=TFT_NAVY;

const KRYONOS_VERSION = "2.0.0";
const KRYONOS_API_LEVEL = 2;

const STATE_LAUNCHER          = 0;
const STATE_SETTINGS          = 1;
const STATE_RUN_APP           = 2;
const STATE_INSTALLER         = 3;
const STATE_CALIBRATOR        = 4;
const STATE_WEB_APP           = 5;
const STATE_SETTINGS_WIFI     = 6;
const STATE_SETTINGS_ABOUT    = 7;
const STATE_SETTINGS_APPS     = 8;
const STATE_SETTINGS_TIME     = 9;
const STATE_SETTINGS_TIME_MANUAL = 10;
const STATE_UPDATER_MANUAL    = 12;
const STATE_APP_STORE         = 13;
const STATE_HELP_CENTER       = 14;
const STATE_SETTINGS_WIFI_SAVED = 15;
const STATE_KRYON_CLOUD       = 16;
const STATE_SETTINGS_PERMISSIONS= 17;

const TL_DATUM=0, TC_DATUM=1, ML_DATUM=3, MC_DATUM=4;

const consoleEl = document.getElementById('console');
function log(msg, cls){
  if (!consoleEl) return;
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('en-GB', {hour12:false}) + '] ' + msg;
  consoleEl.appendChild(d);
  while (consoleEl.children.length > 250) consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* =========================================================
   2. HARDWARE AUDIO & PWM SYNTHESIZER ENGINE
   ========================================================= */
class AudioPWM {
  constructor(){
    this.ctx = null;
    this.oscillators = new Map();
  }
  _ensure(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  setTone(pin, freq, durationMs = 0){
    try {
      this._ensure();
      if (!this.ctx) return;
      this.stopTone(pin);
      if (freq <= 0) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      this.oscillators.set(pin, { osc, gain });

      if (durationMs > 0) {
        setTimeout(() => this.stopTone(pin), durationMs);
      }
    } catch(e){}
  }
  stopTone(pin){
    const it = this.oscillators.get(pin);
    if (it) {
      try {
        it.gain.gain.setValueAtTime(0, this.ctx.currentTime);
        it.osc.stop();
        it.osc.disconnect();
      } catch(e){}
      this.oscillators.delete(pin);
    }
  }
  reset(){
    for (const pin of this.oscillators.keys()) {
      this.stopTone(pin);
    }
  }
}
const audioHardware = new AudioPWM();

/* =========================================================
   3. PERSISTENT INDEXEDDB VFS (STORAGE ENGINE)
   ========================================================= */
class IndexedDB_VFS {
  constructor(sim){
    this.sim = sim;
    this.dbName = 'KryonOS_Production_VFS_v5';
    this.storeName = 'files';
    this.db = null;
    this.cache = new Map();
  }

  async init(){
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(this.dbName, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(this.storeName)) {
            db.createObjectStore(this.storeName, { keyPath: 'path' });
          }
        };
        req.onsuccess = async (e) => {
          this.db = e.target.result;
          await this._loadCache();
          if (this.cache.size === 0) {
            await this.seedDefaults();
          }
          resolve();
        };
        req.onerror = () => { this.seedDefaults(); resolve(); };
      } catch(e) { this.seedDefaults(); resolve(); }
    });
  }

  _loadCache(){
    return new Promise((resolve) => {
      if (!this.db) return resolve();
      const tx = this.db.transaction(this.storeName, 'readonly');
      const store = tx.objectStore(this.storeName);
      const req = store.getAll();
      req.onsuccess = () => {
        this.cache.clear();
        (req.result || []).forEach(it => this.cache.set(it.path, it));
        resolve();
      };
      req.onerror = () => resolve();
    });
  }

  async seedDefaults(){
    const defs = [
      { path: '/local', isDir: true },
      { path: '/local/apps', isDir: true },
      { path: '/local/system', isDir: true },
      { path: '/sd', isDir: true },
      { path: '/sd/apps', isDir: true }
    ];
    for (const d of defs) {
      this._put(d.path, null, d.isDir, false);
    }

    // Default Demo Apps
    const calcPkg = '/local/apps/com.kryon.calc';
    this.mkdir(calcPkg);
    this.writeTextFile(calcPkg + '/app.json', JSON.stringify({
      name: "Calculator", packageName: "com.kryon.calc", version: "1.0.0", api: 1, author: "KryonTeam", description: "Standard utility calculator"
    }, null, 2));
    this.writeTextFile(calcPkg + '/main.js', `var bg = System.color(20,20,30);
System.fillScreen(bg);
System.setTextColor(WHITE, bg);
System.drawString("Calculator App", 20, 30, 2);
System.fillRoundRect(20, 100, 200, 40, 5, BLUE);
System.setTextColor(WHITE, BLUE);
System.drawString("Tap Screen to Beep", 30, 112, 2);

while(true) {
  var t = System.getTouch();
  if (t.touched) {
    PWM.setTone(18, 1400, 100);
    System.notify("Calc", "Button pressed", "info", 1500);
  }
  System.delay(40);
}`);

    const paintPkg = '/local/apps/com.kryon.paint';
    this.mkdir(paintPkg);
    this.writeTextFile(paintPkg + '/app.json', JSON.stringify({
      name: "Canvas Paint", packageName: "com.kryon.paint", version: "1.0.0", api: 1, author: "KryonTeam", description: "Finger drawing app"
    }, null, 2));
    this.writeTextFile(paintPkg + '/main.js', `System.fillScreen(BLACK);
System.setTextColor(YELLOW, BLACK);
System.drawString("Draw with finger!", 10, 10, 2);
while(true) {
  var t = System.getTouch();
  if (t.touched && t.y > 40) {
    System.fillCircle(t.x, t.y, 4, CYAN);
  }
  System.delay(10);
}`);
  }

  _put(path, content, isDir = false, notify = true){
    const clean = path.replace(/\/+/g, '/');
    const record = {
      path: clean,
      content: isDir ? null : String(content != null ? content : ''),
      isDir,
      size: isDir ? 0 : (content ? String(content).length : 0),
      modified: Date.now()
    };
    this.cache.set(clean, record);
    if (this.db) {
      try {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        tx.objectStore(this.storeName).put(record);
      } catch(e){}
    }
    if (notify && this.sim) this.sim.onStorageChanged();
    return true;
  }

  exists(p){ return this.cache.has(p.replace(/\/+/g, '/')); }
  isDirectory(p){ const it = this.cache.get(p.replace(/\/+/g, '/')); return it ? it.isDir : false; }
  isFile(p){ const it = this.cache.get(p.replace(/\/+/g, '/')); return it ? !it.isDir : false; }
  readTextFile(p){
    const it = this.cache.get(p.replace(/\/+/g, '/'));
    return (it && !it.isDir) ? it.content : '';
  }
  writeTextFile(p, c){
    if (!p) return false;
    this._mkpar(p);
    return this._put(p, c, false, true);
  }
  appendTextFile(p, c){
    const cur = this.readTextFile(p);
    return this.writeTextFile(p, cur + String(c));
  }
  mkdir(p){
    const clean = p.replace(/\/+/g, '/');
    if (this.cache.has(clean)) return true;
    this._mkpar(clean);
    return this._put(clean, null, true, true);
  }
  rmdir(p){ return this.deleteFile(p); }
  deleteFile(p){
    const clean = p.replace(/\/+/g, '/');
    this.cache.delete(clean);
    if (this.db) {
      try {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        tx.objectStore(this.storeName).delete(clean);
      } catch(e){}
    }
    if (this.sim) this.sim.onStorageChanged();
    return true;
  }
  renameFile(from, to){
    const f = from.replace(/\/+/g, '/');
    const t = to.replace(/\/+/g, '/');
    const it = this.cache.get(f);
    if (!it) return false;
    this.deleteFile(f);
    return this._put(t, it.content, it.isDir, true);
  }
  listDir(p){
    const clean = p.replace(/\/+/g, '/');
    const pre = clean.endsWith('/') ? clean : clean + '/';
    const out = [];
    for (const [k] of this.cache.entries()){
      if (k.startsWith(pre) && k !== clean){
        const sub = k.substring(pre.length);
        if (!sub.includes('/')) out.push(k);
      }
    }
    return out;
  }
  listDirFull(p){
    const clean = p.replace(/\/+/g, '/');
    const pre = clean.endsWith('/') ? clean : clean + '/';
    const out = [];
    for (const [k, it] of this.cache.entries()){
      if (k.startsWith(pre) && k !== clean){
        const sub = k.substring(pre.length);
        if (!sub.includes('/')) out.push({ name: sub, path: k, isDir: it.isDir });
      }
    }
    return out;
  }
  getFileSize(p){
    const it = this.cache.get(p.replace(/\/+/g, '/'));
    return it ? it.size : 0;
  }
  getTotalSpace(drive){ return 16 * 1024 * 1024; }
  getUsedSpace(drive){
    let total = 0;
    for (const it of this.cache.values()) total += it.size;
    return total;
  }
  getFreeSpace(drive){ return this.getTotalSpace(drive) - this.getUsedSpace(drive); }
  _mkpar(p){
    const parts = p.split('/').filter(Boolean);
    let cur = '';
    for (let i = 0; i < parts.length - 1; i++){
      cur += '/' + parts[i];
      if (!this.cache.has(cur)) {
        this._put(cur, null, true, false);
      }
    }
  }
  async reset(){
    if (this.db) {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).clear();
    }
    this.cache.clear();
    await this.seedDefaults();
    log('Storage formatted cleanly.', 'warn');
  }
}

/* =========================================================
   4. TFT_eSPI GRAPHICS ENGINE (Canvas 2D Display Pipeline)
   ========================================================= */
class TFTDisplay {
  constructor(cv){
    this.canvas = cv;
    this.ctx = cv.getContext('2d', {alpha:false});
    this.ctx.imageSmoothingEnabled = false;
    this.W = cv.width; this.H = cv.height;
    this.fgColor = '#fff'; this.bgColor = null;
    this.textSize = 1; this.textDatum = TL_DATUM;
    this.activeSprite = null;
    this.clear();
  }
  clear(){ this.ctx.fillStyle = '#000'; this.ctx.fillRect(0, 0, this.W, this.H); }
  static c565(c){
    const r = ((c >> 11) & 0x1F) * 255 / 31 | 0;
    const g = ((c >> 5) & 0x3F) * 255 / 63 | 0;
    const b = (c & 0x1F) * 255 / 31 | 0;
    return `rgb(${r},${g},${b})`;
  }
  static FONTS = { 1: 9, 2: 14, 4: 26, 6: 44, 7: 44, 8: 56 };

  getTargetCtx(){
    return this.activeSprite ? this.activeSprite.ctx : this.ctx;
  }

  fillScreen(c){
    const ctx = this.getTargetCtx();
    ctx.fillStyle = TFTDisplay.c565(c);
    ctx.fillRect(0, 0, this.W, this.H);
  }
  fillRect(x,y,w,h,c){
    if (w<=0||h<=0) return;
    const ctx = this.getTargetCtx();
    ctx.fillStyle = TFTDisplay.c565(c);
    ctx.fillRect(x,y,w,h);
  }
  drawRect(x,y,w,h,c){
    const ctx = this.getTargetCtx();
    ctx.strokeStyle = TFTDisplay.c565(c);
    ctx.lineWidth = 1;
    ctx.strokeRect(x+.5, y+.5, Math.max(0,w-1), Math.max(0,h-1));
  }
  drawLine(x0,y0,x1,y1,c){
    const ctx = this.getTargetCtx();
    ctx.strokeStyle = TFTDisplay.c565(c);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0+.5, y0+.5);
    ctx.lineTo(x1+.5, y1+.5);
    ctx.stroke();
  }
  drawFastHLine(x,y,w,c){ this.drawLine(x, y, x + w - 1, y, c); }
  drawFastVLine(x,y,h,c){ this.drawLine(x, y, x, y + h - 1, c); }
  drawPixel(x,y,c){
    const ctx = this.getTargetCtx();
    ctx.fillStyle = TFTDisplay.c565(c);
    ctx.fillRect(x, y, 1, 1);
  }
  drawCircle(x,y,r,c){
    const ctx = this.getTargetCtx();
    ctx.strokeStyle = TFTDisplay.c565(c);
    ctx.beginPath(); ctx.arc(x, y, Math.abs(r), 0, Math.PI*2); ctx.stroke();
  }
  fillCircle(x,y,r,c){
    const ctx = this.getTargetCtx();
    ctx.fillStyle = TFTDisplay.c565(c);
    ctx.beginPath(); ctx.arc(x, y, Math.abs(r), 0, Math.PI*2); ctx.fill();
  }
  drawTriangle(x0,y0,x1,y1,x2,y2,c){
    this.drawLine(x0,y0,x1,y1,c);
    this.drawLine(x1,y1,x2,y2,c);
    this.drawLine(x2,y2,x0,y0,c);
  }
  fillTriangle(x0,y0,x1,y1,x2,y2,c){
    const ctx = this.getTargetCtx();
    ctx.fillStyle = TFTDisplay.c565(c);
    ctx.beginPath();
    ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.fill();
  }
  _rr(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  drawRoundRect(x,y,w,h,r,c){
    const ctx = this.getTargetCtx();
    ctx.strokeStyle = TFTDisplay.c565(c);
    ctx.lineWidth = 1;
    this._rr(ctx, x+.5, y+.5, Math.max(0,w-1), Math.max(0,h-1), r);
    ctx.stroke();
  }
  fillRoundRect(x,y,w,h,r,c){
    if (w<=0||h<=0) return;
    const ctx = this.getTargetCtx();
    ctx.fillStyle = TFTDisplay.c565(c);
    this._rr(ctx, x, y, w, h, r);
    ctx.fill();
  }
  setTextColor(fg,bg){
    this.fgColor = TFTDisplay.c565(fg);
    this.bgColor = (bg != null) ? TFTDisplay.c565(bg) : null;
  }
  setTextDatum(d){ this.textDatum = d; }
  setTextSize(s){ this.textSize = Math.max(1, s|0); }
  drawString(str,x,y,font=2){
    const ctx = this.getTargetCtx();
    const base = TFTDisplay.FONTS[font] || 14;
    const sz = Math.max(6, Math.floor(base * this.textSize));
    ctx.font = `bold ${sz}px "Courier New",monospace`;
    str = String(str != null ? str : '');
    const w = ctx.measureText(str).width;

    let rx = x, ry = y;
    if (this.textDatum === MC_DATUM) { rx = x - w / 2; ry = y - sz / 2; }
    else if (this.textDatum === TC_DATUM) { rx = x - w / 2; ry = y; }
    else if (this.textDatum === ML_DATUM) { rx = x; ry = y - sz / 2; }

    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    if (this.bgColor) {
      ctx.fillStyle = this.bgColor;
      ctx.fillRect(rx, ry, w, sz);
    }
    ctx.fillStyle = this.fgColor;
    ctx.fillText(str, rx, ry);
  }
  color(r,g,b){
    r = Math.max(0, Math.min(255, r|0));
    g = Math.max(0, Math.min(255, g|0));
    b = Math.max(0, Math.min(255, b|0));
    return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
  }
}

class VirtualSprite {
  constructor(w, h){
    this.w = w; this.h = h;
    this.canvas = document.createElement('canvas');
    this.canvas.width = w; this.canvas.height = h;
    this.ctx = this.canvas.getContext('2d', {alpha:false});
    this.ctx.imageSmoothingEnabled = false;
    this.fillScreen(0x0000);
  }
  fillScreen(c){
    this.ctx.fillStyle = TFTDisplay.c565(c);
    this.ctx.fillRect(0, 0, this.w, this.h);
  }
}

/* =========================================================
   5. NOTIFICATION OVERLAY (Buffered Slide In/Out)
   ========================================================= */
class NotificationOverlay {
  constructor(sim){
    this.sim = sim;
    this.queue = [];
    this.bgData = null;
    this.bgCaptured = false;
    this.nextId = 1;
    this.ANIM_MS = 180;
  }

  post(title, message, iconStr = 'info', durationMs = 3000){
    const id = this.nextId++;
    let iconType = 'info';
    const s = String(iconStr).toLowerCase();
    if (s.includes('warn')) iconType = 'warn';
    else if (s.includes('err') || s.includes('danger')) iconType = 'error';
    else if (s.includes('succ') || s.includes('ok')) iconType = 'success';

    const notif = {
      id,
      title: String(title || 'Notification').substring(0, 24),
      message: String(message || '').substring(0, 48),
      iconType,
      durationMs: Math.max(500, Math.min(15000, durationMs || 3000)),
      state: 'SLIDE_IN',
      currentY: -44,
      animStartTime: performance.now(),
      displayStartTime: 0
    };

    this.queue.push(notif);
    log(`[Notify #${id}] ${notif.title}: ${notif.message}`, 'ok');
    return id;
  }

  dismiss(id){
    if (this.queue.length === 0) return false;
    const idx = this.queue.findIndex(n => n.id === id);
    if (idx === -1) return false;
    if (idx === 0){
      if (this.queue[0].state !== 'SLIDE_OUT'){
        this.queue[0].state = 'SLIDE_OUT';
        this.queue[0].animStartTime = performance.now();
      }
    } else {
      this.queue.splice(idx, 1);
    }
    return true;
  }

  clearAll(){
    this.restoreBg();
    this.queue = [];
  }

  captureBg(){
    if (this.bgCaptured) return;
    const ctx = this.sim.disp.ctx;
    this.bgData = ctx.getImageData(0, 0, 240, 64);
    this.bgCaptured = true;
  }

  restoreBg(){
    if (this.bgCaptured && this.bgData){
      this.sim.disp.ctx.putImageData(this.bgData, 0, 0);
      this.bgCaptured = false;
      this.bgData = null;
    }
  }

  updateAndRender(){
    if (this.queue.length === 0) return;

    if (!this.bgCaptured){
      this.captureBg();
    }

    const item = this.queue[0];
    const now = performance.now();
    const RESTING_Y = 8;
    const HIDDEN_Y = -44;
    const CARD_X = 8, CARD_W = 224, CARD_H = 42, CARD_R = 6;

    let targetY = item.currentY;

    if (item.state === 'SLIDE_IN'){
      const elapsed = now - item.animStartTime;
      if (elapsed >= this.ANIM_MS){
        targetY = RESTING_Y;
        item.state = 'DISPLAYING';
        item.displayStartTime = now;
      } else {
        const t = elapsed / this.ANIM_MS;
        const ease = 1 - Math.pow(1 - t, 3);
        targetY = HIDDEN_Y + (RESTING_Y - HIDDEN_Y) * ease;
      }
    } else if (item.state === 'DISPLAYING'){
      targetY = RESTING_Y;
      if (now - item.displayStartTime >= item.durationMs){
        item.state = 'SLIDE_OUT';
        item.animStartTime = now;
      }
    } else if (item.state === 'SLIDE_OUT'){
      const elapsed = now - item.animStartTime;
      if (elapsed >= this.ANIM_MS){
        this.restoreBg();
        this.queue.shift();
        if (this.queue.length > 0){
          this.queue[0].state = 'SLIDE_IN';
          this.queue[0].currentY = HIDDEN_Y;
          this.queue[0].animStartTime = performance.now();
          this.captureBg();
        }
        return;
      } else {
        const t = elapsed / this.ANIM_MS;
        const ease = t * t * t;
        targetY = RESTING_Y + (HIDDEN_Y - RESTING_Y) * ease;
      }
    }

    item.currentY = targetY;

    if (this.bgData){
      this.sim.disp.ctx.putImageData(this.bgData, 0, 0);
    }

    const ctx = this.sim.disp.ctx;
    ctx.save();
    const y = Math.round(targetY);

    let borderColor = '#00f0ff';
    let badgeBg = '#007acc';
    let badgeText = 'i';
    if (item.iconType === 'success'){
      borderColor = '#00e676'; badgeBg = '#00e676'; badgeText = '✓';
    } else if (item.iconType === 'warn'){
      borderColor = '#ffb300'; badgeBg = '#ffb300'; badgeText = '!';
    } else if (item.iconType === 'error'){
      borderColor = '#ff3d00'; badgeBg = '#ff3d00'; badgeText = '✕';
    }

    ctx.fillStyle = '#101421';
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1.5;
    this.sim.disp._rr(ctx, CARD_X, y, CARD_W, CARD_H, CARD_R);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CARD_X + 16, y + 21, 10, 0, Math.PI * 2);
    ctx.fillStyle = badgeBg;
    ctx.fill();

    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeText, CARD_X + 16, y + 21);

    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(item.title, CARD_X + 34, y + 6);

    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#b0b8c4';
    ctx.fillText(item.message, CARD_X + 34, y + 24);

    ctx.restore();
  }
}

/* =========================================================
   6. ON-SCREEN KEYBOARD (Touch Input)
   ========================================================= */
class OnScreenKeyboard {
  constructor(sim){
    this.sim = sim; this.text = ''; this.caps = false; this.active = false;
    this.resolve = null; this.promptMsg = '';
    this.kw = 12; this.kh = 4;
    this.keyset = [
      [['1','!'],['2','@'],['3','#'],['4','$'],['5','%'],['6','^'],['7','&'],['8','*'],['9','('],['0',')'],['-','_'],['=','+']],
      [['q','Q'],['w','W'],['e','E'],['r','R'],['t','T'],['y','Y'],['u','U'],['i','I'],['o','O'],['p','P'],['[','{'],[']','}']],
      [['a','A'],['s','S'],['d','D'],['f','F'],['g','G'],['h','H'],['j','J'],['k','K'],['l','L'],[';',':'],['\'','"'],['\\','|']],
      [['\\','|'],['z','Z'],['x','X'],['c','C'],['v','V'],['b','B'],['n','N'],['m','M'],[',','<'],['.','>'],['/','?'],[' ',' ']]
    ];
  }
  show(promptMsg, initial){
    this.sim.touch.touched = false;
    this.sim.touch.justPressed = false;
    this.text = initial != null ? String(initial) : ''; 
    this.caps = false; 
    this.active = true;
    this.promptMsg = promptMsg || 'Input';
    this.draw();
    return new Promise((res) => { this.resolve = res; });
  }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.setTextDatum(TL_DATUM);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.drawString(String(this.promptMsg).substring(0, 24), 5, 10, 2);

    d.drawRect(5, 30, 230, 30, TFT_GREEN);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    const disp = this.text.length > 18 ? this.text.substring(this.text.length - 18) : this.text;
    d.drawString(disp + '_', 10, 38, 2);

    const btnW = 240 / 5;
    const btns = ['OK', this.caps ? 'abc' : 'ABC', 'DEL', 'SPACE', 'ESC'];
    d.setTextDatum(MC_DATUM);
    for (let i = 0; i < 5; i++){
      d.drawRect(i * btnW, 70, btnW, 30, TFT_GREEN);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString(btns[i], i * btnW + btnW / 2, 85, 2);
    }

    const keyW = 240 / this.kw;
    const keyH = (320 - 110) / this.kh;
    for (let y = 0; y < this.kh; y++){
      for (let x = 0; x < this.kw; x++){
        const px = x * keyW;
        const py = 110 + y * keyH;
        d.drawRect(px, py, keyW, keyH, TFT_DARKGREY);
        const c = this.caps ? this.keyset[y][x][1] : this.keyset[y][x][0];
        d.setTextColor(TFT_WHITE, TFT_BLACK);
        d.drawString(c, px + keyW / 2, py + keyH / 2, 2);
      }
    }
  }
  handleTouch(x, y){
    if (y >= 70 && y <= 100){
      const btnW = 240 / 5;
      const idx = Math.floor(x / btnW);
      if (idx === 0) this.finish(this.text);
      else if (idx === 1) { this.caps = !this.caps; this.draw(); }
      else if (idx === 2) { if (this.text.length > 0) this.text = this.text.slice(0, -1); this.draw(); }
      else if (idx === 3) { this.text += ' '; this.draw(); }
      else this.finish('');
      return;
    }
    if (y >= 110){
      const keyW = 240 / this.kw;
      const keyH = (320 - 110) / this.kh;
      const kx = Math.floor(x / keyW);
      const ky = Math.floor((y - 110) / keyH);
      if (kx >= 0 && kx < this.kw && ky >= 0 && ky < this.kh){
        const c = this.caps ? this.keyset[ky][kx][1] : this.keyset[ky][kx][0];
        this.text += c; this.draw();
      }
    }
  }
  finish(val){
    if (!this.active) return;
    this.active = false;
    const r = this.resolve;
    this.resolve = null;
    if (r) r(val);
  }
}

/* =========================================================
   7. ASYNC TRANSPILER (Guarantees Non-Blocking 60 FPS Event Loop)
   ========================================================= */
function universalAsyncTransform(source) {
  let code = source;
  const fnNames = new Set();
  const regex = /\bfunction\s+([a-zA-Z0-9_$]+)\s*\(/g;
  let match;
  while ((match = regex.exec(source)) !== null) {
    fnNames.add(match[1]);
  }

  code = code.replace(/\bfunction\s+([a-zA-Z0-9_$]+)\s*\(/g, 'async function $1(');
  code = code.replace(/\bfunction\s*\(/g, 'async function(');

  code = code.replace(/(?<!await\s+)\bSystem\.delay\s*\(/g, 'await System.delay(');
  code = code.replace(/(?<!await\s+)\bSystem\.delayMicroseconds\s*\(/g, 'await System.delayMicroseconds(');
  code = code.replace(/(?<!await\s+)\bSystem\.prompt\s*\(/g, 'await System.prompt(');

  fnNames.forEach(fn => {
    const callRegex = new RegExp(`(?<!async\\s+function\\s+|function\\s+|await\\s+|\\.)\\b${fn}\\s*\\(`, 'g');
    code = code.replace(callRegex, `await ${fn}(`);
  });

  return code;
}

/* =========================================================
   8. RUNTIME APIS SPECIFICATION
   ========================================================= */
function buildRuntimeAPIs(sim){
  const disp = sim.disp;
  const startTime = Date.now();

  const FastMath = {
    sin: (r) => Math.sin(r),
    cos: (r) => Math.cos(r),
    tan: (r) => Math.tan(r),
    fastSin: (d) => Math.sin(d * Math.PI / 180),
    fastCos: (d) => Math.cos(d * Math.PI / 180),
    asin: (x) => Math.asin(x),
    acos: (x) => Math.acos(x),
    atan2: (y, x) => Math.atan2(y, x),
    sqrt: (x) => Math.sqrt(x),
    hypot: (x, y) => Math.hypot(x, y),
    clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
    lerp: (a, b, t) => a + t * (b - a),
    map: (v, inMin, inMax, outMin, outMax) => (v - inMin) * (outMax - outMin) / (inMax - inMin) + outMin,
    degToRad: (d) => d * (Math.PI / 180),
    radToDeg: (r) => r * (180 / Math.PI),
    random: () => Math.random(),
    randomRange: (min, max) => min + Math.random() * (max - min),
    vec2Distance: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
    vec3Distance: (x1, y1, z1, x2, y2, z2) => {
      const dx=x2-x1, dy=y2-y1, dz=z2-z1;
      return Math.sqrt(dx*dx + dy*dy + dz*dz);
    },
    dot2: (x1, y1, x2, y2) => x1 * x2 + y1 * y2,
    dot3: (x1, y1, z1, x2, y2, z2) => x1 * x2 + y1 * y2 + z1 * z2,
    normalize2: (x, y) => {
      const l = Math.hypot(x, y);
      return l > 0.0001 ? { x: x/l, y: y/l } : { x: 0, y: 0 };
    },
    normalize3: (x, y, z) => {
      const l = Math.sqrt(x*x + y*y + z*z);
      return l > 0.0001 ? { x: x/l, y: y/l, z: z/l } : { x: 0, y: 0, z: 0 };
    },
    PI: Math.PI,
    HALF_PI: Math.PI * 0.5,
    TWO_PI: Math.PI * 2.0,
    DEG_TO_RAD: Math.PI / 180,
    RAD_TO_DEG: 180 / Math.PI
  };

  const FS = {
    readTextFile: (p) => sim.vfs.readTextFile(p),
    writeTextFile: (p, c) => sim.vfs.writeTextFile(p, c),
    appendTextFile: (p, c) => sim.vfs.appendTextFile(p, c),
    deleteFile: (p) => sim.vfs.deleteFile(p),
    renameFile: (f, t) => sim.vfs.renameFile(f, t),
    exists: (p) => sim.vfs.exists(p),
    listDir: (p) => sim.vfs.listDir(p),
    mkdir: (p) => sim.vfs.mkdir(p),
    rmdir: (p) => sim.vfs.rmdir(p),
    isDirectory: (p) => sim.vfs.isDirectory(p),
    isFile: (p) => sim.vfs.isFile(p),
    getFileSize: (p) => sim.vfs.getFileSize(p),
    getTotalSpace: (d) => sim.vfs.getTotalSpace(d),
    getUsedSpace: (d) => sim.vfs.getUsedSpace(d),
    getFreeSpace: (d) => sim.vfs.getFreeSpace(d),
    mountSD: () => true,
    unmountSD: () => {}
  };

  const PWM = {
    setup: (pin, freq = 5000) => pin,
    write: (pin, duty) => {},
    setDuty: (pin, percent) => {},
    setFrequency: (pin, freq) => {},
    setTone: (pin, freq, dur = 0) => audioHardware.setTone(pin, freq, dur),
    stopTone: (pin) => audioHardware.stopTone(pin),
    setServo: (pin, angle) => {},
    detach: (pin) => audioHardware.stopTone(pin),
    reset: () => audioHardware.reset()
  };

  const Network = {
    get: async (url) => {
      try {
        const res = await fetch(url);
        const body = await res.text();
        return { status: res.status, body, error: "" };
      } catch(e) {
        return { status: 0, body: "", error: e.message };
      }
    },
    post: async (url, body, contentType = "application/json") => {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': contentType },
          body: String(body)
        });
        const respBody = await res.text();
        return { status: res.status, body: respBody, error: "" };
      } catch(e) {
        return { status: 0, body: "", error: e.message };
      }
    },
    isConnected: () => true,
    hasInternet: () => navigator.onLine,
    getIP: () => "192.168.1.100",
    getSSID: () => "KryonOS_Home",
    getRSSI: () => -55,
    showWiFiPrompt: () => sim.notif.post("WiFi", "Device is online", "ok")
  };

  const System = {
    fillScreen: (c) => disp.fillScreen(c),
    fillRect: (x,y,w,h,c) => disp.fillRect(x,y,w,h,c),
    drawRect: (x,y,w,h,c) => disp.drawRect(x,y,w,h,c),
    drawFastHLine: (x,y,w,c) => disp.drawFastHLine(x,y,w,c),
    drawFastVLine: (x,y,h,c) => disp.drawFastVLine(x,y,h,c),
    drawLine: (a,b,c,d,e) => disp.drawLine(a,b,c,d,e),
    drawPixel: (x,y,c) => disp.drawPixel(x,y,c),
    drawCircle: (x,y,r,c) => disp.drawCircle(x,y,r,c),
    fillCircle: (x,y,r,c) => disp.fillCircle(x,y,r,c),
    drawTriangle: (...a) => disp.drawTriangle(...a),
    fillTriangle: (...a) => disp.fillTriangle(...a),
    drawRoundRect: (...a) => disp.drawRoundRect(...a),
    fillRoundRect: (...a) => disp.fillRoundRect(...a),
    drawString: (s, x, y, f=2) => disp.drawString(s, x, y, f),
    setTextColor: (f, b) => disp.setTextColor(f, b),
    setTextSize: (s) => disp.setTextSize(s),
    color: (r, g, b) => disp.color(r, g, b),
    screenWidth: () => 240,
    screenHeight: () => 320,

    createSprite: (w, h) => {
      disp.activeSprite = new VirtualSprite(w, h);
      return true;
    },
    deleteSprite: () => { disp.activeSprite = null; },
    pushSprite: (x, y) => {
      if (disp.activeSprite) disp.ctx.drawImage(disp.activeSprite.canvas, x, y);
    },
    bindSprite: (enable) => { if (!enable) disp.activeSprite = null; },

    getTouch: () => {
      if (sim.exitRequested) throw Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' });
      if (sim.keyboard.active) return { x: 0, y: 0, touched: false };
      const t = sim.touch;
      // Also allow touching the top right corner inside the canvas to exit
      if ((t.touched || t.justPressed) && t.x >= 200 && t.y <= 40) {
        throw Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' });
      }
      const wasTouched = t.touched || t.justPressed;
      t.justPressed = false;
      return { x: t.x, y: t.y, touched: wasTouched };
    },

    millis: () => Date.now() - startTime,
    micros: () => (Date.now() - startTime) * 1000,
    delay: (ms) => new Promise((res, rej) => {
      const cap = Math.min(Math.max(0, ms|0), 30000);
      const start = Date.now();
      const tick = () => {
        if (sim.exitRequested){ rej(Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' })); return; }
        if (Date.now() - start >= cap){ res(); return; }
        setTimeout(tick, 10);
      };
      tick();
    }),
    delayMicroseconds: (us) => new Promise(res => setTimeout(res, Math.max(1, (us/1000)|0))),
    print: (...m) => log(m.join(' ')),
    println: (...m) => log(m.join(' ')),
    log: (...m) => log(m.join(' ')),
    getYear: () => new Date().getFullYear(),
    getMonth: () => new Date().getMonth() + 1,
    getDay: () => new Date().getDate(),
    getSeconds: () => new Date().getSeconds(),
    getTime: () => new Date().toLocaleTimeString(),
    getDate: () => new Date().toLocaleDateString(),
    getTimezone: () => "UTC+6",
    getOSVersion: () => KRYONOS_VERSION,
    getAPILevel: () => KRYONOS_API_LEVEL,
    prompt: (msg, init) => sim.keyboard.show(msg, init),
    notify: (title, msg, icon = 'info', dur = 3000) => sim.notif.post(title, msg, icon, dur),

    math: FastMath,
    pwm: PWM,
    gpio: {
      pinMode: () => {}, digitalWrite: () => {}, digitalRead: () => 0,
      analogRead: () => 512, analogWrite: () => {},
      OUTPUT: 1, INPUT: 0, INPUT_PULLUP: 2, HIGH: 1, LOW: 0
    },
    crypto: {
      sha256: () => "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
      randomBytes: (len) => Array.from({length:len}, () => Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join('')
    }
  };

  return { System, FastMath, FS, PWM, Network };
}

/* =========================================================
   9. LAUNCHER UI (Scroller & Dynamic App List)
   ========================================================= */
class LauncherUI {
  constructor(sim){
    this.sim = sim;
    this.selectedIndex = 1;
    this.scrollOffset = 0;
    this.apps = [];
  }

  scanApps(){
    this.apps = [];
    for (const d of ['/local/apps', '/sd/apps']){
      if (!this.sim.vfs.isDirectory(d)) continue;
      for (const e of this.sim.vfs.listDirFull(d)){
        if (e.isDir){
          const jp = e.path + '/app.json';
          if (this.sim.vfs.exists(jp)){
            try {
              const o = JSON.parse(this.sim.vfs.readTextFile(jp));
              const n = o.name || e.name;
              if (!this.apps.find(a => a.name === n)) {
                this.apps.push({ name: n, path: e.path, isFolder: true });
              }
            } catch(err){}
          }
        }
      }
    }
  }

  total(){ return this.apps.length + 7; }

  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('KryonOS Home', 120, 21, 2);

    d.fillRect(10, 45, 220, 230, TFT_BLACK);
    const total = this.total();
    const pp = 7; // Items per page

    for (let i = 0; i < pp; i++){
      const idx = this.scrollOffset + i;
      if (idx >= total) break;
      const y = 45 + i * 30;
      let name = '', isHdr = false;

      if (idx === 0) { name = '[ SYSTEM ]'; isHdr = true; }
      else if (idx === 1) name = 'App Store';
      else if (idx === 2) name = 'App Installer';
      else if (idx === 3) name = 'Kryon Cloud';
      else if (idx === 4) name = 'Settings';
      else if (idx === 5) name = 'Help Center';
      else if (idx === 6) { name = '[ APPS ]'; isHdr = true; }
      else name = this.apps[idx - 7].name;

      if (isHdr){
        d.setTextColor(TFT_DARKGREY, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString(name, 15, y + 12, 2);
      } else if (idx === this.selectedIndex){
        d.fillRect(10, y, 220, 25, TFT_WHITE);
        d.setTextColor(TFT_BLACK, TFT_WHITE);
        d.setTextDatum(ML_DATUM);
        d.drawString('> ' + name, 15, y + 12, 2);
      } else {
        d.setTextColor(TFT_WHITE, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString('  ' + name, 15, y + 12, 2);
      }
    }

    // Scrollbar indicator
    if (total > pp) {
      const sbH = Math.max(16, (230 * pp) / total);
      const sbY = 45 + (this.scrollOffset * (230 - sbH)) / (total - pp);
      d.fillRect(231, 45, 3, 230, TFT_DARKGREY);
      d.fillRect(231, sbY, 3, sbH, TFT_WHITE);
    }

    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('UP', 30, 300, 2);  d.drawString('|', 60, 300, 2);
    d.drawString('SEL', 120, 300, 2); d.drawString('|', 180, 300, 2);
    d.drawString('DN', 210, 300, 2);
  }

  handleTouch(x, y){
    const total = this.total();
    const pp = 7;

    // Direct List Tap
    if (y >= 45 && y <= 270){
      const clicked = this.scrollOffset + Math.floor((y - 45) / 30);
      if (clicked < total && clicked !== 0 && clicked !== 6){
        this.selectedIndex = clicked;
        this.draw();
        this.execute();
      }
      return;
    }

    // Bottom Navigation Buttons
    if (y >= 285 && y <= 315){
      if (x < 60){ // UP
        if (this.selectedIndex > 1){
          this.selectedIndex--;
          if (this.selectedIndex === 6) this.selectedIndex--; // Skip header
          if (this.selectedIndex < this.scrollOffset){
            this.scrollOffset = this.selectedIndex;
          }
          if (this.selectedIndex === 1) this.scrollOffset = 0;
          this.draw();
        } else if (this.scrollOffset > 0) {
          this.scrollOffset = 0;
          this.draw();
        }
      } else if (x > 60 && x < 180){ // SEL
        this.execute();
      } else if (x > 180){ // DN
        if (this.selectedIndex < total - 1){
          this.selectedIndex++;
          if (this.selectedIndex === 6) this.selectedIndex++; // Skip header
          if (this.selectedIndex >= this.scrollOffset + pp){
            this.scrollOffset = this.selectedIndex - pp + 1;
          }
          this.draw();
        }
      }
    }
  }

  execute(){
    const s = this.selectedIndex;
    if (s === 1) this.sim.setState(STATE_APP_STORE);
    else if (s === 2) this.sim.setState(STATE_INSTALLER);
    else if (s === 3) this.sim.notif.post("KryonCloud", "Online Gateway Synced", "ok");
    else if (s === 4) this.sim.setState(STATE_SETTINGS);
    else if (s === 5) this.sim.setState(STATE_HELP_CENTER);
    else if (s > 6 && this.apps[s - 7]) this.sim.launchApp(this.apps[s - 7]);
  }
}

/* =========================================================
   11. APP STORE CLASS DEFINITION
   ========================================================= */
class AppStoreUI {
  constructor(sim){
    this.sim = sim;
    this.state = 0; // 0=Categories, 1=Apps, 2=Details, 3=Notice
    this.INDEX_URL = "https://raw.githubusercontent.com/Haris16-code/KryonOS-AppStore/refs/heads/main/index.json";
    this.categories = [];
    this.currentApps = [];
    this.currentCategoryName = '';
    this.selectedCatIdx = 0;
    this.selectedAppIdx = 0;
    this.scrollOffset = 0;
    this.dialogMsg = '';
    this.loading = false;
  }

  async fetchCategories(){
    this.loading = true;
    this.dialogMsg = "Fetching App Store...";
    this.draw();
    try {
      const res = await fetch(this.INDEX_URL);
      const data = await res.json();
      this.categories = [{ name: "[ Check For Apps Update ]", url: "UPDATE_ACTION" }];
      if (data && data.categories) {
        for (const [name, url] of Object.entries(data.categories)) {
          this.categories.push({ name, url: String(url) });
        }
      }
      this.loading = false;
      this.draw();
    } catch(e) {
      this.dialogMsg = "Store Offline: " + e.message;
      this.state = 3;
      this.loading = false;
      this.draw();
    }
  }

  async fetchCategoryApps(url){
    if (url === "UPDATE_ACTION") {
      this.dialogMsg = "All Apps are up to date!";
      this.state = 3;
      this.draw();
      return;
    }
    this.loading = true;
    this.dialogMsg = "Loading " + this.currentCategoryName + "...";
    this.draw();
    try {
      const res = await fetch(url);
      const data = await res.json();
      this.currentApps = [];
      if (data && data.apps) {
        for (const [id, info] of Object.entries(data.apps)) {
          this.currentApps.push({
            id,
            name: id.charAt(0).toUpperCase() + id.slice(1),
            metaUrl: info.meta,
            appUrl: info.app,
            author: "GitHub Author",
            version: "1.0.0",
            description: "Tap to view details"
          });
        }
      }
      this.state = 1;
      this.selectedAppIdx = 0;
      this.scrollOffset = 0;
      this.loading = false;
      this.draw();
    } catch(e) {
      this.dialogMsg = "Failed to load apps: " + e.message;
      this.state = 3;
      this.loading = false;
      this.draw();
    }
  }

  async fetchDetails(app){
    this.loading = true;
    this.dialogMsg = "Loading details...";
    this.draw();
    try {
      const res = await fetch(app.metaUrl);
      const meta = await res.json();
      app.name = meta.name || app.name;
      app.author = meta.author || "Unknown";
      app.version = meta.version || "1.0.0";
      app.description = meta.description || "No description provided.";
      app.packageName = meta.packageName || app.id;
    } catch(e){}
    this.loading = false;
    this.state = 2;
    this.draw();
  }

  async installApp(app){
    this.loading = true;
    this.dialogMsg = "Installing " + app.name + "...";
    this.draw();
    try {
      const resMeta = await fetch(app.metaUrl);
      const meta = await resMeta.json();
      const resCode = await fetch(app.appUrl);
      const code = await resCode.text();

      const pkg = meta.packageName || app.id;
      const dir = "/local/apps/" + pkg;
      this.sim.vfs.mkdir(dir);
      this.sim.vfs.writeTextFile(dir + "/app.json", JSON.stringify(meta, null, 2));
      this.sim.vfs.writeTextFile(dir + "/main.js", code);

      log(`[AppStore] Installed ${meta.name || app.name} successfully!`, "ok");
      this.dialogMsg = `${meta.name || app.name}\nInstalled Successfully!`;
      this.state = 3;
      this.sim.launcher.scanApps();
    } catch(e) {
      this.dialogMsg = "Install error: " + e.message;
      this.state = 3;
    }
    this.loading = false;
    this.draw();
  }

  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);

    let header = 'App Store';
    if (this.state === 1) header = this.currentCategoryName;
    else if (this.state === 2) header = 'App Details';
    else if (this.state === 3) header = 'Notice';
    d.drawString(header, 120, 21, 2);

    d.fillRect(10, 45, 220, 230, TFT_BLACK);

    if (this.loading) {
      d.setTextColor(TFT_YELLOW, TFT_BLACK);
      d.drawString(this.dialogMsg, 120, 160, 2);
      return;
    }

    if (this.state === 0) {
      if (this.categories.length === 0) {
        this.fetchCategories();
        return;
      }
      for (let i = 0; i < 7; i++){
        const idx = this.scrollOffset + i;
        if (idx >= this.categories.length) break;
        const y = 45 + i * 30;
        const label = this.categories[idx].name;

        if (idx === this.selectedCatIdx){
          d.fillRect(10, y, 220, 25, TFT_WHITE);
          d.setTextColor(TFT_BLACK, TFT_WHITE);
          d.setTextDatum(ML_DATUM);
          d.drawString('> ' + label, 15, y + 12, 2);
        } else {
          d.setTextColor(TFT_WHITE, TFT_BLACK);
          d.setTextDatum(ML_DATUM);
          d.drawString('  ' + label, 15, y + 12, 2);
        }
      }
      this._drawFooter();
    } else if (this.state === 1) {
      for (let i = 0; i < 7; i++){
        const idx = this.scrollOffset + i;
        if (idx >= this.currentApps.length) break;
        const y = 45 + i * 30;
        const label = this.currentApps[idx].name;

        if (idx === this.selectedAppIdx){
          d.fillRect(10, y, 220, 25, TFT_WHITE);
          d.setTextColor(TFT_BLACK, TFT_WHITE);
          d.setTextDatum(ML_DATUM);
          d.drawString('> ' + label, 15, y + 12, 2);
        } else {
          d.setTextColor(TFT_WHITE, TFT_BLACK);
          d.setTextDatum(ML_DATUM);
          d.drawString('  ' + label, 15, y + 12, 2);
        }
      }
      this._drawFooter();
    } else if (this.state === 2) {
      const a = this.currentApps[this.selectedAppIdx];
      if (!a) { this.state = 1; this.draw(); return; }

      d.setTextDatum(TL_DATUM);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString('Name:    ' + a.name, 15, 55, 2);
      d.drawString('Author:  ' + a.author, 15, 78, 2);
      d.drawString('Version: ' + a.version, 15, 101, 2);
      d.setTextColor(TFT_LIGHTGREY, TFT_BLACK);
      d.drawString('Desc: ' + String(a.description).substring(0, 55), 15, 130, 2);

      d.setTextDatum(MC_DATUM);
      d.fillRoundRect(25, 230, 80, 30, 4, TFT_GREEN);
      d.setTextColor(TFT_BLACK, TFT_GREEN);
      d.drawString('INSTALL', 65, 245, 2);

      d.fillRoundRect(135, 230, 80, 30, 4, TFT_RED);
      d.setTextColor(TFT_WHITE, TFT_RED);
      d.drawString('CANCEL', 175, 245, 2);
    } else if (this.state === 3) {
      d.fillRoundRect(10, 80, 220, 140, 6, TFT_DARKGREY);
      d.setTextColor(TFT_WHITE, TFT_DARKGREY);
      d.setTextDatum(MC_DATUM);
      const lines = this.dialogMsg.split('\n');
      for (let i = 0; i < lines.length; i++) {
        d.drawString(lines[i], 120, 120 + i * 20, 2);
      }
      d.fillRoundRect(85, 175, 70, 30, 4, TFT_BLUE);
      d.setTextColor(TFT_WHITE, TFT_BLUE);
      d.drawString('OK', 120, 190, 2);
    }
  }

  _drawFooter(){
    const d = this.sim.disp;
    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('BACK', 35, 300, 2);  d.drawString('|', 70, 300, 2);
    d.drawString('UP', 100, 300, 2);   d.drawString('|', 130, 300, 2);
    d.drawString('SEL', 165, 300, 2);  d.drawString('|', 200, 300, 2);
    d.drawString('DN', 220, 300, 2);
  }

  handleTouch(x, y){
    if (this.loading) return;

    if (this.state === 3){
      if (x >= 85 && x <= 155 && y >= 175 && y <= 210){
        this.state = 0; this.draw();
      }
      return;
    }
    if (this.state === 2){
      if (y >= 230 && y <= 260){
        if (x >= 25 && x <= 105) this.installApp(this.currentApps[this.selectedAppIdx]);
        else if (x >= 135 && x <= 215) { this.state = 1; this.draw(); }
      }
      return;
    }
    if (y >= 45 && y <= 270){
      const list = (this.state === 0) ? this.categories : this.currentApps;
      const clicked = this.scrollOffset + Math.floor((y - 45) / 30);
      if (clicked < list.length){
        if (this.state === 0) {
          this.selectedCatIdx = clicked;
          this.currentCategoryName = list[clicked].name;
          this.fetchCategoryApps(list[clicked].url);
        } else {
          this.selectedAppIdx = clicked;
          this.fetchDetails(list[clicked]);
        }
      }
      return;
    }
    if (y >= 285 && y <= 315){
      if (x < 70){
        if (this.state === 1) { this.state = 0; this.draw(); }
        else this.sim.setState(STATE_LAUNCHER);
      } else if (x >= 70 && x < 130){ // UP
        if (this.state === 0 && this.selectedCatIdx > 0) {
          this.selectedCatIdx--;
          if (this.selectedCatIdx < this.scrollOffset) this.scrollOffset = this.selectedCatIdx;
          this.draw();
        } else if (this.state === 1 && this.selectedAppIdx > 0) {
          this.selectedAppIdx--;
          if (this.selectedAppIdx < this.scrollOffset) this.scrollOffset = this.selectedAppIdx;
          this.draw();
        }
      } else if (x >= 130 && x < 200){ // SEL
        if (this.state === 0) {
          this.currentCategoryName = this.categories[this.selectedCatIdx].name;
          this.fetchCategoryApps(this.categories[this.selectedCatIdx].url);
        } else if (this.state === 1) {
          this.fetchDetails(this.currentApps[this.selectedAppIdx]);
        }
      } else if (x >= 200){ // DN
        if (this.state === 0 && this.selectedCatIdx < this.categories.length - 1) {
          this.selectedCatIdx++;
          if (this.selectedCatIdx >= this.scrollOffset + 7) this.scrollOffset++;
          this.draw();
        } else if (this.state === 1 && this.selectedAppIdx < this.currentApps.length - 1) {
          this.selectedAppIdx++;
          if (this.selectedAppIdx >= this.scrollOffset + 7) this.scrollOffset++;
          this.draw();
        }
      }
    }
  }
}

/* =========================================================
   12. MAIN SIMULATOR APPLICATION CONTROLLER
   ========================================================= */
class Simulator {
  constructor(){
    this.canvas = document.getElementById('screen');
    this.disp = new TFTDisplay(this.canvas);
    this.vfs = new IndexedDB_VFS(this);
    this.keyboard = new OnScreenKeyboard(this);
    this.notif = new NotificationOverlay(this);
    this.touch = { x: 0, y: 0, touched: false, justPressed: false };
    this.exitRequested = false;

    this.env = buildRuntimeAPIs(this);
    this.state = STATE_LAUNCHER;

    // Attach all screens
    this.screens = {
      [STATE_LAUNCHER]: new LauncherUI(this),
      [STATE_APP_STORE]: new AppStoreUI(this),
      [STATE_INSTALLER]: new HelpCenterUI(this),
      [STATE_SETTINGS]: new SettingsUI(this),
      [STATE_SETTINGS_WIFI]: new WiFiSettingsUI(this),
      [STATE_SETTINGS_ABOUT]: new AboutDeviceUI(this),
      [STATE_SETTINGS_APPS]: new AboutDeviceUI(this),
      [STATE_SETTINGS_PERMISSIONS]: new AboutDeviceUI(this),
      [STATE_SETTINGS_TIME]: new WiFiSettingsUI(this),
      [STATE_UPDATER_MANUAL]: new SystemUpdaterUI(this),
      [STATE_HELP_CENTER]: new HelpCenterUI(this),
      [STATE_CALIBRATOR]: new TouchCalibratorUI(this),
      [STATE_WEB_APP]: new WiFiSettingsUI(this)
    };
    this.launcher = this.screens[STATE_LAUNCHER];

    this._bindInput();
    this._bindUI();

    this.vfs.init().then(() => {
      this.launcher.scanApps();
      this.setState(STATE_LAUNCHER);
    });

    // 60 FPS Engine Frame Loop
    let frames = 0, lastT = performance.now();
    const countFrame = () => {
      frames++;
      this.notif.updateAndRender();
      requestAnimationFrame(countFrame);
    };
    requestAnimationFrame(countFrame);
    setInterval(() => {
      const now = performance.now();
      const fpsEl = document.getElementById('fps-label');
      if (fpsEl) fpsEl.textContent = Math.round(frames * 1000 / (now - lastT)) + ' fps';
      frames = 0; lastT = now;
    }, 1000);
  }

  onStorageChanged(){
    this.launcher.scanApps();
    if (this.state === STATE_LAUNCHER) this.launcher.draw();
  }

  setState(s){
    this.state = s;
    const labels = {
      [STATE_LAUNCHER]: 'LAUNCHER', [STATE_SETTINGS]: 'SETTINGS',
      [STATE_RUN_APP]: 'RUN_APP', [STATE_APP_STORE]: 'APP_STORE',
      [STATE_SETTINGS_WIFI]: 'WIFI_CONFIG', [STATE_SETTINGS_ABOUT]: 'ABOUT'
    };
    const stEl = document.getElementById('state-label');
    if (stEl) stEl.textContent = labels[s] || ('STATE_' + s);

    // Bezel hardware exit button toggle
    const exitBtn = document.getElementById('hw-exit-btn');
    if (exitBtn) {
      if (s === STATE_RUN_APP) exitBtn.classList.add('active');
      else exitBtn.classList.remove('active');
    }

    if (s === STATE_RUN_APP) return;
    this.disp.fillScreen(TFT_BLACK);
    const scr = this.screens[s];
    if (scr) scr.draw();
  }

  _bindInput(){
    const cvs = this.canvas;
    const getXY = (cx, cy) => {
      const r = cvs.getBoundingClientRect();
      const x = Math.floor((cx - r.left) * cvs.width / r.width);
      const y = Math.floor((cy - r.top) * cvs.height / r.height);
      return { x: Math.max(0, Math.min(cvs.width - 1, x)), y: Math.max(0, Math.min(cvs.height - 1, y)) };
    };

    cvs.addEventListener('mousedown', e => {
      e.preventDefault();
      const p = getXY(e.clientX, e.clientY);
      this._handlePress(p.x, p.y);
    });
    window.addEventListener('mouseup', () => {
      if (this.state === STATE_RUN_APP) this.touch.touched = false;
    });

    cvs.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const p = getXY(t.clientX, t.clientY);
      this._handlePress(p.x, p.y);
    }, {passive:false});
    cvs.addEventListener('touchend', e => {
      e.preventDefault();
      if (this.state === STATE_RUN_APP) this.touch.touched = false;
    }, {passive:false});

    // Hardware exit button in bezel
    document.getElementById('hw-exit-btn').addEventListener('click', () => {
      this.exitRequested = true;
    });

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const scr = this.screens[this.state];
        if (scr && scr.handleTouch) {
          const k = btn.dataset.key;
          if (k === 'up') scr.handleTouch(30, 300);
          else if (k === 'sel') scr.handleTouch(120, 300);
          else if (k === 'dn') scr.handleTouch(210, 300);
        }
      });
    });
  }

  _handlePress(x, y){
    if (this.state === STATE_RUN_APP && x >= 200 && y <= 40){
      this.exitRequested = true;
      return;
    }
    if (this.keyboard.active){
      this.keyboard.handleTouch(x, y);
      return;
    }
    if (this.state === STATE_RUN_APP){
      this.touch.x = x; this.touch.y = y;
      this.touch.touched = true;
      this.touch.justPressed = true;
      return;
    }
    const scr = this.screens[this.state];
    if (scr && scr.handleTouch) {
      scr.handleTouch(x, y);
    }
  }

  async launchApp(app, codeOverride){
    let rawCode = (codeOverride != null) ? codeOverride : this.vfs.readTextFile(app.isFolder ? app.path + '/main.js' : app.path);
    if (!rawCode){ log('Error: main.js not found in storage', 'err'); return; }

    this.exitRequested = false;
    this.touch = { x: 0, y: 0, touched: false, justPressed: false };
    this.setState(STATE_RUN_APP);

    this.disp.fillScreen(TFT_BLACK);

    const transformedCode = universalAsyncTransform(rawCode);

    const scopeKeys = [
      'System', 'FastMath', 'FS', 'PWM', 'Network', 'console', 'print', 'println',
      'BLACK', 'WHITE', 'RED', 'GREEN', 'BLUE', 'YELLOW', 'CYAN', 'MAGENTA', 'ORANGE', 'DARKGREY', 'LIGHTGREY', 'PURPLE', 'NAVY',
      'C_BLACK', 'C_WHITE', 'C_RED', 'C_GREEN', 'C_BLUE', 'C_YELLOW', 'C_CYAN', 'C_MAGENTA', 'C_ORANGE', 'C_DARKGREY', 'C_PURPLE', 'C_NAVY'
    ];

    const scopeVals = [
      this.env.System, this.env.FastMath, this.env.FS, this.env.PWM, this.env.Network,
      { log: (...a)=>log(a.join(' ')), warn: (...a)=>log(a.join(' '), 'warn'), error: (...a)=>log(a.join(' '), 'err'), info: (...a)=>log(a.join(' '), 'info') },
      (...a)=>log(a.join(' ')), (...a)=>log(a.join(' ')),
      TFT_BLACK, TFT_WHITE, TFT_RED, TFT_GREEN, TFT_BLUE, TFT_YELLOW, TFT_CYAN, TFT_MAGENTA, TFT_ORANGE, TFT_DARKGREY, TFT_LIGHTGREY, TFT_PURPLE, TFT_NAVY,
      C_BLACK, C_WHITE, C_RED, C_GREEN, C_BLUE, C_YELLOW, C_CYAN, C_MAGENTA, C_ORANGE, C_DARKGREY, C_PURPLE, C_NAVY
    ];

    let fn;
    try {
      fn = new Function(...scopeKeys, `"use strict"; return (async () => { ${transformedCode} })();`);
    } catch(err) {
      await this._showError(err.message);
      return;
    }

    log('▶ Running: ' + app.name, 'info');
    try {
      await fn(...scopeVals);
      log('■ App finished.');
    } catch(e) {
      audioHardware.reset();
      if (e.message === 'OS_EXIT' || e.code === 'OS_EXIT'){
        log('■ Exited via [✕ EXIT]');
      } else {
        log('✖ App Exception: ' + e.message, 'err');
        await this._showError(e.message);
        return;
      }
    }

    this.exitRequested = false;
    this.setState(STATE_LAUNCHER);
  }

  _showError(msg){
    this.state = STATE_RUN_APP;
    const stEl = document.getElementById('state-label');
    if (stEl) stEl.textContent = 'ERROR';
    this.disp.fillScreen(TFT_RED);
    this.disp.setTextColor(TFT_WHITE, TFT_RED);
    this.disp.setTextDatum(TL_DATUM);
    this.disp.drawString('JS EXCEPTION!', 10, 10, 4);

    const lines = String(msg).split('\n');
    let y = 60;
    for (let i = 0; i < lines.length && i < 8; i++){
      this.disp.drawString(lines[i].substring(0, 38), 10, y, 2);
      y += 20;
    }

    return new Promise(res => {
      const check = setInterval(() => {
        if (this.exitRequested){ clearInterval(check); res(); }
      }, 40);
    }).then(() => this.setState(STATE_LAUNCHER));
  }

  _bindUI(){
    document.getElementById('app-code').value = `// Clean Touch Counter App Demo
var bg = System.color(18, 18, 28);
System.fillScreen(bg);

var count = 0;

function drawUI() {
  System.fillScreen(bg);
  System.setTextColor(WHITE, bg);
  System.drawString("Touch Counter", 35, 30, 4);
  
  System.setTextColor(CYAN, bg);
  System.drawString("Count: " + count, 75, 110, 4);
  
  // Interactive Button
  System.fillRoundRect(30, 200, 180, 50, 8, GREEN);
  System.setTextColor(BLACK, GREEN);
  System.drawString("TAP TO COUNT", 45, 215, 2);
}

drawUI();

while (true) {
  var t = System.getTouch();
  if (t.touched) {
    if (t.y >= 200 && t.y <= 250 && t.x >= 30 && t.x <= 210) {
      count++;
      PWM.setTone(18, 1200 + (count * 40), 60);
      drawUI();
    }
  }
  System.delay(40);
}`;

    document.getElementById('btn-install').addEventListener('click', () => {
      const name = document.getElementById('app-name').value.trim() || 'My App';
      let pkg = document.getElementById('app-pkg').value.trim() || 'com.app.test';
      const code = document.getElementById('app-code').value;
      const dir = '/local/apps/' + pkg;
      this.vfs.mkdir(dir);
      this.vfs.writeTextFile(dir + '/app.json', JSON.stringify({
        name, packageName: pkg, version: '1.0.0', api: 2, author: 'Developer', type: 'App', category: 'Utility'
      }, null, 2));
      this.vfs.writeTextFile(dir + '/main.js', code);
      log('💾 Installed to Virtual VFS: ' + name, 'ok');
      this.launcher.scanApps();
      this.setState(STATE_LAUNCHER);
    });

    document.getElementById('btn-run').addEventListener('click', () => {
      const name = document.getElementById('app-name').value.trim() || 'Live Test';
      const code = document.getElementById('app-code').value;
      this.launchApp({ name, path: '__tmp__', isFolder: true }, code);
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
      if (!confirm('Format storage and reload OS?')) return;
      await this.vfs.reset();
      this.setState(STATE_LAUNCHER);
    });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.KryonOS = new Simulator();
  log('KryonOS Production Emulator v2.0 initialized.', 'ok');
});
</script>
