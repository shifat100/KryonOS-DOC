<script>
/* =========================================================
   Color constants (matches JSBindings.cpp)
   ========================================================= */
const TFT_BLACK=0x0000,TFT_WHITE=0xFFFF,TFT_RED=0xF800;
const TFT_GREEN=0x07E0,TFT_BLUE=0x001F,TFT_YELLOW=0xFFE0;
const TFT_CYAN=0x07FF,TFT_MAGENTA=0xF81F,TFT_ORANGE=0xFD20;
const TFT_DARKGREY=0x7BEF;
const TFT_LIGHTGREY=0xC618,TFT_PURPLE=0x780F;

/* ---------- logger ---------- */
const consoleEl=document.getElementById('console');
function log(msg,cls){
  const d=document.createElement('div');
  if(cls)d.className=cls;
  d.textContent='['+new Date().toLocaleTimeString('en-GB',{hour12:false})+'] '+msg;
  consoleEl.appendChild(d);
  while(consoleEl.children.length>300)consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop=consoleEl.scrollHeight;
}

/* =========================================================
   TFT Display
   ========================================================= */
class TFTDisplay{
  constructor(cv){
    this.canvas=cv;this.ctx=cv.getContext('2d',{alpha:false});
    this.ctx.imageSmoothingEnabled=false;
    this.W=cv.width;this.H=cv.height;
    this.fgColor='#fff';this.bgColor=null;this.textSize=1;
    this.sprite=null;this.spriteBound=false;
    this.clear();
  }
  get target(){return (this.spriteBound&&this.sprite)?this.sprite:this;}
  clear(){this.ctx.fillStyle='#000';this.ctx.fillRect(0,0,this.W,this.H);}
  static c565(c){const r=((c>>11)&0x1F)*255/31|0,g=((c>>5)&0x3F)*255/63|0,b=(c&0x1F)*255/31|0;return `rgb(${r},${g},${b})`;}
  static FONTS={1:8,2:14,4:26,6:44,7:44,8:56};
  fillScreen(c){const t=this.target;t.ctx.fillStyle=TFTDisplay.c565(c);t.ctx.fillRect(0,0,t.W,t.H);}
  fillRect(x,y,w,h,c){if(w<=0||h<=0)return;const t=this.target;t.ctx.fillStyle=TFTDisplay.c565(c);t.ctx.fillRect(x,y,w,h);}
  drawRect(x,y,w,h,c){const t=this.target;t.ctx.strokeStyle=TFTDisplay.c565(c);t.ctx.lineWidth=1;t.ctx.strokeRect(x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1));}
  drawLine(x0,y0,x1,y1,c){const t=this.target;t.ctx.strokeStyle=TFTDisplay.c565(c);t.ctx.beginPath();t.ctx.moveTo(x0+.5,y0+.5);t.ctx.lineTo(x1+.5,y1+.5);t.ctx.stroke();}
  drawPixel(x,y,c){const t=this.target;t.ctx.fillStyle=TFTDisplay.c565(c);t.ctx.fillRect(x,y,1,1);}
  drawCircle(x,y,r,c){const t=this.target;t.ctx.strokeStyle=TFTDisplay.c565(c);t.ctx.beginPath();t.ctx.arc(x,y,Math.abs(r),0,Math.PI*2);t.ctx.stroke();}
  fillCircle(x,y,r,c){const t=this.target;t.ctx.fillStyle=TFTDisplay.c565(c);t.ctx.beginPath();t.ctx.arc(x,y,Math.abs(r),0,Math.PI*2);t.ctx.fill();}
  drawTriangle(x0,y0,x1,y1,x2,y2,c){const t=this.target;t.ctx.strokeStyle=TFTDisplay.c565(c);t.ctx.beginPath();t.ctx.moveTo(x0,y0);t.ctx.lineTo(x1,y1);t.ctx.lineTo(x2,y2);t.ctx.closePath();t.ctx.stroke();}
  fillTriangle(x0,y0,x1,y1,x2,y2,c){const t=this.target;t.ctx.fillStyle=TFTDisplay.c565(c);t.ctx.beginPath();t.ctx.moveTo(x0,y0);t.ctx.lineTo(x1,y1);t.ctx.lineTo(x2,y2);t.ctx.closePath();t.ctx.fill();}
  _rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  drawRoundRect(x,y,w,h,r,c){const t=this.target;t.ctx.strokeStyle=TFTDisplay.c565(c);t.ctx.lineWidth=1;this._rr(t.ctx,x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1),r);t.ctx.stroke();}
  fillRoundRect(x,y,w,h,r,c){if(w<=0||h<=0)return;const t=this.target;t.ctx.fillStyle=TFTDisplay.c565(c);this._rr(t.ctx,x,y,w,h,r);t.ctx.fill();}
  drawFastVLine(x,y,h,c){this.fillRect(x,y,1,h,c);}
  drawFastHLine(x,y,w,c){this.fillRect(x,y,w,1,c);}
  setTextColor(fg,bg){this.fgColor=TFTDisplay.c565(fg);this.bgColor=(bg!=null)?TFTDisplay.c565(bg):null;}
  setTextSize(s){this.textSize=s;}
  drawString(str,x,y,font=2){
    const t=this.target;
    const base=TFTDisplay.FONTS[font]||14;
    const sz=Math.max(6,Math.floor(base*this.textSize));
    t.ctx.font=`bold ${sz}px "Courier New",monospace`;
    t.ctx.textBaseline='top';t.ctx.textAlign='left';
    str=String(str);
    if(this.bgColor){const w=t.ctx.measureText(str).width;t.ctx.fillStyle=this.bgColor;t.ctx.fillRect(x,y,w,sz);}
    t.ctx.fillStyle=this.fgColor;
    t.ctx.fillText(str,x,y);
  }
  textWidth(str,font=2){
    const base=TFTDisplay.FONTS[font]||14;
    const sz=Math.max(6,Math.floor(base*this.textSize));
    this.ctx.font=`bold ${sz}px "Courier New",monospace`;
    return this.ctx.measureText(String(str)).width;
  }
  color(r,g,b){r=Math.max(0,Math.min(255,r|0));g=Math.max(0,Math.min(255,g|0));b=Math.max(0,Math.min(255,b|0));return ((r&0xF8)<<8)|((g&0xFC)<<3)|(b>>3);}
}

/* =========================================================
   Virtual File System
   ========================================================= */
class VirtualFS{
  constructor(){this.reset();}
  reset(){
    this.files=new Map();
    ['/local','/local/apps','/sd','/sd/apps'].forEach(p=>this.files.set(p,null));
    this.files.set('/local/note.txt','Welcome to KryonOS!\n\nEdit this file with Notepad.');
    this._seedApp('com.demo.hello','Hello Kryon',
`System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("Hello KryonOS!", 15, 40, 4);
System.setTextColor(WHITE);
System.drawString("OS: " + System.getOSVersion(), 15, 110, 2);
System.drawString("API: " + System.getAPILevel(), 15, 130, 2);
System.drawString("Free RAM: " + Math.floor(System.getInfo().freeRAM/1024) + " KB", 15, 150, 2);
System.drawString("Tap to exit", 15, 220, 2);
while (true) {
  var t = System.getTouch();
  if (t.touched) break;
  await System.delay(50);
}`);
    this._seedApp('com.demo.led','LED Blink',
`var PIN=2;
System.gpio.pinMode(PIN,System.gpio.OUTPUT);
var on=false;
function draw(){
  System.fillScreen(BLACK);
  System.setTextColor(YELLOW);
  System.drawString("LED Blink",15,20,2);
  System.setTextColor(WHITE);
  System.drawString("Pin: "+PIN,15,70,2);
  System.drawString("State: "+(on?"ON":"OFF"),15,95,2);
  System.fillCircle(120,180,30,on?GREEN:DARKGREY);
  System.setTextColor(WHITE);
  System.drawString("Tap to toggle",15,250,2);
}
draw();
while(true){
  var t=System.getTouch();
  if(t.touched){on=!on;System.gpio.digitalWrite(PIN,on?System.gpio.HIGH:System.gpio.LOW);draw();await System.delay(300);}
  await System.delay(20);
}`);
    this._seedApp('com.demo.clock','Digital Clock',
`while(true){
  System.fillScreen(BLACK);
  System.setTextColor(CYAN);
  System.drawString("Digital Clock",15,20,2);
  System.setTextColor(WHITE);
  System.drawString(System.getTime(),15,90,6);
  System.setTextColor(DARKGREY);
  System.drawString(System.getDate(),15,180,2);
  System.drawString("TZ: "+System.getTimezone(),15,205,2);
  System.drawString("Tap to exit",15,270,2);
  await System.delay(500);
  var t=System.getTouch();
  if(t.touched)break;
}`);
    this._seedApp('com.demo.sysinfo','System Info',
`var info=System.getInfo();
System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("System Info",15,10,2);
System.setTextColor(WHITE);
var y=40;
function line(l,r){
  System.setTextColor(DARKGREY);System.drawString(l,10,y,2);
  System.setTextColor(WHITE);System.drawString(String(r),130,y,2);
  y+=18;
}
line("Chip:",info.chipModel);
line("Cores:",info.chipCores);
line("CPU MHz:",info.cpuFreqMHz);
line("Flash MB:",Math.floor(info.flashSize/1024/1024));
line("Heap KB:",Math.floor(info.freeRAM/1024));
line("Uptime s:",Math.floor(info.uptimeMs/1000));
line("WiFi:",System.isWiFiActive()?"ON":"OFF");
line("SD Free:",Math.floor(FS.getFreeSpace("/sd")/1024)+" KB");
System.setTextColor(YELLOW);
System.drawString("Tap to exit",10,280,2);
while(true){
  var t=System.getTouch();
  if(t.touched)break;
  await System.delay(100);
}`);
    this._seedApp('com.demo.draw','Drawing Pad',
`System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("Draw with finger",5,5,2);
System.setTextColor(YELLOW);
System.drawString("Top=toggle color",5,305,1);
var lastX=-1,lastY=-1,color=WHITE;
while(true){
  var t=System.getTouch();
  if(t.touched){
    if(t.y<30){color=(color===WHITE)?RED:WHITE;await System.delay(200);}
    else{if(lastX>=0)System.drawLine(lastX,lastY,t.x,t.y,color);lastX=t.x;lastY=t.y;}
  }else{lastX=-1;lastY=-1;}
  await System.delay(10);
}`);
    this._seedApp('com.demo.notepad','Notepad',
`var path="/local/note.txt";
async function draw(){
  System.fillScreen(BLACK);
  System.setTextColor(YELLOW);
  System.drawString("Notepad",15,15,2);
  System.setTextColor(DARKGREY);
  System.drawString(path,15,40,1);
  System.setTextColor(WHITE);
  var c=FS.readTextFile(path);if(!c)c="(empty)";
  var lines=c.split("\\n");
  var y=70;
  for(var i=0;i<lines.length&&i<10;i++){System.drawString(lines[i].substring(0,30),10,y,2);y+=18;}
  System.setTextColor(GREEN);
  System.drawString("Tap to edit",15,280,2);
}
await draw();
while(true){
  var t=System.getTouch();
  if(t.touched){
    var txt=await System.prompt("Edit note:",FS.readTextFile(path)||"");
    FS.writeTextFile(path,txt);
    await draw();
    await System.delay(300);
  }
  await System.delay(50);
}`);
  }
  _seedApp(pkg,name,code){
    const dir='/local/apps/'+pkg;
    this.files.set(dir,null);
    this.files.set(dir+'/app.json',JSON.stringify({name,packageName:pkg,version:'1.0.0',api:1,author:'KryonOS',type:'App',category:'Demo',description:'Bundled demo'},null,2));
    this.files.set(dir+'/main.js',code);
  }
  exists(p){return this.files.has(p);}
  isDirectory(p){return this.files.get(p)===null;}
  isFile(p){return this.files.has(p)&&this.files.get(p)!==null;}
  readTextFile(p){return this.isFile(p)?this.files.get(p):'';}
  writeTextFile(p,c){if(!p)return false;this._mkpar(p);this.files.set(p,String(c));return true;}
  appendTextFile(p,c){const o=this.isFile(p)?this.files.get(p):'';return this.writeTextFile(p,o+c);}
  deleteFile(p){return this.files.delete(p);}
  renameFile(a,b){if(!this.files.has(a))return false;this._mkpar(b);const v=this.files.get(a);this.files.set(b,v);this.files.delete(a);return true;}
  mkdir(p){if(this.files.has(p))return false;this._mkpar(p);this.files.set(p,null);return true;}
  rmdir(p){return this.files.delete(p);}
  listDir(p){
    if(!this.isDirectory(p))return [];
    const pre=p.endsWith('/')?p:p+'/';const out=[];
    for(const k of this.files.keys()){if(k.startsWith(pre)&&k!==p){const rest=k.substring(pre.length);if(!rest.includes('/'))out.push(rest);}}
    return out;
  }
  listDirFull(p){
    if(!this.isDirectory(p))return [];
    const pre=p.endsWith('/')?p:p+'/';const out=[];
    for(const k of this.files.keys()){if(k.startsWith(pre)&&k!==p){const rest=k.substring(pre.length);if(!rest.includes('/'))out.push({name:rest,path:k,isDir:this.isDirectory(k)});}}
    return out;
  }
  getFileSize(p){return this.isFile(p)?this.files.get(p).length:0;}
  deleteRecursive(p){const pre=p.endsWith('/')?p:p+'/';for(const k of [...this.files.keys()]){if(k===p||k.startsWith(pre))this.files.delete(k);}}
  _mkpar(p){const parts=p.split('/').filter(Boolean);let cur='';for(let i=0;i<parts.length-1;i++){cur+='/'+parts[i];if(!this.files.has(cur))this.files.set(cur,null);}}
}

/* ---------- fake MD5 ---------- */
function fakeMD5(data){
  if(!data)return '';
  let h1=0x12345678,h2=0x9abcdef0,h3=0xdeadbeef,h4=0xcafebabe;
  for(let i=0;i<data.length;i++){
    const c=data.charCodeAt(i);
    h1=((h1+c)^(h2<<3))>>>0;h2=((h2+c*3)^(h3<<5))>>>0;
    h3=((h3+c*5)^(h4<<7))>>>0;h4=((h4+c*7)^(h1<<11))>>>0;
  }
  return [h1,h2,h3,h4].map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

/* =========================================================
   On-screen Keyboard (FIX: reject reference kept)
   ========================================================= */
class OnScreenKeyboard{
  constructor(sim){
    this.sim=sim;this.text='';this.caps=false;this.active=false;
    this.resolve=null;this.reject=null;this.promptMsg='';
    this.KW=12;this.KH=4;
    this.keyset=[
      ['1','2','3','4','5','6','7','8','9','0','-','='],
      ['q','w','e','r','t','y','u','i','o','p','[',']'],
      ['a','s','d','f','g','h','j','k','l',';','\'','\\'],
      ['\\','z','x','c','v','b','n','m',',','.','/',' ']
    ];
  }
  show(promptMsg,initial){
    // FIX #1: clear pending touch state when keyboard opens
    this.sim.touch.touched=false;
    this.text=initial||'';this.caps=false;this.active=true;
    this.promptMsg=promptMsg||'Input';
    this.draw();
    return new Promise((res,rej)=>{
      this.resolve=res;this.reject=rej;
    });
  }
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.setTextColor(TFT_GREEN,TFT_BLACK);
    d.drawString(String(this.promptMsg).substring(0,26),5,5,2);
    d.drawRect(5,25,230,30,TFT_GREEN);
    d.setTextColor(TFT_WHITE,TFT_BLACK);
    const disp=this.text.length>18?this.text.substring(this.text.length-18):this.text;
    d.drawString(disp+'_',10,33,2);
    const btns=['OK',this.caps?'abc':'ABC','DEL','SPACE','ESC'];
    const bw=240/5;
    for(let i=0;i<5;i++){
      d.drawRect(i*bw,65,bw,28,TFT_GREEN);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      d.drawString(btns[i],i*bw+8,72,2);
    }
    const kw=240/this.KW,kh=(320-100)/this.KH;
    for(let y=0;y<this.KH;y++){
      for(let x=0;x<this.KW;x++){
        const px=x*kw,py=100+y*kh;
        d.drawRect(px,py,kw,kh,TFT_DARKGREY);
        let c=this.keyset[y][x];
        if(this.caps&&/[a-z]/.test(c))c=c.toUpperCase();
        d.setTextColor(TFT_WHITE,TFT_BLACK);
        d.drawString(c,px+kw/2-4,py+kh/2-6,1);
      }
    }
  }
  handleTouch(x,y){
    if(y>=65&&y<=93){
      const bw=240/5;const idx=Math.floor(x/bw);
      if(idx===0)this.finish(this.text);
      else if(idx===1){this.caps=!this.caps;this.draw();}
      else if(idx===2){if(this.text.length>0)this.text=this.text.slice(0,-1);this.draw();}
      else if(idx===3){this.text+=' ';this.draw();}
      else this.finish('');
      return;
    }
    if(y>=100&&y<=320){
      const kw=240/this.KW,kh=(320-100)/this.KH;
      const kx=Math.floor(x/kw),ky=Math.floor((y-100)/kh);
      if(kx>=0&&kx<this.KW&&ky>=0&&ky<this.KH){
        let c=this.keyset[ky][kx];
        if(this.caps&&/[a-z]/.test(c))c=c.toUpperCase();
        this.text+=c;this.draw();
      }
    }
  }
  finish(val){
    if(!this.active)return;
    this.active=false;
    const r=this.resolve;
    this.resolve=null;this.reject=null;
    if(r)r(val);
  }
  cancel(){
    if(!this.active)return;
    this.active=false;
    const r=this.reject;
    this.resolve=null;this.reject=null;
    if(r)r(Object.assign(new Error('OS_EXIT'),{code:'OS_EXIT'}));
  }
}

/* =========================================================
   System API  (FIX #2: delay/prompt respect exitRequested)
   ========================================================= */
function buildSystemAPI(sim){
  const disp=sim.disp,vfs=sim.vfs;
  const startTime=Date.now();
  const vpins={};
  return {
    gpio:{
      OUTPUT:1,INPUT:0,INPUT_PULLUP:2,HIGH:1,LOW:0,
      pinMode:(p)=>{vpins[p]=vpins[p]||{on:false};},
      digitalWrite:(p,v)=>{vpins[p]=vpins[p]||{on:false};vpins[p].on=!!v;},
      digitalRead:(p)=>vpins[p]&&vpins[p].on?1:0,
      analogRead:()=>Math.floor(Math.random()*4096),
      analogWrite:(p,v)=>{vpins[p]=vpins[p]||{on:false};vpins[p].on=v>127;},
      pulseIn:()=>Math.floor(Math.random()*1000)
    },
    fillScreen:c=>disp.fillScreen(c),
    fillRect:(x,y,w,h,c)=>disp.fillRect(x,y,w,h,c),
    drawRect:(x,y,w,h,c)=>disp.drawRect(x,y,w,h,c),
    drawLine:(a,b,c,d,e)=>disp.drawLine(a,b,c,d,e),
    drawPixel:(x,y,c)=>disp.drawPixel(x,y,c),
    drawCircle:(x,y,r,c)=>disp.drawCircle(x,y,r,c),
    fillCircle:(x,y,r,c)=>disp.fillCircle(x,y,r,c),
    drawTriangle:(...a)=>disp.drawTriangle(...a),
    fillTriangle:(...a)=>disp.fillTriangle(...a),
    drawRoundRect:(...a)=>disp.drawRoundRect(...a),
    fillRoundRect:(...a)=>disp.fillRoundRect(...a),
    drawFastVLine:(...a)=>disp.drawFastVLine(...a),
    drawFastHLine:(...a)=>disp.drawFastHLine(...a),
    drawBMP:(path,x,y)=>{
      const raw=vfs.readTextFile(path);if(!raw)return false;
      if(raw.startsWith('data:image')){
        const img=new Image();img.onload=()=>{const t=disp.target;t.ctx.drawImage(img,x,y);};img.src=raw;return true;
      }
      disp.fillRect(x,y,32,32,TFT_DARKGREY);disp.drawRect(x,y,32,32,TFT_WHITE);return false;
    },
    drawString:(s,x,y,f)=>disp.drawString(s,x,y,f||2),
    setTextColor:(f,b)=>disp.setTextColor(f,b),
    setTextSize:s=>disp.setTextSize(s),
    createSprite:(w,h)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const spr=new TFTDisplay(cv);spr.W=w;spr.H=h;disp.sprite=spr;disp.spriteBound=false;return true;},
    deleteSprite:()=>{disp.sprite=null;disp.spriteBound=false;},
    pushSprite:(x,y)=>{if(disp.sprite)disp.ctx.drawImage(disp.sprite.canvas,x,y);},
    bindSprite:e=>{disp.spriteBound=!!e&&!!disp.sprite;},
    color:(r,g,b)=>disp.color(r,g,b),
    screenWidth:()=>disp.W,
    screenHeight:()=>disp.H,

    /* FIX #3: getTouch returns false while keyboard active; throws when X tapped */
    getTouch:()=>{
      if(sim.exitRequested)throw Object.assign(new Error('OS_EXIT'),{code:'OS_EXIT'});
      if(sim.keyboard.active)return{x:0,y:0,touched:false};
      const t=sim.touch;
      if(t.touched&&t.x>=200&&t.y<=40)throw Object.assign(new Error('OS_EXIT'),{code:'OS_EXIT'});
      return{x:t.x,y:t.y,touched:!!t.touched};
    },

    millis:()=>Date.now()-startTime,
    micros:()=>(Date.now()-startTime)*1000,

    /* FIX #4: delay ticks and rejects on exitRequested */
    delay:(ms)=>new Promise((res,rej)=>{
      const cap=Math.min(Math.max(0,ms|0),30000);
      const start=Date.now();
      const tick=()=>{
        if(sim.exitRequested){rej(Object.assign(new Error('OS_EXIT'),{code:'OS_EXIT'}));return;}
        if(Date.now()-start>=cap){res();return;}
        setTimeout(tick,8);
      };
      tick();
    }),
    delayMicroseconds:(us)=>new Promise((res,rej)=>{
      const ms=Math.max(0,us/1000);
      const cap=Math.min(ms,30000);
      const start=Date.now();
      const tick=()=>{
        if(sim.exitRequested){rej(Object.assign(new Error('OS_EXIT'),{code:'OS_EXIT'}));return;}
        if(Date.now()-start>=cap){res();return;}
        setTimeout(tick,4);
      };
      tick();
    }),
    print:m=>log(String(m)),
    getTemperature:()=>42+Math.random()*8,
    hasTemperatureSensor:()=>true,
    getInfo:()=>({
      totalRAM:327680,freeRAM:180000+Math.floor(Math.random()*15000),
      minFreeRAM:130000,maxAllocRAM:110000,cpuFreqMHz:240,
      chipModel:'ESP32-Sim',chipCores:2,chipRevision:1,
      flashSize:4*1024*1024,uptimeMs:Date.now()-startTime
    }),
    restart:()=>{log('Restart requested','warn');setTimeout(()=>location.reload(),400);},
    getTime:()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},
    getSeconds:()=>new Date().getSeconds(),
    getDate:()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();},
    getYear:()=>new Date().getFullYear(),
    getMonth:()=>new Date().getMonth()+1,
    getDay:()=>new Date().getDate(),
    getTimezone:()=>sim.timezone,
    getOSVersion:()=>'1.0.0',
    getAPILevel:()=>1,
    getIPAddress:()=>sim.wifiEnabled?'192.168.4.1':'0.0.0.0',
    isWiFiActive:()=>sim.wifiEnabled,
    prompt:(msg,init)=>{
      sim.touch.touched=false;  // FIX #5: clear touch when prompt opens
      return sim.keyboard.show(msg,init);
    }
  };
}
function buildFSAPI(vfs){
  return {
    readTextFile:p=>{const r=vfs.readTextFile(p);return r.length?r:null;},
    writeTextFile:(p,c)=>vfs.writeTextFile(p,c),

    deleteFile:p=>vfs.deleteFile(p),

    mkdir:p=>vfs.mkdir(p),
    rmdir:p=>vfs.rmdir(p),
    isDirectory:p=>vfs.isDirectory(p),
    isFile:p=>vfs.isFile(p),

}

/* =========================================================
   Launcher
   ========================================================= */
class Launcher{
  constructor(sim){this.sim=sim;this.selectedIndex=1;this.scrollOffset=0;this.apps=[];this.scanApps();}
  scanApps(){
    this.apps=[];
    for(const d of ['/local/apps','/sd/apps']){
      if(!this.sim.vfs.isDirectory(d))continue;
      for(const e of this.sim.vfs.listDirFull(d)){
        if(e.isDir){
          const jp=e.path+'/app.json';
          if(this.sim.vfs.exists(jp)){
            try{const o=JSON.parse(this.sim.vfs.readTextFile(jp));const n=o.name||e.name;
              if(!this.apps.find(a=>a.name===n))this.apps.push({name:n,path:e.path,isFolder:true});
            }catch(err){}
          }
        }else if(e.name.endsWith('.js')){
          if(!this.apps.find(a=>a.name===e.name))this.apps.push({name:e.name,path:e.path,isFolder:false});
        }
      }
    }
    if(this.selectedIndex>=this.total())this.selectedIndex=1;
  }
  total(){return this.apps.length+6;}
  draw(){
    const d=this.sim.disp;
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.drawString('KryonOS Home',72,14,2);
    d.fillRect(10,45,220,230,TFT_BLACK);
    const total=this.total(),pp=7;
    for(let i=0;i<pp;i++){
      const idx=this.scrollOffset+i;if(idx>=total)break;
      const y=45+i*30;
      let name='',hdr=false;
      if(idx===0){name='[ SYSTEM ]';hdr=true;}
      else if(idx===1)name='App Store';
      else if(idx===2)name='App Installer';
      else if(idx===3)name='Settings';
      else if(idx===4)name='Help Center';
      else if(idx===5){name='[ APPS ]';hdr=true;}
      else name=this.apps[idx-6].name;
      if(hdr){d.setTextColor(TFT_DARKGREY,TFT_BLACK);d.drawString(name,15,y+5,2);}
      else if(idx===this.selectedIndex){d.fillRect(10,y,220,25,TFT_WHITE);d.setTextColor(TFT_BLACK,TFT_WHITE);d.drawString('> '+name,15,y+5,2);}
      else{d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('  '+name,15,y+5,2);}
    }
    if(total>pp){const sbH=230,th=Math.max(20,(sbH*pp)/total),maxY=sbH-th;
      const ty=45+(this.scrollOffset*maxY)/Math.max(1,total-pp);
      d.fillRect(232,45,3,sbH,TFT_DARKGREY);d.fillRect(232,ty,3,th,TFT_WHITE);}
    d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);
    d.drawString('UP',18,293,2);d.drawString('|',52,293,2);
    d.drawString('SEL',95,293,2);d.drawString('|',155,293,2);d.drawString('DN',195,293,2);
  }
  handleTouch(x,y){
    const total=this.total();
    if(y>=45&&y<=270){
      const idx=this.scrollOffset+Math.floor((y-45)/30);
      if(idx<total&&idx!==0&&idx!==5){this.selectedIndex=idx;this.draw();this.execute();}
      return;
    }
    if(y>=285&&y<=315){
      if(x<60){if(this.selectedIndex>1){this.selectedIndex--;if(this.selectedIndex===5)this.selectedIndex--;if(this.selectedIndex<this.scrollOffset)this.scrollOffset=this.selectedIndex;if(this.selectedIndex===1)this.scrollOffset=0;this.draw();}}
      else if(x<180)this.execute();
      else{if(this.selectedIndex<total-1){this.selectedIndex++;if(this.selectedIndex===5)this.selectedIndex++;if(this.selectedIndex>=this.scrollOffset+7)this.scrollOffset=this.selectedIndex-6;this.draw();}}
    }
  }
  execute(){
    const s=this.selectedIndex;
    if(s===1)this.sim.setState('APP_STORE');
    else if(s===2)this.sim.setState('INSTALLER');
    else if(s===3)this.sim.setState('SETTINGS');
    else if(s===4)this.sim.setState('HELP_CENTER');
    else if(s>5)this.sim.launchApp(this.apps[s-6]);
  }
  physical(n){if(n==='UP')this.handleTouch(30,300);else if(n==='SEL')this.handleTouch(120,300);else if(n==='DN')this.handleTouch(210,300);}
}

/* =========================================================
   Installer (with validation)
   ========================================================= */
class Installer{
  constructor(sim){this.sim=sim;this.path='/';this.entries=[];this.selected=0;this.scroll=0;this.dialog=null;this.refresh();}
  refresh(){
    if(this.path==='/'){this.entries=[{name:'SD Card',path:'/sd',isDir:true},{name:'Internal Storage',path:'/local',isDir:true}];}
    else{this.entries=this.sim.vfs.listDirFull(this.path);this.entries.sort((a,b)=>{const sa=a.isDir?0:1,sb=b.isDir?0:1;if(sa!==sb)return sa-sb;return a.name.localeCompare(b.name);});}
    const tot=this.entries.length+(this.path!=='/'?1:0);
    if(this.selected>=tot)this.selected=0;
  }
  draw(){
    const d=this.sim.disp;
    if(this.dialog){this._drawDialog();return;}
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);
    let h='App Installer';
    if(this.path.startsWith('/sd'))h='Installer  /sdcard';
    else if(this.path.startsWith('/local'))h='Installer  /internal';
    d.drawString(h,60,14,2);
    d.fillRect(10,45,220,230,TFT_BLACK);
    const hasUp=this.path!=='/',total=this.entries.length+(hasUp?1:0);
    for(let i=0;i<7;i++){
      const idx=this.scroll+i;if(idx>=total)break;
      const y=45+i*30;
      let label='',isApp=false;
      if(hasUp&&idx===0){label='[..] UP';}
      else{
        const e=this.entries[idx-(hasUp?1:0)];
        label=e.name;
        if(e.isDir){
          const jp=e.path+'/app.json';
          if(this.sim.vfs.exists(jp)){
            try{const o=JSON.parse(this.sim.vfs.readTextFile(jp));label='['+(o.type||'App')+'] '+(o.name||e.name);isApp=true;}catch(err){}
          }else label='[D] '+e.name;
        }
      }
      if(idx===this.selected){d.fillRect(10,y,220,25,TFT_WHITE);d.setTextColor(TFT_BLACK,TFT_WHITE);d.drawString('> '+label,15,y+5,2);}
      else{d.setTextColor(isApp?TFT_GREEN:TFT_WHITE,TFT_BLACK);d.drawString('  '+label,15,y+5,2);}
    }
    d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);
    d.drawString('ESC',18,293,2);d.drawString('|',52,293,2);
    d.drawString('UP',88,293,2);d.drawString('|',122,293,2);
    d.drawString('SEL',158,293,2);d.drawString('|',192,293,2);d.drawString('DN',218,293,2);
  }
  _drawDialog(){
    const d=this.sim.disp;d.fillScreen(TFT_BLACK);
    const dlg=this.dialog;
    d.fillRoundRect(10,60,220,200,8,TFT_DARKGREY);
    d.setTextColor(dlg.ok?TFT_GREEN:TFT_RED,TFT_DARKGREY);
    d.drawString(dlg.title,40,90,4);
    d.setTextColor(TFT_WHITE,TFT_DARKGREY);
    let y=130;
    if(dlg.lines)for(const l of dlg.lines){d.drawString(String(l).substring(0,32),20,y,2);y+=16;}
    d.fillRoundRect(85,220,70,30,4,TFT_BLUE);
    d.setTextColor(TFT_WHITE,TFT_BLUE);d.drawString('OK',112,228,2);
  }
  handleTouch(x,y){
    if(this.dialog){if(x>=85&&x<=155&&y>=220&&y<=250){this.dialog=null;this.draw();}return;}
    const hasUp=this.path!=='/',total=this.entries.length+(hasUp?1:0);
    if(y>=45&&y<=270){const idx=this.scroll+Math.floor((y-45)/30);if(idx<total){this.selected=idx;this.activate();}return;}
    if(y>=285){
      if(x<60){this.sim.setState('LAUNCHER');return;}
      if(x<122){if(this.selected>0){this.selected--;if(this.selected<this.scroll)this.scroll=this.selected;this.draw();}}
      else if(x<192)this.activate();
      else{if(this.selected<total-1){this.selected++;if(this.selected>=this.scroll+7)this.scroll=this.selected-6;this.draw();}}
    }
  }
  activate(){
    const hasUp=this.path!=='/';
    if(hasUp&&this.selected===0){
      const parts=this.path.split('/').filter(Boolean);parts.pop();
      this.path='/'+parts.join('/');if(this.path==='')this.path='/';
      this.selected=0;this.scroll=0;this.refresh();this.draw();return;
    }
    const e=this.entries[this.selected-(hasUp?1:0)];
    if(!e)return;
    if(e.isDir){
      const jp=e.path+'/app.json';
      if(this.sim.vfs.exists(jp))this._installApp(e.path);
      else{this.path=e.path;this.selected=0;this.scroll=0;this.refresh();this.draw();}
    }else if(e.name.endsWith('.js')){
      this.sim.launchApp({name:e.name,path:e.path,isFolder:false});
    }
  }
  _installApp(srcPath){
    let meta;try{meta=JSON.parse(this.sim.vfs.readTextFile(srcPath+'/app.json'));}
    catch(err){this.dialog={ok:false,title:'Bad JSON!',lines:['app.json is invalid']};this.draw();return;}
    const pkg=meta.packageName||'';
    if(!(pkg.length>0&&!pkg.includes(' ')&&pkg.includes('.')&&!/[A-Z]/.test(pkg))){
      this.dialog={ok:false,title:'Invalid Pkg!',lines:['packageName must be','lowercase, dot-separated,','no spaces.']};this.draw();return;
    }
    const api=meta.api||1;
    if(api>1){this.dialog={ok:false,title:'API Error!',lines:['Requires API: '+api,'OS has API: 1','Update OS.']};this.draw();return;}
    const mainJs=this.sim.vfs.readTextFile(srcPath+'/main.js');
    if(mainJs){
      try{new Function('System','FS',mainJs);}
      catch(err){this.dialog={ok:false,title:'Syntax Error!',lines:[err.message.substring(0,30)]};this.draw();return;}
    }
    const dest='/local/apps/'+pkg;
    if(this.sim.vfs.exists(dest+'/app.json')){
      try{const old=JSON.parse(this.sim.vfs.readTextFile(dest+'/app.json'));
        if(old.author&&meta.author&&old.author!==meta.author){
          this.dialog={ok:false,title:'Author Mismatch!',lines:['Installed: '+old.author,'New: '+meta.author]};
          this.draw();return;
        }}catch(err){}
    }
    this.sim.vfs.deleteRecursive(dest);
    this.sim.vfs.mkdir(dest);
    this.sim.vfs.writeTextFile(dest+'/app.json',this.sim.vfs.readTextFile(srcPath+'/app.json'));
    this.sim.vfs.writeTextFile(dest+'/main.js',mainJs);
    this.sim.launcher.scanApps();
    log('Installed: '+(meta.name||pkg),'ok');
    this.dialog={ok:true,title:'Installed!',lines:[meta.name||pkg,'v'+(meta.version||'1.0.0')]};
    this.draw();
  }
  physical(n){if(n==='UP')this.handleTouch(88,300);else if(n==='SEL')this.handleTouch(150,300);else if(n==='DN')this.handleTouch(218,300);}
}

class ManageApps{
  constructor(sim){this.sim=sim;this.apps=[];this.scroll=0;this.selected=-1;this.menuOpen=false;
    this.defaultSD=this.sim.vfs.exists('/local/config_install_sd.txt');this._loadApps();}
  _loadApps(){
    this.apps=[];
    for(const dir of ['/local/apps','/sd/apps']){
      if(!this.sim.vfs.isDirectory(dir))continue;
      for(const e of this.sim.vfs.listDirFull(dir)){
        let name=e.name;
        if(e.isDir){
          const jp=e.path+'/app.json';
          if(this.sim.vfs.exists(jp)){try{const o=JSON.parse(this.sim.vfs.readTextFile(jp));if(o.name)name=o.name;}catch(err){}}
        }
        this.apps.push({name,path:e.path,isDir:e.isDir,drive:dir.startsWith('/sd')?'[SD]':'[LFS]'});
      }
    }
  }
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.drawString('Manage Apps',75,14,2);
    d.fillRoundRect(10,40,220,30,4,TFT_DARKGREY);
    d.setTextColor(TFT_WHITE,TFT_DARKGREY);
    d.drawString(this.defaultSD?'Default Install: SD':'Default Install: LFS',30,48,2);
    const pp=6;let y=80;
    for(let i=0;i<pp;i++){
      const idx=this.scroll+i;if(idx>=this.apps.length)break;
      const a=this.apps[idx];
      if(idx===this.selected)d.fillRect(10,y,220,28,TFT_BLUE);else d.fillRect(10,y,220,28,TFT_BLACK);
      d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString(a.name.substring(0,22),15,y+6,2);
      d.setTextColor(TFT_YELLOW,TFT_BLACK);d.drawString(a.drive,190,y+6,2);
      y+=32;
    }
    if(this.apps.length===0){d.setTextColor(TFT_DARKGREY,TFT_BLACK);d.drawString('No apps installed',65,160,2);}
    if(this.scroll>0)d.fillTriangle(220,85,230,100,210,100,TFT_WHITE);
    if(this.scroll+pp<this.apps.length)d.fillTriangle(220,275,210,260,230,260,TFT_WHITE);
    d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('BACK',100,293,2);
    if(this.menuOpen&&this.selected>=0){
      const sel=this.apps[this.selected],isSD=sel.drive==='[SD]';
      d.fillRoundRect(20,80,200,150,5,TFT_DARKGREY);d.drawRoundRect(20,80,200,150,5,TFT_WHITE);
      d.setTextColor(TFT_YELLOW,TFT_DARKGREY);d.drawString('App Actions',75,95,2);
      d.fillRoundRect(30,110,180,30,4,TFT_RED);d.setTextColor(TFT_WHITE,TFT_RED);d.drawString('Uninstall',95,118,2);
      d.fillRoundRect(30,150,180,30,4,TFT_ORANGE);d.setTextColor(TFT_BLACK,TFT_ORANGE);
      d.drawString(isSD?'Move to LFS':'Move to SD',80,158,2);
      d.fillRoundRect(30,190,180,30,4,TFT_BLACK);d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('Cancel',95,198,2);
    }
  }
  handleTouch(x,y){
    if(this.menuOpen){
      const sel=this.apps[this.selected],isSD=sel.drive==='[SD]';
      if(y>=110&&y<=140){
        this.sim.vfs.deleteRecursive(sel.path);
        log('Uninstalled: '+sel.name,'warn');
        this._loadApps();this.sim.launcher.scanApps();this.menuOpen=false;this.selected=-1;this.draw();
      }else if(y>=150&&y<=180){
        const dstDir=isSD?'/local/apps/':'/sd/apps/';
        this.sim.vfs.mkdir(dstDir);
        const newPath=dstDir+sel.path.split('/').pop();
        this.sim.vfs.deleteRecursive(newPath);
        for(const k of [...this.sim.vfs.files.keys()]){
          if(k===sel.path||k.startsWith(sel.path+'/')){
            const rel=k.substring(sel.path.length);
            this.sim.vfs.files.set(newPath+rel,this.sim.vfs.files.get(k));
          }
        }
        this.sim.vfs.deleteRecursive(sel.path);
        log('Moved '+sel.name,'ok');
        this._loadApps();this.sim.launcher.scanApps();this.menuOpen=false;this.selected=-1;this.draw();
      }else if(y>=190&&y<=220){this.menuOpen=false;this.draw();}
      return;
    }
    if(y>=285){this.sim.setState('SETTINGS');return;}
    if(y>=40&&y<=70){this.defaultSD=!this.defaultSD;this.draw();return;}
    if(x>=200&&y>=80&&y<=110){if(this.scroll>0){this.scroll--;this.draw();}return;}
    if(x>=200&&y>=250&&y<=280){if(this.scroll+6<this.apps.length){this.scroll++;this.draw();}return;}
    if(y>=80&&y<=280){
      const idx=this.scroll+Math.floor((y-80)/32);
      if(idx<this.apps.length){this.selected=idx;this.menuOpen=true;this.draw();}
    }
  }
  physical(n){if(n==='SEL')this.handleTouch(120,300);}
}

        if(y>=by+50&&y<=by+75){set(Math.max(min,get()-1));this.draw();}
      }
    };
    chk(10,60,50,()=>this.day,v=>this.day=v,1,31);
    chk(80,60,50,()=>this.month,v=>this.month=v,1,12);
    chk(150,60,70,()=>this.year,v=>this.year=v,2000,2100);

    chk(140,160,60,()=>this.minute,v=>this.minute=v,0,59);

      this.sim.useManualTime=true;
      log('Manual time set','ok');
      this.sim.setState('SETTINGS_TIME');
    }
  }

}

class Updater{
  constructor(sim,isBoot){this.sim=sim;this.isBoot=isBoot;this.state='checking';this.lines=[];}
  async check(){
    this.state='checking';this.draw();
    try{
      const r=await fetch('https://raw.githubusercontent.com/Haris16-code/KryonOS/refs/heads/main/updates/esp32/update.json',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const obj=await r.json();
      const ver=obj.version||'0.0.0';
      if(this._cmp(ver,'1.0.0')>0){this.state='update';this.lines=[`1.0.0 -> ${ver}`,obj.changelog||'(no changelog)'];}
      else this.state='uptodate';
    }catch(e){this.state='uptodate';this.lines=['(offline mode)'];}
    this.draw();
  }
  _cmp(a,b){const pa=a.split('.').map(Number),pb=b.split('.').map(Number);for(let i=0;i<3;i++){if((pa[i]||0)>(pb[i]||0))return 1;if((pa[i]||0)<(pb[i]||0))return -1;}return 0;}
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.drawString('System Updates',65,14,2);
    if(this.state==='checking'){d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('Checking for updates...',20,150,2);}
    else if(this.state==='uptodate'){
      d.setTextColor(TFT_GREEN,TFT_BLACK);d.drawString('System is up to date!',40,150,2);
      this.lines.forEach((l,i)=>d.drawString(l,40,180+i*16,2));
    }else{
      d.setTextColor(TFT_YELLOW,TFT_BLACK);d.drawString('Update Available!',40,45,2);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      let y=80;
      for(const l of this.lines){const ss=String(l).split('\n');for(const line of ss){if(y>250)break;d.drawString(line.substring(0,32),15,y,2);y+=16;}}
    }
    d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString(this.isBoot?'CLOSE':'BACK',100,293,2);
  }
  handleTouch(x,y){if(y>=285)this.sim.setState(this.isBoot?'LAUNCHER':'SETTINGS');}
  physical(n){if(n==='SEL')this.handleTouch(120,300);}
}

class AppStore{
  constructor(sim){this.sim=sim;this.state='categories';this.categories=[];this.apps=[];
    this.selected=0;this.scroll=0;this.currentCat='';this.currentApp=null;this.loadCategories();}
  async loadCategories(){
    try{
      const r=await fetch('https://raw.githubusercontent.com/Haris16-code/KryonOS-AppStore/main/index.json',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const obj=await r.json();
      const cats=[['[ Check For Apps Update ]','UPDATE_ACTION']];
      for(const k in(obj.categories||{}))cats.push([k,obj.categories[k]]);
      this.categories=cats;
    }catch(e){
      this.categories=[['[ Check For Apps Update ]','UPDATE_ACTION'],['Demos','mock://demos'],['Utilities','mock://utils']];
    }
    if(this.state==='categories')this.draw();
  }
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);
    let h='App Store';
    if(this.state==='apps')h=this.currentCat;
    else if(this.state==='info')h='App Details';
    d.drawString(h.substring(0,20),50,14,2);
    const list=(this.state==='apps'?this.apps:this.categories);
    for(let i=0;i<7;i++){
      const idx=this.scroll+i;if(idx>=list.length)break;
      const y=45+i*30;
      const label=Array.isArray(list[idx])?list[idx][0]:(list[idx].name||list[idx]);
      if(idx===this.selected){d.fillRect(10,y,220,25,TFT_WHITE);d.setTextColor(TFT_BLACK,TFT_WHITE);d.drawString('> '+label.substring(0,24),15,y+5,2);}
      else{d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('  '+label.substring(0,24),15,y+5,2);}
    }
    if(this.state==='info'&&this.currentApp){
      const a=this.currentApp;
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      d.drawString('Name: '+a.name,10,50,2);
      d.drawString('Author: '+a.author,10,75,2);
      d.drawString('Version: '+a.version,10,100,2);
      d.setTextColor(TFT_DARKGREY,TFT_BLACK);
      d.drawString((a.description||'').substring(0,60),10,130,2);
      d.fillRoundRect(25,230,80,30,5,TFT_GREEN);d.setTextColor(TFT_BLACK,TFT_GREEN);d.drawString('INSTALL',45,238,2);
      d.drawRoundRect(135,230,80,30,5,TFT_WHITE);d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('CANCEL',155,238,2);
    }
    d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);
    d.drawString('BACK',35,293,2);d.drawString('|',70,293,2);
    d.drawString('UP',100,293,2);d.drawString('|',130,293,2);
    d.drawString('SEL',165,293,2);d.drawString('|',200,293,2);d.drawString('DN',218,293,2);
  }
  handleTouch(x,y){
    if(this.state==='info'){
      if(y>=230&&y<=260){
        if(x>=25&&x<=105)this._install(this.currentApp);
        else if(x>=135&&x<=215){this.state='apps';this.draw();}
      }
      return;
    }
    if(y>=45&&y<=270){
      const list=this.state==='apps'?this.apps:this.categories;
      const idx=this.scroll+Math.floor((y-45)/30);
      if(idx>=list.length)return;
      this.selected=idx;
      if(this.state==='categories')this._openCategory();else this._openApp();
      return;
    }
    if(y>=285){
      if(x<70){this.state==='apps'?this._back():this.sim.setState('LAUNCHER');}
      else if(x<130){if(this.selected>0){this.selected--;if(this.selected<this.scroll)this.scroll=this.selected;this.draw();}}
      else if(x<200){if(this.state==='categories')this._openCategory();else if(this.state==='apps')this._openApp();}
      else{if(this.selected<(this.state==='apps'?this.apps:this.categories).length-1){this.selected++;if(this.selected>=this.scroll+7)this.scroll=this.selected-6;this.draw();}}
    }
  }
  _back(){this.state='categories';this.selected=0;this.scroll=0;this.draw();}
  async _openCategory(){
    const c=this.categories[this.selected];if(!c)return;
    if(c[1]==='UPDATE_ACTION'){log('Check for updates: not yet implemented','warn');return;}
    this.currentCat=c[0];
    try{
      if(c[1].startsWith('mock://'))this.apps=this._mockApps();
      else{
        const r=await fetch(c[1],{cache:'no-store'});
        const obj=await r.json();
        this.apps=[];
        for(const id in(obj.apps||{})){
          const it=obj.apps[id];
          this.apps.push({id,name:id,meta:it.meta,app:it.app});
        }
      }
    }catch(e){this.apps=this._mockApps();}
    this.state='apps';this.selected=0;this.scroll=0;this.draw();
  }
  _mockApps(){
    return [
      {id:'com.mock.hello',name:'Hello Demo',author:'Mock',version:'1.0.0',description:'A mock demo app.'},
      {id:'com.mock.led',name:'LED Demo',author:'Mock',version:'1.0.0',description:'Toggles GPIO 2.'},
      {id:'com.mock.clock',name:'Clock Demo',author:'Mock',version:'1.0.0',description:'Shows time.'}
    ];
  }
  async _openApp(){
    const a=this.apps[this.selected];if(!a)return;
    if(a.meta&&a.meta.startsWith('http')){
      try{
        const r=await fetch(a.meta,{cache:'no-store'});
        const obj=await r.json();
        a.name=obj.name||a.name;a.author=obj.author||'Unknown';
        a.version=obj.version||'1.0.0';a.description=obj.description||'';
        a.packageName=obj.packageName||a.id;
      }catch(e){}
    } else {a.packageName=a.id;a.author=a.author||'Mock';a.version=a.version||'1.0.0';a.description=a.description||'Mock app.';}
    this.currentApp=a;this.state='info';this.draw();
  }
  _install(a){
    const dest='/local/apps/'+(a.packageName||a.id);
    this.sim.vfs.mkdir(dest);
    this.sim.vfs.writeTextFile(dest+'/app.json',JSON.stringify({
      name:a.name,packageName:a.packageName||a.id,version:a.version,
      api:1,author:a.author,type:'App',category:this.currentCat||'Mock',description:a.description
    },null,2));
    const code=`System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("${a.name}",15,40,4);
System.setTextColor(WHITE);
System.drawString("v${a.version}",15,110,2);
System.drawString("by ${a.author}",15,130,2);
System.drawString("Tap to exit",15,220,2);
while (true) {
  var t = System.getTouch();
  if (t.touched) break;
  await System.delay(50);
}`;
    this.sim.vfs.writeTextFile(dest+'/main.js',code);
    this.sim.launcher.scanApps();
    log('Installed from store: '+a.name,'ok');
    this.state='categories';this.selected=0;this.scroll=0;this.draw();
  }
  physical(n){if(n==='UP')this.handleTouch(100,300);else if(n==='SEL')this.handleTouch(165,300);else if(n==='DN')this.handleTouch(218,300);}
}

const HC_OFF_CATS=['Getting Started','Basic Navigation','Connectivity','Troubleshooting'];
const HC_OFF_DATA={
  0:{topics:['What is KryonOS','First setup guide','System vs User apps'],
     content:['KryonOS is a fast, lightweight OS for ESP32.','Go to Settings -> WiFi to connect.','System apps are in C++; user apps in JS.']},
  1:{topics:['Home screen overview','Opening & closing apps'],

  2:{topics:['How to connect WiFi'],
     content:['Settings -> WiFi -> tap a network -> enter password.']},
  3:{topics:['Black screen & Crash'],
     content:['Turn off WiFi from Settings to free RAM, then retry the app.']}
};

class HelpCenter{
  constructor(sim){this.sim=sim;this.state='main';this.sel=0;this.scroll=0;this.cat=0;this.topic=0;
    this.viewerTitle='';this.viewerContent='';this.viewerScroll=0;this.loading=false;}
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.drawString('Help Center',75,14,2);
    if(this.loading){d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('Loading...',85,150,2);return;}
    if(this.state==='main'){
      const opts=['Offline Help Center','Online Help Center'];
      opts.forEach((o,i)=>{
        if(i===this.sel){d.fillRoundRect(20,80+i*60,200,40,5,TFT_WHITE);d.setTextColor(TFT_BLACK,TFT_WHITE);}
        else{d.drawRoundRect(20,80+i*60,200,40,5,TFT_WHITE);d.setTextColor(TFT_WHITE,TFT_BLACK);}
        d.drawString(o,50,92+i*60,2);
      });
      d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
      d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('BACK',100,293,2);
    } else if(this.state==='viewer'){
      d.setTextColor(TFT_DARKGREY,TFT_BLACK);d.drawString(this.viewerTitle.substring(0,24),15,42,2);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      const lines=this._wrap(this.viewerContent,28);
      for(let i=0;i<14;i++){
        const idx=this.viewerScroll+i;if(idx>=lines.length)break;
        d.drawString(lines[idx],10,60+i*16,2);
      }
      d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      d.drawString('BACK',40,293,2);d.drawString('UP',120,293,2);d.drawString('DN',200,293,2);
    } else {
      const list=this._currentList();
      for(let i=0;i<7;i++){
        const idx=this.scroll+i;if(idx>=list.length)break;
        const y=45+i*30;
        if(idx===this.sel){d.fillRect(10,y,220,25,TFT_WHITE);d.setTextColor(TFT_BLACK,TFT_WHITE);d.drawString('> '+list[idx].substring(0,22),15,y+5,2);}
        else{d.setTextColor(TFT_WHITE,TFT_BLACK);d.drawString('  '+list[idx].substring(0,22),15,y+5,2);}
      }
      d.fillRoundRect(5,285,230,30,5,TFT_BLACK);d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      d.drawString('BACK',35,293,2);d.drawString('|',70,293,2);
      d.drawString('UP',100,293,2);d.drawString('|',130,293,2);
      d.drawString('SEL',165,293,2);d.drawString('|',200,293,2);d.drawString('DN',218,293,2);
    }
  }
  _wrap(text,cols){const words=text.split(/\s+/);const out=[];let cur='';for(const w of words){if((cur+' '+w).trim().length>cols){out.push(cur);cur=w;}else cur=(cur?cur+' ':'')+w;}if(cur)out.push(cur);return out;}
  _currentList(){
    if(this.state==='offcat')return HC_OFF_CATS;
    if(this.state==='offtopic')return HC_OFF_DATA[this.cat].topics;
    return [];
  }
  handleTouch(x,y){
    if(this.loading)return;
    if(this.state==='main'){
      if(y>=285){this.sim.setState('LAUNCHER');return;}
      if(y>=80&&y<=120){this.state='offcat';this.sel=0;this.scroll=0;this.draw();}
      else if(y>=140&&y<=180){log('Online help (stub)','info');}
      return;
    }
    if(this.state==='viewer'){
      if(y>=285){
        if(x<80)this.state='offtopic';
        else if(x<160){if(this.viewerScroll>0)this.viewerScroll--;}
        else this.viewerScroll++;
        this.draw();
      }
      return;
    }
    const list=this._currentList();
    if(y>=45&&y<=270){
      const idx=this.scroll+Math.floor((y-45)/30);
      if(idx<list.length){this.sel=idx;this._activate();}
      return;
    }
    if(y>=285){
      if(x<70){
        if(this.state==='offcat'){this.state='main';this.sel=0;this.draw();}
        else if(this.state==='offtopic'){this.state='offcat';this.sel=this.cat;this.draw();}
      } else if(x<130){if(this.sel>0){this.sel--;if(this.sel<this.scroll)this.scroll=this.sel;this.draw();}}
      else if(x<200)this._activate();
      else{if(this.sel<list.length-1){this.sel++;if(this.sel>=this.scroll+7)this.scroll=this.sel-6;this.draw();}}
    }
  }
  _activate(){
    const list=this._currentList();
    if(this.state==='offcat'){this.cat=this.sel;this.state='offtopic';this.sel=0;this.scroll=0;this.draw();}
    else if(this.state==='offtopic'){
      this.viewerTitle=HC_OFF_DATA[this.cat].topics[this.sel];
      this.viewerContent=HC_OFF_DATA[this.cat].content[this.sel];
      this.viewerScroll=0;this.state='viewer';this.draw();
    }
  }
  physical(n){if(n==='UP')this.handleTouch(100,300);else if(n==='SEL')this.handleTouch(165,300);else if(n==='DN')this.handleTouch(218,300);}
}

/* =========================================================
   Simulator (FIX #6: exitRequested flag, requestExit)
   ========================================================= */
class Simulator{
  constructor(){
    this.canvas=document.getElementById('screen');
    this.disp=new TFTDisplay(this.canvas);
    this.vfs=new VirtualFS();
    this.keyboard=new OnScreenKeyboard(this);
    this.touch={x:0,y:0,touched:false};
    this.exitRequested=false;
    this.system=buildSystemAPI(this);
    this.fsAPI=buildFSAPI(this.vfs);
    this.wifiDisabled=true;this.wifiEnabled=false;
    this.ntpEnabled=true;this.use24h=true;this.timezone='UTC0';
    this.manualTimeOffset=0;this.useManualTime=false;
    this.state='LAUNCHER';
    this.screens={
      LAUNCHER:new Launcher(this),
      INSTALLER:new Installer(this),
      SETTINGS:new Settings(this),
      SETTINGS_WIFI:new WiFiSettings(this),
      TOUCH_CAL:new TouchCal(this),
      SETTINGS_APPS:new ManageApps(this),
      SETTINGS_TIME:new TimeSettings(this),
      SETTINGS_TIME_MANUAL:new TimeManual(this),
      SETTINGS_ABOUT:new AboutDevice(this),
      UPDATER:new Updater(this,false),
      APP_STORE:new AppStore(this),
      HELP_CENTER:new HelpCenter(this)
    };
    this.launcher=this.screens.LAUNCHER;
    this._bindInput();
    this._bindUI();
    this.setState('LAUNCHER');
    let frames=0,t0=performance.now();
    setInterval(()=>{
      const now=performance.now();
      document.getElementById('fps-label').textContent=Math.round(frames*1000/(now-t0))+' fps';
      frames=0;t0=now;frames++;
    },1000);
  }
  getTimeStr(){
    const d=this.useManualTime?new Date(Date.now()+this.manualTimeOffset):new Date();
    if(this.use24h)return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    let h=d.getHours()%12;if(h===0)h=12;
    return String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()>=12?'PM':'AM');
  }
  setState(s){
    this.state=s;
    document.getElementById('state-label').textContent=s;
    if(s==='RUN_APP')return;
    if(this.screens[s])this.screens[s].draw();
    else if(s==='UPDATER'){this.screens.UPDATER=new Updater(this,false);this.screens.UPDATER.check();}
  }
  _bindInput(){
    const cvs=this.canvas;
    const getXY=(cx,cy)=>{
      const r=cvs.getBoundingClientRect();
      const x=Math.floor((cx-r.left)*cvs.width/r.width);
      const y=Math.floor((cy-r.top)*cvs.height/r.height);
      return {x:Math.max(0,Math.min(cvs.width-1,x)),y:Math.max(0,Math.min(cvs.height-1,y))};
    };
    const press=(cx,cy)=>{const p=getXY(cx,cy);this._handlePress(p.x,p.y);};
    cvs.addEventListener('mousedown',e=>{e.preventDefault();press(e.clientX,e.clientY);});
    cvs.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];press(t.clientX,t.clientY);},{passive:false});
    // FIX #7: always reset touch on release while RUN_APP
    const release=()=>{if(this.state==='RUN_APP')this.touch.touched=false;};
    cvs.addEventListener('mouseup',release);
    cvs.addEventListener('mouseleave',release);
    cvs.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
    document.querySelectorAll('.ctrl-btn').forEach(btn=>{
      btn.addEventListener('click',()=>this.physicalButton(btn.dataset.key));
    });
  }
  /* FIX #8: X handled before keyboard so it always works */
  _handlePress(x,y){
    if(this.state==='RUN_APP'&&x>=200&&y<=40){this._requestExit();return;}
    if(this.keyboard.active){this.keyboard.handleTouch(x,y);return;}
    if(this.state==='RUN_APP'){this.touch.x=x;this.touch.y=y;this.touch.touched=true;return;}
    const s=this.screens[this.state];
    if(s&&s.handleTouch)s.handleTouch(x,y);
  }
  _requestExit(){
    this.exitRequested=true;
    if(this.keyboard.active)this.keyboard.cancel();
  }
  physicalButton(name){
    if(this.state==='RUN_APP')return;
    const s=this.screens[this.state];
    if(s&&s.physical)s.physical(name);
  }
  /* FIX #9: proper OS_EXIT handling; skip wait after forced exit */
  async launchApp(app,codeOverride){
    let code;
    if(codeOverride!=null)code=codeOverride;
    else code=this.vfs.readTextFile(app.isFolder?app.path+'/main.js':app.path);
    if(!code){log('Error: main.js not found','err');return;}

    // Syntax check
    try{new Function('System','FS',code);}
    catch(e){await this._showError(e.message);return;}

    this.exitRequested=false;
    this.touch={x:0,y:0,touched:false};
    this.state='RUN_APP';
    document.getElementById('state-label').textContent='RUN_APP';
    this.disp.clear();
    this.disp.fillRoundRect(200,0,40,30,5,TFT_RED);
    this.disp.setTextColor(TFT_WHITE,TFT_RED);
    this.disp.drawString('X',213,6,2);

    // Transform System.delay/prompt to await
    let transformed=code
      .replace(/\bSystem\.delay\(/g,'await System.delay(')
      .replace(/\bSystem\.delayMicroseconds\(/g,'await System.delayMicroseconds(')
      .replace(/\bSystem\.prompt\(/g,'await System.prompt(');

    const body=`"use strict"; return (async () => { ${transformed} })();`;
    let fn;
    try{fn=new Function('System','FS','BLACK','WHITE','RED','GREEN','BLUE','YELLOW','CYAN','MAGENTA','ORANGE','DARKGREY',body);}
    catch(e){await this._showError(e.message);return;}

    log('▶ Running: '+app.name,'info');
    let forceExited=false;
    try{
      await fn(this.system,this.fsAPI,
        TFT_BLACK,TFT_WHITE,TFT_RED,TFT_GREEN,TFT_BLUE,TFT_YELLOW,
        TFT_CYAN,TFT_MAGENTA,TFT_ORANGE,TFT_DARKGREY);
      log('■ App finished');
    }catch(e){
      if(e.message==='OS_EXIT'||e.code==='OS_EXIT'){log('■ App exited via X');forceExited=true;}
      else{log('✖ App error: '+e.message,'err');await this._showError(e.message);return;}
    }
    this.exitRequested=false;
    // If user already tapped X, go straight back; else show X and wait
    if(!forceExited){
      this.disp.fillRoundRect(200,0,40,30,5,TFT_RED);
      this.disp.setTextColor(TFT_WHITE,TFT_RED);
      this.disp.drawString('X',213,6,2);
      await new Promise(res=>{
        const check=setInterval(()=>{
          if(this.touch.touched&&this.touch.x>=200&&this.touch.y<=40){
            clearInterval(check);this.touch.touched=false;res();
          }
        },40);
      });
    }
    this.setState('LAUNCHER');
  }
  _showError(msg){
    this.state='RUN_APP';
    document.getElementById('state-label').textContent='ERROR';
    this.disp.fillScreen(TFT_RED);
    this.disp.setTextColor(TFT_WHITE,TFT_RED);
    this.disp.drawString('JS ERROR',10,10,4);
    const lines=String(msg).split('\n');
    let y=60;
    for(let i=0;i<lines.length&&i<8;i++){this.disp.drawString(lines[i].substring(0,40),10,y,2);y+=20;}
    this.disp.fillRoundRect(200,0,40,30,5,TFT_WHITE);
    this.disp.setTextColor(TFT_RED,TFT_WHITE);
    this.disp.drawString('X',213,6,2);
    return new Promise(res=>{
      const check=setInterval(()=>{
        if(this.touch.touched&&this.touch.x>=200&&this.touch.y<=40){
          clearInterval(check);this.touch.touched=false;res();
        }
      },40);
    }).then(()=>this.setState('LAUNCHER'));
  }
  _bindUI(){
    document.getElementById('btn-install').addEventListener('click',()=>{
      const name=document.getElementById('app-name').value.trim()||'My App';
      let pkg=document.getElementById('app-pkg').value.trim()||'com.demo.app';
      pkg=pkg.toLowerCase().replace(/\s+/g,'');
      if(!pkg.includes('.'))pkg='com.demo.'+pkg.replace(/[^a-z0-9]/g,'');
      const code=document.getElementById('app-code').value;
      const dir='/local/apps/'+pkg;
      this.vfs.mkdir(dir);
      this.vfs.writeTextFile(dir+'/app.json',JSON.stringify({
        name,packageName:pkg,version:'1.0.0',api:1,author:'You',type:'App',category:'User',description:'Installed via simulator'
      },null,2));
      this.vfs.writeTextFile(dir+'/main.js',code);
      this.launcher.scanApps();
      log('💾 Installed: '+name+' ('+pkg+')','ok');
    });
    document.getElementById('btn-run').addEventListener('click',()=>{
      const name=document.getElementById('app-name').value.trim()||'My App';
      const code=document.getElementById('app-code').value;
      this.launchApp({name,path:'__tmp__',isFolder:true},code);
    });
    document.getElementById('btn-reset').addEventListener('click',()=>{
      if(!confirm('Reset file system? All custom apps will be deleted.'))return;
      this.vfs.reset();this.launcher.scanApps();this.setState('LAUNCHER');
      log('⟲ File system reset','warn');
    });
  }
}
