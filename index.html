<script>
const TFT_BLACK=0x0000, TFT_WHITE=0xFFFF, TFT_RED=0xF800;
const TFT_GREEN=0x07E0, TFT_BLUE=0x001F, TFT_YELLOW=0xFFE0;
const TFT_CYAN=0x07FF, TFT_MAGENTA=0xF81F, TFT_ORANGE=0xFD20;
const TFT_DARKGREY=0x7BEF, TFT_LIGHTGREY=0xC618, TFT_PURPLE=0x780F;

const KRYONOS_VERSION = "2.0.0";
const KRYONOS_API_LEVEL = 2;

const STATE_LAUNCHER   = 0;
const STATE_SETTINGS   = 1;
const STATE_RUN_APP    = 2;
const STATE_INSTALLER  = 3;
const STATE_APP_STORE  = 13;
const STATE_HELP_CENTER= 14;

const TL_DATUM=0, TC_DATUM=1, MC_DATUM=4, ML_DATUM=3;

const consoleEl = document.getElementById('console');
function log(msg, cls){
  if (!consoleEl) return;
  const d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('en-GB', {hour12:false}) + '] ' + msg;
  consoleEl.appendChild(d);
  while (consoleEl.children.length > 200) consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* =========================================================
   IndexedDB VFS
   ========================================================= */
class IndexedDB_VFS {
  constructor(sim){
    this.sim = sim;
    this.dbName = 'KryonOS_Storage_v3';
    this.storeName = 'files';
    this.db = null;
    this.cache = new Map();
  }

  async init(){
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(this.dbName, 2);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(this.storeName)) {
            db.createObjectStore(this.storeName, { keyPath: 'path' });
          }
        };
        req.onsuccess = async (e) => {
          this.db = e.target.result;
          await this.loadAllFromDB();
          if (this.cache.size === 0) {
            await this.seedDefaults();
          }
          resolve();
        };
        req.onerror = () => {
          this.seedDefaults();
          resolve();
        };
      } catch(e) {
        this.seedDefaults();
        resolve();
      }
    });
  }

  loadAllFromDB(){
    return new Promise((resolve) => {
      if (!this.db) return resolve();
      const tx = this.db.transaction(this.storeName, 'readonly');
      const store = tx.objectStore(this.storeName);
      const req = store.getAll();
      req.onsuccess = () => {
        this.cache.clear();
        (req.result || []).forEach(item => this.cache.set(item.path, item));
        resolve();
      };
      req.onerror = () => resolve();
    });
  }

  async seedDefaults(){
    const defs = [
      { path: '/local', isDir: true },
      { path: '/local/apps', isDir: true },
      { path: '/sd', isDir: true },
      { path: '/sd/apps', isDir: true }
    ];
    for (const d of defs) {
      this._putDB(d.path, null, d.isDir, false);
    }
  }

  _putDB(path, content, isDir = false, notify = true){
    const record = {
      path, content: isDir ? null : String(content),
      isDir, size: isDir ? 0 : (content ? content.length : 0)
    };
    this.cache.set(path, record);
    if (this.db) {
      try {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        tx.objectStore(this.storeName).put(record);
      } catch(e){}
    }
    if (notify) this.sim.onStorageChanged();
    return true;
  }

  exists(p){ return this.cache.has(p); }
  isDirectory(p){ const it = this.cache.get(p); return it ? it.isDir : false; }
  readTextFile(p){ const it = this.cache.get(p); return (it && !it.isDir) ? it.content : ''; }
  writeTextFile(p, c){
    if (!p) return false;
    this._mkpar(p);
    return this._putDB(p, c, false, true);
  }
  mkdir(p){
    if (this.cache.has(p)) return false;
    this._mkpar(p);
    return this._putDB(p, null, true, true);
  }
  deleteFile(p){
    this.cache.delete(p);
    if (this.db) {
      try {
        const tx = this.db.transaction(this.storeName, 'readwrite');
        tx.objectStore(this.storeName).delete(p);
      } catch(e){}
    }
    this.sim.onStorageChanged();
    return true;
  }
  listDirFull(p){
    if (!this.isDirectory(p)) return [];
    const pre = p.endsWith('/') ? p : p + '/';
    const out = [];
    for (const [k, it] of this.cache.entries()){
      if (k.startsWith(pre) && k !== p){
        const rest = k.substring(pre.length);
        if (!rest.includes('/')) out.push({ name: rest, path: k, isDir: it.isDir });
      }
    }
    return out;
  }
  _mkpar(p){
    const parts = p.split('/').filter(Boolean);
    let cur = '';
    for (let i = 0; i < parts.length - 1; i++){
      cur += '/' + parts[i];
      if (!this.cache.has(cur)) {
        this._putDB(cur, null, true, false);
      }
    }
  }
  async reset(){
    if (this.db) {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).clear();
    }
    this.cache.clear();
    await this.seedDefaults();
    log('Storage formatted successfully.', 'warn');
  }
}

/* =========================================================
   TFT Display
   ========================================================= */
class TFTDisplay {
  constructor(cv){
    this.canvas = cv;
    this.ctx = cv.getContext('2d', {alpha:false});
    this.ctx.imageSmoothingEnabled = false;
    this.W = cv.width; this.H = cv.height;
    this.fgColor = '#fff'; this.bgColor = null;
    this.textSize = 1; this.textDatum = TL_DATUM;
    this.clear();
  }
  clear(){ this.ctx.fillStyle = '#000'; this.ctx.fillRect(0, 0, this.W, this.H); }
  static c565(c){
    const r = ((c >> 11) & 0x1F) * 255 / 31 | 0;
    const g = ((c >> 5) & 0x3F) * 255 / 63 | 0;
    const b = (c & 0x1F) * 255 / 31 | 0;
    return `rgb(${r},${g},${b})`;
  }
  static FONTS = { 1: 8, 2: 14, 4: 26, 6: 44, 7: 44, 8: 56 };
  fillScreen(c){ this.ctx.fillStyle = TFTDisplay.c565(c); this.ctx.fillRect(0, 0, this.W, this.H); }
  fillRect(x,y,w,h,c){ if(w<=0||h<=0)return; this.ctx.fillStyle = TFTDisplay.c565(c); this.ctx.fillRect(x,y,w,h); }
  drawRect(x,y,w,h,c){ this.ctx.strokeStyle = TFTDisplay.c565(c); this.ctx.lineWidth = 1; this.ctx.strokeRect(x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1)); }
  drawLine(x0,y0,x1,y1,c){ this.ctx.strokeStyle = TFTDisplay.c565(c); this.ctx.beginPath(); this.ctx.moveTo(x0+.5,y0+.5); this.ctx.lineTo(x1+.5,y1+.5); this.ctx.stroke(); }
  drawPixel(x,y,c){ this.ctx.fillStyle = TFTDisplay.c565(c); this.ctx.fillRect(x,y,1,1); }
  drawCircle(x,y,r,c){ this.ctx.strokeStyle = TFTDisplay.c565(c); this.ctx.beginPath(); this.ctx.arc(x,y,Math.abs(r),0,Math.PI*2); this.ctx.stroke(); }
  fillCircle(x,y,r,c){ this.ctx.fillStyle = TFTDisplay.c565(c); this.ctx.beginPath(); this.ctx.arc(x,y,Math.abs(r),0,Math.PI*2); this.ctx.fill(); }
  _rr(ctx,x,y,w,h,r){ r = Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  drawRoundRect(x,y,w,h,r,c){ this.ctx.strokeStyle = TFTDisplay.c565(c); this.ctx.lineWidth = 1; this._rr(this.ctx,x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1),r); this.ctx.stroke(); }
  fillRoundRect(x,y,w,h,r,c){ if(w<=0||h<=0)return; this.ctx.fillStyle = TFTDisplay.c565(c); this._rr(this.ctx,x,y,w,h,r); this.ctx.fill(); }
  setTextColor(fg,bg){ this.fgColor = TFTDisplay.c565(fg); this.bgColor = (bg != null) ? TFTDisplay.c565(bg) : null; }
  setTextDatum(d){ this.textDatum = d; }
  drawString(str,x,y,font=2){
    const base = TFTDisplay.FONTS[font] || 14;
    const sz = Math.max(6, Math.floor(base * this.textSize));
    this.ctx.font = `bold ${sz}px "Courier New",monospace`;
    str = String(str);
    const w = this.ctx.measureText(str).width;

    let rx = x, ry = y;
    if (this.textDatum === MC_DATUM) { rx = x - w / 2; ry = y - sz / 2; }
    else if (this.textDatum === TC_DATUM) { rx = x - w / 2; ry = y; }
    else if (this.textDatum === ML_DATUM) { rx = x; ry = y - sz / 2; }

    this.ctx.textBaseline = 'top';
    this.ctx.textAlign = 'left';

    if (this.bgColor) {
      this.ctx.fillStyle = this.bgColor;
      this.ctx.fillRect(rx, ry, w, sz);
    }
    this.ctx.fillStyle = this.fgColor;
    this.ctx.fillText(str, rx, ry);
  }
  color(r,g,b){
    r = Math.max(0, Math.min(255, r|0));
    g = Math.max(0, Math.min(255, g|0));
    b = Math.max(0, Math.min(255, b|0));
    return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
  }
}

/* =========================================================
   Notification Overlay (matches KryonOS NotificationManager)
   ========================================================= */
class NotificationOverlay {
  constructor(sim) {
    this.sim = sim;
    this.queue = [];
    this.active = null;
    this.state = 0; // 0: IDLE, 1: SLIDE_IN, 2: DISPLAYING, 3: SLIDE_OUT
    this.currentY = -44;
    this.animStart = 0;
    this.displayStart = 0;
    this.duration = 3000;
  }

  post(title, message, icon = 'info', duration = 3000) {
    this.queue.push({
      title: String(title || 'Notification').substring(0, 24),
      message: String(message || '').substring(0, 48),
      icon: (icon || 'info').toLowerCase(),
      duration: Math.max(800, duration || 3000)
    });
    if (!this.active) {
      this._next();
    }
  }

  _next() {
    if (this.queue.length === 0) {
      this.active = null;
      this.state = 0;
      this.currentY = -44;
      return;
    }
    this.active = this.queue.shift();
    this.state = 1; // SLIDE_IN
    this.currentY = -44;
    this.animStart = performance.now();
    this.duration = this.active.duration;
  }

  dismiss() {
    if (this.active && this.state !== 3) {
      this.state = 3;
      this.animStart = performance.now();
    }
  }

  clearAll() {
    this.queue = [];
    this.active = null;
    this.state = 0;
    this.currentY = -44;
  }

  updateAndRender() {
    if (!this.active || this.state === 0) return;
    const now = performance.now();
    const animMs = 180;
    const restingY = 8;
    const hiddenY = -44;

    if (this.state === 1) { // SLIDE_IN
      const elapsed = now - this.animStart;
      if (elapsed >= animMs) {
        this.currentY = restingY;
        this.state = 2; // DISPLAYING
        this.displayStart = now;
      } else {
        const t = elapsed / animMs;
        const ease = 1 - Math.pow(1 - t, 3);
        this.currentY = hiddenY + (restingY - hiddenY) * ease;
      }
    } else if (this.state === 2) { // DISPLAYING
      this.currentY = restingY;
      if (now - this.displayStart >= this.duration) {
        this.state = 3; // SLIDE_OUT
        this.animStart = now;
      }
    } else if (this.state === 3) { // SLIDE_OUT
      const elapsed = now - this.animStart;
      if (elapsed >= animMs) {
        this.currentY = hiddenY;
        this._next();
        return;
      } else {
        const t = elapsed / animMs;
        const ease = t * t * t;
        this.currentY = restingY + (hiddenY - restingY) * ease;
      }
    }

    this._drawCard(this.currentY);
  }

  _drawCard(y) {
    if (y <= -42) return;
    const d = this.sim.disp;
    const w = 224, h = 42, x = 8, r = 6;
    
    let borderColor = TFT_CYAN;
    let badgeColor = TFT_CYAN;
    let badgeText = 'i';

    if (this.active.icon === 'warning' || this.active.icon === 'warn') {
      borderColor = TFT_YELLOW;
      badgeColor = TFT_YELLOW;
      badgeText = '!';
    } else if (this.active.icon === 'error' || this.active.icon === 'danger') {
      borderColor = TFT_RED;
      badgeColor = TFT_RED;
      badgeText = 'X';
    } else if (this.active.icon === 'success' || this.active.icon === 'ok') {
      borderColor = TFT_GREEN;
      badgeColor = TFT_GREEN;
      badgeText = 'V';
    }

    // Card background (Dark navy 0x10A2)
    d.fillRoundRect(x, y, w, h, r, 0x10A2);
    d.drawRoundRect(x, y, w, h, r, borderColor);

    // Accent badge circle
    d.fillCircle(x + 16, y + 21, 10, badgeColor);
    d.setTextColor(TFT_BLACK, badgeColor);
    d.setTextDatum(MC_DATUM);
    d.drawString(badgeText, x + 16, y + 21, 2);

    // Title
    d.setTextDatum(TL_DATUM);
    d.setTextColor(TFT_WHITE, 0x10A2);
    d.drawString(this.active.title, x + 34, y + 6, 2);

    // Message
    d.setTextColor(0xBDD7, 0x10A2);
    d.drawString(this.active.message, x + 34, y + 24, 1);
  }
}

/* =========================================================
   On-Screen Keyboard
   ========================================================= */
class OnScreenKeyboard {
  constructor(sim){
    this.sim = sim; this.text = ''; this.caps = false; this.active = false;
    this.resolve = null; this.promptMsg = '';
    this.kw = 12; this.kh = 4;
    this.keyset = [
      [['1','!'],['2','@'],['3','#'],['4','$'],['5','%'],['6','^'],['7','&'],['8','*'],['9','('],['0',')'],['-','_'],['=','+']],
      [['q','Q'],['w','W'],['e','E'],['r','R'],['t','T'],['y','Y'],['u','U'],['i','I'],['o','O'],['p','P'],['[','{'],[']','}']],
      [['a','A'],['s','S'],['d','D'],['f','F'],['g','G'],['h','H'],['j','J'],['k','K'],['l','L'],[';',':'],['\'','"'],['\\','|']],
      [['\\','|'],['z','Z'],['x','X'],['c','C'],['v','V'],['b','B'],['n','N'],['m','M'],[',','<'],['.','>'],['/','?'],[' ',' ']]
    ];
  }
  show(promptMsg, initial){
    this.sim.touch.touched = false;
    this.sim.touch.justPressed = false;
    this.text = initial != null ? String(initial) : ''; 
    this.caps = false; 
    this.active = true;
    this.promptMsg = promptMsg || 'Input';
    this.draw();
    return new Promise((res) => { this.resolve = res; });
  }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.setTextDatum(TL_DATUM);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.drawString(String(this.promptMsg).substring(0, 24), 5, 10, 2);

    d.drawRect(5, 30, 230, 30, TFT_GREEN);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    const disp = this.text.length > 18 ? this.text.substring(this.text.length - 18) : this.text;
    d.drawString(disp + '_', 10, 38, 2);

    const btnW = 240 / 5;
    const btns = ['OK', this.caps ? 'abc' : 'ABC', 'DEL', 'SPACE', 'ESC'];
    d.setTextDatum(MC_DATUM);
    for (let i = 0; i < 5; i++){
      d.drawRect(i * btnW, 70, btnW, 30, TFT_GREEN);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString(btns[i], i * btnW + btnW / 2, 85, 2);
    }

    const keyW = 240 / this.kw;
    const keyH = (320 - 110) / this.kh;
    for (let y = 0; y < this.kh; y++){
      for (let x = 0; x < this.kw; x++){
        const px = x * keyW;
        const py = 110 + y * keyH;
        d.drawRect(px, py, keyW, keyH, TFT_DARKGREY);
        const c = this.caps ? this.keyset[y][x][1] : this.keyset[y][x][0];
        d.setTextColor(TFT_WHITE, TFT_BLACK);
        d.drawString(c, px + keyW / 2, py + keyH / 2, 2);
      }
    }
  }
  handleTouch(x, y){
    if (y >= 70 && y <= 100){
      const btnW = 240 / 5;
      const idx = Math.floor(x / btnW);
      if (idx === 0) this.finish(this.text);
      else if (idx === 1) { this.caps = !this.caps; this.draw(); }
      else if (idx === 2) { if (this.text.length > 0) this.text = this.text.slice(0, -1); this.draw(); }
      else if (idx === 3) { this.text += ' '; this.draw(); }
      else this.finish('');
      return;
    }
    if (y >= 110){
      const keyW = 240 / this.kw;
      const keyH = (320 - 110) / this.kh;
      const kx = Math.floor(x / keyW);
      const ky = Math.floor((y - 110) / keyH);
      if (kx >= 0 && kx < this.kw && ky >= 0 && ky < this.kh){
        const c = this.caps ? this.keyset[ky][kx][1] : this.keyset[ky][kx][0];
        this.text += c; this.draw();
      }
    }
  }
  finish(val){
    if (!this.active) return;
    this.active = false;
    const r = this.resolve;
    this.resolve = null;
    if (r) r(val);
  }
}

/* =========================================================
   System Code Transpiler
   ========================================================= */
function universalAsyncTransform(source) {
  let code = source;
  // Convert all functions to async
  code = code.replace(/\bfunction\s+([a-zA-Z0-9_$]+)\s*\(/g, 'async function $1(');
  code = code.replace(/\bfunction\s*\(/g, 'async function(');
  
  // Await async built-in methods
  code = code.replace(/(?<!await\s+)\bSystem\.delay\(/g, 'await System.delay(');
  code = code.replace(/(?<!await\s+)\bSystem\.delayMicroseconds\(/g, 'await System.delayMicroseconds(');
  code = code.replace(/(?<!await\s+)\bSystem\.prompt\(/g, 'await System.prompt(');
  
  // Custom functions called inside apps that might block
  code = code.replace(/(?<!await\s+)\bhandleTouch\(/g, 'await handleTouch(');
  code = code.replace(/(?<!await\s+)\bupdateUI\(/g, 'updateUI(');
  return code;
}

/* =========================================================
   System API Builder
   ========================================================= */
function buildSystemAPI(sim){
  const disp = sim.disp;
  const startTime = Date.now();

  return {
    fillScreen: (c) => {
      disp.fillScreen(c);
      if (sim.state === STATE_RUN_APP && !sim.keyboard.active) {
        disp.fillRoundRect(200, 0, 40, 30, 5, TFT_RED);
        disp.setTextColor(TFT_WHITE, TFT_RED);
        disp.setTextDatum(MC_DATUM);
        disp.drawString("X", 220, 15, 2);
        disp.setTextDatum(TL_DATUM);
      }
    },
    fillRect: (x,y,w,h,c) => disp.fillRect(x,y,w,h,c),
    drawRect: (x,y,w,h,c) => disp.drawRect(x,y,w,h,c),
    drawLine: (a,b,c,d,e) => disp.drawLine(a,b,c,d,e),
    drawPixel: (x,y,c) => disp.drawPixel(x,y,c),
    drawCircle: (x,y,r,c) => disp.drawCircle(x,y,r,c),
    fillCircle: (x,y,r,c) => disp.fillCircle(x,y,r,c),
    drawRoundRect: (...a) => disp.drawRoundRect(...a),
    fillRoundRect: (...a) => disp.fillRoundRect(...a),
    drawString: (s, x, y, f=2) => {
      disp.setTextDatum(TL_DATUM);
      disp.drawString(s, x, y, f);
    },
    setTextColor: (f, b) => disp.setTextColor(f, b),
    color: (r, g, b) => disp.color(r, g, b),
    screenWidth: () => 240,
    screenHeight: () => 320,

    getTouch: () => {
      if (sim.exitRequested) throw Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' });
      if (sim.keyboard.active) return { x: 0, y: 0, touched: false };
      const t = sim.touch;
      if ((t.touched || t.justPressed) && t.x >= 200 && t.y <= 40) {
        throw Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' });
      }
      const wasTouched = t.touched || t.justPressed;
      t.justPressed = false;
      return { x: t.x, y: t.y, touched: wasTouched };
    },

    millis: () => Date.now() - startTime,
    delay: (ms) => new Promise((res, rej) => {
      const cap = Math.min(Math.max(0, ms|0), 30000);
      const start = Date.now();
      const tick = () => {
        if (sim.exitRequested){ rej(Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' })); return; }
        if (Date.now() - start >= cap){ res(); return; }
        setTimeout(tick, 10);
      };
      tick();
    }),
    print: (m) => log(String(m)),
    println: (m) => log(String(m)),
    getYear: () => new Date().getFullYear(),
    getMonth: () => new Date().getMonth() + 1,
    getDay: () => new Date().getDate(),
    getOSVersion: () => KRYONOS_VERSION,
    getAPILevel: () => KRYONOS_API_LEVEL,
    prompt: (msg, init) => sim.keyboard.show(msg, init),
    notify: (title, msg, icon, duration) => {
      log(`[Notify] ${title}: ${msg}`, 'ok');
      if (sim.notif) sim.notif.post(title, msg, icon, duration);
    }
  };
}

/* =========================================================
   App Store Live GitHub Integration
   ========================================================= */
class AppStoreUI {
  constructor(sim){
    this.sim = sim;
    this.state = 0; // 0=Categories, 1=Apps, 2=Details, 3=Msg
    this.INDEX_URL = "https://raw.githubusercontent.com/Haris16-code/KryonOS-AppStore/refs/heads/main/index.json";
    this.categories = [];
    this.currentApps = [];
    this.currentCategoryName = '';
    this.selectedCatIdx = 0;
    this.selectedAppIdx = 0;
    this.scrollOffset = 0;
    this.dialogMsg = '';
    this.loading = false;
  }

  async fetchCategories() {
    this.loading = true;
    this.dialogMsg = "Connecting to GitHub Store...";
    this.draw();
    try {
      const res = await fetch(this.INDEX_URL);
      const data = await res.json();
      this.categories = [{ name: "[ Check For Apps Update ]", url: "UPDATE_ACTION" }];
      if (data.categories) {
        for (const [name, url] of Object.entries(data.categories)) {
          this.categories.push({ name, url });
        }
      }
      this.loading = false;
      this.draw();
    } catch(e) {
      this.dialogMsg = "Store Offline: " + e.message;
      this.state = 3;
      this.loading = false;
      this.draw();
    }
  }

  async fetchCategoryApps(url) {
    if (url === "UPDATE_ACTION") {
      this.dialogMsg = "All Apps are up to date!";
      this.state = 3;
      this.draw();
      return;
    }
    this.loading = true;
    this.dialogMsg = "Loading " + this.currentCategoryName + "...";
    this.draw();
    try {
      const res = await fetch(url);
      const data = await res.json();
      this.currentApps = [];
      if (data.apps) {
        for (const [id, info] of Object.entries(data.apps)) {
          this.currentApps.push({
            id,
            name: id.charAt(0).toUpperCase() + id.slice(1),
            metaUrl: info.meta,
            appUrl: info.app,
            author: "GitHub Developer",
            version: "1.0.0",
            description: "Online App Package"
          });
        }
      }
      this.state = 1;
      this.selectedAppIdx = 0;
      this.scrollOffset = 0;
      this.loading = false;
      this.draw();
    } catch(e) {
      this.dialogMsg = "Failed to load apps: " + e.message;
      this.state = 3;
      this.loading = false;
      this.draw();
    }
  }

  async fetchDetails(app) {
    this.loading = true;
    this.dialogMsg = "Fetching metadata...";
    this.draw();
    try {
      const res = await fetch(app.metaUrl);
      const meta = await res.json();
      app.name = meta.name || app.name;
      app.author = meta.author || "Unknown";
      app.version = meta.version || "1.0.0";
      app.description = meta.description || "No description.";
      app.packageName = meta.packageName || app.id;
    } catch(e){}
    this.loading = false;
    this.state = 2;
    this.draw();
  }

  async installApp(app) {
    this.loading = true;
    this.dialogMsg = "Installing " + app.name + "...";
    this.draw();
    try {
      const resMeta = await fetch(app.metaUrl);
      const meta = await resMeta.json();
      const resCode = await fetch(app.appUrl);
      const code = await resCode.text();

      const pkg = meta.packageName || app.id;
      const dir = "/local/apps/" + pkg;
      this.sim.vfs.mkdir(dir);
      this.sim.vfs.writeTextFile(dir + "/app.json", JSON.stringify(meta, null, 2));
      this.sim.vfs.writeTextFile(dir + "/main.js", code);

      log(`[AppStore] Installed ${meta.name || app.name} to storage!`, "ok");
      this.dialogMsg = `${meta.name || app.name} Installed!`;
      this.state = 3;
    } catch(e) {
      this.dialogMsg = "Install error: " + e.message;
      this.state = 3;
    }
    this.loading = false;
    this.draw();
  }

  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);

    let header = 'App Store';
    if (this.state === 1) header = this.currentCategoryName;
    else if (this.state === 2) header = 'App Details';
    else if (this.state === 3) header = 'Notice';
    d.drawString(header, 120, 21, 2);

    d.fillRect(10, 45, 220, 230, TFT_BLACK);

    if (this.loading) {
      d.setTextColor(TFT_YELLOW, TFT_BLACK);
      d.drawString(this.dialogMsg, 120, 160, 2);
      return;
    }

    if (this.state === 0) {
      if (this.categories.length === 0) {
        this.fetchCategories();
        return;
      }
      for (let i = 0; i < 7; i++){
        const idx = this.scrollOffset + i;
        if (idx >= this.categories.length) break;
        const y = 45 + i * 30;
        const label = this.categories[idx].name;

        if (idx === this.selectedCatIdx){
          d.fillRect(10, y, 220, 25, TFT_WHITE);
          d.setTextColor(TFT_BLACK, TFT_WHITE);
          d.setTextDatum(ML_DATUM);
          d.drawString('> ' + label, 15, y + 12, 2);
        } else {
          d.setTextColor(TFT_WHITE, TFT_BLACK);
          d.setTextDatum(ML_DATUM);
          d.drawString('  ' + label, 15, y + 12, 2);
        }
      }
      this._drawFooter();
    } else if (this.state === 1) {
      for (let i = 0; i < 7; i++){
        const idx = this.scrollOffset + i;
        if (idx >= this.currentApps.length) break;
        const y = 45 + i * 30;
        const label = this.currentApps[idx].name;

        if (idx === this.selectedAppIdx){
          d.fillRect(10, y, 220, 25, TFT_WHITE);
          d.setTextColor(TFT_BLACK, TFT_WHITE);
          d.setTextDatum(ML_DATUM);
          d.drawString('> ' + label, 15, y + 12, 2);
        } else {
          d.setTextColor(TFT_WHITE, TFT_BLACK);
          d.setTextDatum(ML_DATUM);
          d.drawString('  ' + label, 15, y + 12, 2);
        }
      }
      this._drawFooter();
    } else if (this.state === 2) {
      const a = this.currentApps[this.selectedAppIdx];
      if (!a) { this.state = 1; this.draw(); return; }

      d.setTextDatum(TL_DATUM);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString('Name:    ' + a.name, 15, 55, 2);
      d.drawString('Author:  ' + a.author, 15, 78, 2);
      d.drawString('Version: ' + a.version, 15, 101, 2);
      d.setTextColor(TFT_LIGHTGREY, TFT_BLACK);
      d.drawString('Desc: ' + String(a.description).substring(0, 60), 15, 130, 2);

      d.setTextDatum(MC_DATUM);
      d.fillRoundRect(25, 230, 80, 30, 4, TFT_GREEN);
      d.setTextColor(TFT_BLACK, TFT_GREEN);
      d.drawString('INSTALL', 65, 245, 2);

      d.fillRoundRect(135, 230, 80, 30, 4, TFT_RED);
      d.setTextColor(TFT_WHITE, TFT_RED);
      d.drawString('CANCEL', 175, 245, 2);
    } else if (this.state === 3) {
      d.fillRoundRect(10, 80, 220, 140, 6, TFT_DARKGREY);
      d.setTextColor(TFT_WHITE, TFT_DARKGREY);
      d.setTextDatum(MC_DATUM);
      d.drawString(this.dialogMsg, 120, 130, 2);

      d.fillRoundRect(85, 175, 70, 30, 4, TFT_BLUE);
      d.setTextColor(TFT_WHITE, TFT_BLUE);
      d.drawString('OK', 120, 190, 2);
    }
  }

  _drawFooter(){
    const d = this.sim.disp;
    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('BACK', 35, 300, 2);  d.drawString('|', 70, 300, 2);
    d.drawString('UP', 100, 300, 2);   d.drawString('|', 130, 300, 2);
    d.drawString('SEL', 165, 300, 2);  d.drawString('|', 200, 300, 2);
    d.drawString('DN', 220, 300, 2);
  }

  handleTouch(x, y){
    if (this.loading) return;

    if (this.state === 3){
      if (x >= 85 && x <= 155 && y >= 175 && y <= 210){
        this.state = 0; this.draw();
      }
      return;
    }
    if (this.state === 2){
      if (y >= 230 && y <= 260){
        if (x >= 25 && x <= 105) this.installApp(this.currentApps[this.selectedAppIdx]);
        else if (x >= 135 && x <= 215) { this.state = 1; this.draw(); }
      }
      return;
    }
    if (y >= 45 && y <= 270){
      const list = (this.state === 0) ? this.categories : this.currentApps;
      const clicked = this.scrollOffset + Math.floor((y - 45) / 30);
      if (clicked < list.length){
        if (this.state === 0) {
          this.selectedCatIdx = clicked;
          this.currentCategoryName = list[clicked].name;
          this.fetchCategoryApps(list[clicked].url);
        } else {
          this.selectedAppIdx = clicked;
          this.fetchDetails(list[clicked]);
        }
      }
      return;
    }
    if (y >= 285 && y <= 315){
      if (x < 70){
        if (this.state === 1) { this.state = 0; this.draw(); }
        else this.sim.setState(STATE_LAUNCHER);
      } else if (x >= 130 && x < 200){
        if (this.state === 0) {
          this.currentCategoryName = this.categories[this.selectedCatIdx].name;
          this.fetchCategoryApps(this.categories[this.selectedCatIdx].url);
        } else if (this.state === 1) {
          this.fetchDetails(this.currentApps[this.selectedAppIdx]);
        }
      }
    }
  }
}

/* =========================================================
   Launcher UI
   ========================================================= */
class LauncherUI {
  constructor(sim){
    this.sim = sim; this.selectedIndex = 1; this.scrollOffset = 0;
    this.apps = [];
  }
  scanApps(){
    this.apps = [];
    for (const d of ['/local/apps', '/sd/apps']){
      if (!this.sim.vfs.isDirectory(d)) continue;
      for (const e of this.sim.vfs.listDirFull(d)){
        if (e.isDir){
          const jp = e.path + '/app.json';
          if (this.sim.vfs.exists(jp)){
            try {
              const o = JSON.parse(this.sim.vfs.readTextFile(jp));
              const n = o.name || e.name;
              if (!this.apps.find(a => a.name === n)) this.apps.push({ name: n, path: e.path, isFolder: true });
            } catch(err){}
          }
        }
      }
    }
  }
  total(){ return this.apps.length + 5; }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('KryonOS Home', 120, 21, 2);

    d.fillRect(10, 45, 220, 230, TFT_BLACK);
    const total = this.total(), pp = 7;

    for (let i = 0; i < pp; i++){
      const idx = this.scrollOffset + i;
      if (idx >= total) break;
      const y = 45 + i * 30;
      let name = '', isHdr = false;

      if (idx === 0) { name = '[ SYSTEM ]'; isHdr = true; }
      else if (idx === 1) name = 'App Store';
      else if (idx === 2) name = 'App Installer';
      else if (idx === 3) name = 'Settings';
      else if (idx === 4) { name = '[ APPS ]'; isHdr = true; }
      else name = this.apps[idx - 5].name;

      if (isHdr){
        d.setTextColor(TFT_DARKGREY, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString(name, 15, y + 12, 2);
      } else if (idx === this.selectedIndex){
        d.fillRect(10, y, 220, 25, TFT_WHITE);
        d.setTextColor(TFT_BLACK, TFT_WHITE);
        d.setTextDatum(ML_DATUM);
        d.drawString('> ' + name, 15, y + 12, 2);
      } else {
        d.setTextColor(TFT_WHITE, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString('  ' + name, 15, y + 12, 2);
      }
    }

    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('UP', 30, 300, 2);  d.drawString('|', 60, 300, 2);
    d.drawString('SEL', 120, 300, 2); d.drawString('|', 180, 300, 2);
    d.drawString('DN', 210, 300, 2);
  }
  handleTouch(x, y){
    const total = this.total();
    if (y >= 45 && y <= 270){
      const idx = this.scrollOffset + Math.floor((y - 45) / 30);
      if (idx < total && idx !== 0 && idx !== 4){
        this.selectedIndex = idx;
        this.draw();
        this.execute();
      }
      return;
    }
    if (y >= 285 && y <= 315){
      if (x < 60 && this.selectedIndex > 1){
        this.selectedIndex--;
        if (this.selectedIndex === 4) this.selectedIndex--;
        this.draw();
      } else if (x > 60 && x < 180){
        this.execute();
      } else if (x > 180 && this.selectedIndex < total - 1){
        this.selectedIndex++;
        if (this.selectedIndex === 4) this.selectedIndex++;
        this.draw();
      }
    }
  }
  execute(){
    const s = this.selectedIndex;
    if (s === 1) this.sim.setState(STATE_APP_STORE);
    else if (s === 2) this.sim.setState(STATE_INSTALLER);
    else if (s === 3) this.sim.setState(STATE_SETTINGS);
    else if (s > 4 && this.apps[s - 5]) this.sim.launchApp(this.apps[s - 5]);
  }
}

/* =========================================================
   Simulator Core Class
   ========================================================= */
class Simulator {
  constructor(){
    this.canvas = document.getElementById('screen');
    this.disp = new TFTDisplay(this.canvas);
    this.vfs = new IndexedDB_VFS(this);
    this.keyboard = new OnScreenKeyboard(this);
    this.notif = new NotificationOverlay(this);
    this.touch = { x: 0, y: 0, touched: false, justPressed: false };
    this.exitRequested = false;

    this.system = buildSystemAPI(this);
    this.state = STATE_LAUNCHER;

    this.screens = {
      [STATE_LAUNCHER]: new LauncherUI(this),
      [STATE_APP_STORE]: new AppStoreUI(this),
      [STATE_INSTALLER]: new GenericBackUI(this, 'Installer', STATE_LAUNCHER),
      [STATE_SETTINGS]: new GenericBackUI(this, 'Settings', STATE_LAUNCHER)
    };
    this.launcher = this.screens[STATE_LAUNCHER];

    this._bindInput();
    this._bindUI();

    this.vfs.init().then(() => {
      this.launcher.scanApps();
      this.setState(STATE_LAUNCHER);
    });

    let frames = 0, lastT = performance.now();
    const countFrame = () => {
      frames++;
      this.notif.updateAndRender();
      requestAnimationFrame(countFrame);
    };
    requestAnimationFrame(countFrame);
    setInterval(() => {
      const now = performance.now();
      const fpsEl = document.getElementById('fps-label');
      if (fpsEl) fpsEl.textContent = Math.round(frames * 1000 / (now - lastT)) + ' fps';
      frames = 0; lastT = now;
    }, 1000);
  }

  onStorageChanged(){
    this.launcher.scanApps();
    if (this.state === STATE_LAUNCHER) this.launcher.draw();
  }

  setState(s){
    this.state = s;
    const labels = {
      [STATE_LAUNCHER]: 'LAUNCHER', [STATE_SETTINGS]: 'SETTINGS',
      [STATE_RUN_APP]: 'RUN_APP', [STATE_APP_STORE]: 'APP_STORE'
    };
    const stEl = document.getElementById('state-label');
    if (stEl) stEl.textContent = labels[s] || ('STATE_' + s);
    if (s === STATE_RUN_APP) return;
    this.disp.fillScreen(TFT_BLACK);
    const scr = this.screens[s];
    if (scr) scr.draw();
  }

  _bindInput(){
    const cvs = this.canvas;
    const getXY = (cx, cy) => {
      const r = cvs.getBoundingClientRect();
      const x = Math.floor((cx - r.left) * cvs.width / r.width);
      const y = Math.floor((cy - r.top) * cvs.height / r.height);
      return { x: Math.max(0, Math.min(cvs.width - 1, x)), y: Math.max(0, Math.min(cvs.height - 1, y)) };
    };

    cvs.addEventListener('mousedown', e => {
      e.preventDefault();
      const p = getXY(e.clientX, e.clientY);
      this._handlePress(p.x, p.y);
    });
    window.addEventListener('mouseup', () => {
      if (this.state === STATE_RUN_APP) this.touch.touched = false;
    });

    cvs.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const p = getXY(t.clientX, t.clientY);
      this._handlePress(p.x, p.y);
    }, {passive:false});
    cvs.addEventListener('touchend', e => {
      e.preventDefault();
      if (this.state === STATE_RUN_APP) this.touch.touched = false;
    }, {passive:false});

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const scr = this.screens[this.state];
        if (scr && scr.handleTouch) {
          const k = btn.dataset.key;
          if (k === 'up') scr.handleTouch(30, 300);
          else if (k === 'sel') scr.handleTouch(120, 300);
          else if (k === 'dn') scr.handleTouch(210, 300);
        }
      });
    });
  }

  _handlePress(x, y){
    if (this.state === STATE_RUN_APP && x >= 200 && y <= 40){
      this.exitRequested = true;
      return;
    }
    if (this.keyboard.active){
      this.keyboard.handleTouch(x, y);
      return;
    }
    if (this.state === STATE_RUN_APP){
      this.touch.x = x; this.touch.y = y;
      this.touch.touched = true;
      this.touch.justPressed = true;
      return;
    }
    const scr = this.screens[this.state];
    if (scr && scr.handleTouch) {
      scr.handleTouch(x, y);
    }
  }

  async launchApp(app, codeOverride){
    let rawCode = (codeOverride != null) ? codeOverride : this.vfs.readTextFile(app.isFolder ? app.path + '/main.js' : app.path);
    if (!rawCode){ log('Error: main.js not found', 'err'); return; }

    this.exitRequested = false;
    this.touch = { x: 0, y: 0, touched: false, justPressed: false };
    this.state = STATE_RUN_APP;
    const stEl = document.getElementById('state-label');
    if (stEl) stEl.textContent = 'RUN_APP';

    this.disp.fillScreen(TFT_BLACK);
    this.disp.fillRoundRect(200, 0, 40, 30, 5, TFT_RED);
    this.disp.setTextColor(TFT_WHITE, TFT_RED);
    this.disp.setTextDatum(MC_DATUM);
    this.disp.drawString("X", 220, 15, 2);
    this.disp.setTextDatum(TL_DATUM);

    const transformedCode = universalAsyncTransform(rawCode);

    let fn;
    try {
      fn = new Function(
        'System', 'BLACK', 'WHITE', 'RED', 'GREEN', 'BLUE', 'YELLOW', 'CYAN', 'MAGENTA', 'ORANGE', 'DARKGREY',
        `"use strict"; return (async () => { ${transformedCode} })();`
      );
    } catch(err) {
      await this._showError(err.message);
      return;
    }

    log('▶ Running: ' + app.name, 'info');
    let forceExited = false;
    try {
      await fn(
        this.system,
        TFT_BLACK, TFT_WHITE, TFT_RED, TFT_GREEN, TFT_BLUE, TFT_YELLOW,
        TFT_CYAN, TFT_MAGENTA, TFT_ORANGE, TFT_DARKGREY
      );
      log('■ App finished');
    } catch(e) {
      if (e.message === 'OS_EXIT' || e.code === 'OS_EXIT'){
        log('■ App exited via X');
        forceExited = true;
      } else {
        log('✖ App error: ' + e.message, 'err');
        await this._showError(e.message);
        return;
      }
    }

    if (!forceExited){
      this.disp.fillRoundRect(200, 0, 40, 30, 5, TFT_RED);
      this.disp.setTextColor(TFT_WHITE, TFT_RED);
      this.disp.setTextDatum(MC_DATUM);
      this.disp.drawString("X", 220, 15, 2);
      this.disp.setTextDatum(TL_DATUM);
      await new Promise(res => {
        const check = setInterval(() => {
          if (this.exitRequested){ clearInterval(check); res(); }
        }, 30);
      });
    }

    this.exitRequested = false;
    this.setState(STATE_LAUNCHER);
  }

  _showError(msg){
    this.state = STATE_RUN_APP;
    const stEl = document.getElementById('state-label');
    if (stEl) stEl.textContent = 'ERROR';
    this.disp.fillScreen(TFT_RED);
    this.disp.setTextColor(TFT_WHITE, TFT_RED);
    this.disp.setTextDatum(TL_DATUM);
    this.disp.drawString('JS EXCEPTION!', 10, 10, 4);

    const lines = String(msg).split('\n');
    let y = 60;
    for (let i = 0; i < lines.length && i < 8; i++){
      this.disp.drawString(lines[i].substring(0, 38), 10, y, 2);
      y += 20;
    }

    this.disp.fillRoundRect(200, 0, 40, 30, 5, TFT_WHITE);
    this.disp.setTextColor(TFT_RED, TFT_WHITE);
    this.disp.setTextDatum(MC_DATUM);
    this.disp.drawString("X", 220, 15, 2);
    this.disp.setTextDatum(TL_DATUM);

    return new Promise(res => {
      const check = setInterval(() => {
        if (this.exitRequested){ clearInterval(check); res(); }
      }, 40);
    }).then(() => this.setState(STATE_LAUNCHER));
  }

  _bindUI(){
    // Set default Calendar Code in Editor
    document.getElementById('app-code').value = `var COLOR_BG = System.color(18, 18, 18);
var COLOR_TEXT = System.color(255, 255, 255);
var COLOR_DIM = System.color(150, 150, 150);
var COLOR_ACCENT = System.color(66, 133, 244);
var COLOR_HEADER = System.color(30, 30, 30);
var COLOR_BTN = System.color(50, 50, 50);

var monthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
];
var dayNames = ["S", "M", "T", "W", "T", "F", "S"];

var currentYear = System.getYear();
var currentMonth = System.getMonth();
var currentDay = System.getDay();

var viewedYear = currentYear;
var viewedMonth = currentMonth;
var lastTouch = false;

function getDaysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
}

function getStartDay(year, month) {
    return new Date(year, month - 1, 1).getDay();
}

function clearScreen() {
    System.fillScreen(COLOR_BG);
}

function drawHeader() {
    System.fillRect(0, 0, 240, 50, COLOR_HEADER);
    var title = monthNames[viewedMonth - 1] + " " + viewedYear;
    System.setTextColor(COLOR_TEXT, COLOR_HEADER);
    System.drawString(title, 10, 18, 2);
    
    System.fillRoundRect(120, 10, 30, 30, 5, COLOR_BTN);
    System.setTextColor(COLOR_TEXT, COLOR_BTN);
    System.drawString("<", 128, 18, 2);
    
    System.fillRoundRect(160, 10, 30, 30, 5, COLOR_BTN);
    System.setTextColor(COLOR_TEXT, COLOR_BTN);
    System.drawString(">", 168, 18, 2);
    
    var cellW = 240 / 7;
    for (var i = 0; i < 7; i++) {
        System.setTextColor(COLOR_DIM, COLOR_BG);
        System.drawString(dayNames[i], i * cellW + 12, 60, 2);
    }
}

function drawGrid() {
    System.fillRect(0, 80, 240, 240, COLOR_BG);
    var daysInMonth = getDaysInMonth(viewedYear, viewedMonth);
    var startDay = getStartDay(viewedYear, viewedMonth);
    
    var cellW = 240 / 7;
    var cellH = 35;
    var row = 0;
    var col = startDay;
    
    for (var day = 1; day <= daysInMonth; day++) {
        var x = col * cellW + 10;
        var y = 90 + (row * cellH);
        var isToday = (viewedYear === currentYear && viewedMonth === currentMonth && day === currentDay);
        
        if (isToday) {
            System.fillRoundRect(x - 6, y - 4, 26, 26, 13, COLOR_ACCENT);
            System.setTextColor(WHITE, COLOR_ACCENT);
        } else {
            System.setTextColor(COLOR_TEXT, COLOR_BG);
        }
        var dx = (day < 10) ? 4 : 0;
        System.drawString(day.toString(), x + dx, y, 2);
        
        col++;
        if (col > 6) { col = 0; row++; }
    }
    
    System.fillRoundRect(60, 290, 120, 25, 4, COLOR_BTN);
    System.setTextColor(COLOR_TEXT, COLOR_BTN);
    System.drawString("Go to Today", 75, 295, 2);
}

function updateUI() {
    drawHeader();
    drawGrid();
}

function handleTouch(x, y) {
    if (y < 50) {
        if (x >= 120 && x <= 150) {
            viewedMonth--;
            if (viewedMonth < 1) { viewedMonth = 12; viewedYear--; }
            updateUI();
        } else if (x >= 160 && x <= 190) {
            viewedMonth++;
            if (viewedMonth > 12) { viewedMonth = 1; viewedYear++; }
            updateUI();
        } else if (x < 110) {
            var yStr = System.prompt("Jump to Year (e.g. 2026):", viewedYear.toString());
            if (yStr !== "") {
                var mStr = System.prompt("Jump to Month (1-12):", viewedMonth.toString());
                if (mStr !== "") {
                    var newY = parseInt(yStr, 10);
                    var newM = parseInt(mStr, 10);
                    if (newM >= 1 && newM <= 12 && newY > 1900 && newY < 2100) {
                        viewedYear = newY;
                        viewedMonth = newM;
                        clearScreen();
                        updateUI();
                    }
                } else { clearScreen(); updateUI(); }
            } else { clearScreen(); updateUI(); }
        }
    } else if (y > 280 && x >= 50 && x <= 190) {
        if (viewedYear !== currentYear || viewedMonth !== currentMonth) {
            viewedYear = currentYear;
            viewedMonth = currentMonth;
            clearScreen();
            updateUI();
        }
    }
}

clearScreen();
updateUI();

while (true) {
    var sysDay = System.getDay();
    if (sysDay !== currentDay) {
        currentYear = System.getYear();
        currentMonth = System.getMonth();
        currentDay = sysDay;
        if (viewedYear === currentYear && viewedMonth === currentMonth) {
            updateUI();
        }
    }

    var t = System.getTouch();
    if (t.touched) {
        if (!lastTouch) {
            handleTouch(t.x, t.y);
        }
        lastTouch = true;
    } else {
        lastTouch = false;
    }
    
    System.delay(20);
}`;

    document.getElementById('btn-install').addEventListener('click', () => {
      const name = document.getElementById('app-name').value.trim() || 'My App';
      let pkg = document.getElementById('app-pkg').value.trim() || 'com.demo.app';
      const code = document.getElementById('app-code').value;
      const dir = '/local/apps/' + pkg;
      this.vfs.mkdir(dir);
      this.vfs.writeTextFile(dir + '/app.json', JSON.stringify({
        name, packageName: pkg, version: '1.0.0', api: 2, author: 'Developer', type: 'App', category: 'Productivity'
      }, null, 2));
      this.vfs.writeTextFile(dir + '/main.js', code);

      log('💾 Installed to IndexedDB: ' + name, 'ok');
    });

    document.getElementById('btn-run').addEventListener('click', () => {
      const name = document.getElementById('app-name').value.trim() || 'My App';
      const code = document.getElementById('app-code').value;
      this.launchApp({ name, path: '__tmp__', isFolder: true }, code);
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
      if (!confirm('Format IndexedDB storage?')) return;
      await this.vfs.reset();
      this.setState(STATE_LAUNCHER);
    });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.KryonOS = new Simulator();
  log('KryonOS Simulator v3.3 ready.', 'ok');
});
</script>
