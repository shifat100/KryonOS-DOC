<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KryonOS Web Emulator — Production Firmware Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b14;--panel:#161625;--panel2:#1e1e30;--border:#2c2c46;--text:#d0d0e0;--dim:#7a7a95;--accent:#00d47a;--accent2:#00b4ff;--warn:#fbbf24;--err:#f43f5e;--ok:#10b981}
body{background:radial-gradient(ellipse at top,#181828 0%,#080810 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px;gap:20px;flex-wrap:wrap}
.device-wrapper{display:flex;flex-direction:column;align-items:center;position:sticky;top:16px}
.device{background:linear-gradient(145deg,#2a2a42,#141422);border-radius:24px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid #3a3a56}
.bezel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px;min-height:22px}
.bezel-left{display:flex;align-items:center;gap:6px}
.hw-led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);display:inline-block}
.hw-label{font-size:9px;color:#666;font-weight:700;letter-spacing:1px}
.hw-exit{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;border:none;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #7f1d1d;display:none}
.hw-exit.active{display:inline-block}
.screen-frame{position:relative;background:#000;border-radius:6px;padding:5px;box-shadow:inset 0 0 25px rgba(0,0,0,.95),0 0 0 1px #38385a}
#screen{display:block;image-rendering:pixelated;background:#000;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
#overlay{position:absolute;left:5px;top:5px;image-rendering:pixelated;pointer-events:none}
.brand{text-align:center;color:#6a6a85;font-size:10px;letter-spacing:2.5px;margin-top:10px;font-weight:700}
.brand span{color:var(--accent2)}
.controls{display:flex;justify-content:space-between;margin-top:12px;gap:8px;width:100%}
.ctrl-btn{flex:1;background:linear-gradient(180deg,#3a3a56,#25253b);color:#b0b0c8;border:none;padding:9px 4px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #131324,inset 0 1px 0 rgba(255,255,255,.08);transition:all .1s}
.ctrl-btn:hover{background:linear-gradient(180deg,#484868,#2f2f47);color:#fff}
.ctrl-btn:active{transform:translateY(2px);box-shadow:0 0 0 #131324}
.panel{background:linear-gradient(145deg,#222236,#151524);border-radius:16px;padding:16px;width:600px;max-width:100%;border:1px solid #35354e;box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px;padding:10px 12px;background:#0d0d18;border:1px solid var(--border);border-radius:8px}
.status-bar .st{display:flex;flex-direction:column;gap:2px;min-width:0}
.status-bar .st-label{color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.status-bar .st-val{color:var(--accent);font-weight:700;font-family:'Menlo',monospace;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.row select,.row input{background:#0a0a14;color:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Menlo',monospace;outline:none}
.row select:focus,.row input:focus{border-color:var(--accent2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{background:transparent;border:none;color:var(--dim);padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.5px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none;flex-direction:column;gap:10px}
.tab-pane.active{display:flex}
.panel-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
textarea.code-editor{width:100%;height:280px;background:#07070f;color:#7ee787;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'Menlo','Monaco','Courier New',monospace;font-size:12px;line-height:1.55;resize:vertical;outline:none;tab-size:4;white-space:pre;overflow:auto}
textarea.code-editor:focus{border-color:var(--accent)}
.btn{background:linear-gradient(180deg,var(--accent),#00a35e);color:#000;border:none;padding:8px 14px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #006b3d;transition:all .1s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sec{background:linear-gradient(180deg,#3a3a56,#25253b);color:#ccc;box-shadow:0 2px 0 #131324}
.btn.danger{background:linear-gradient(180deg,#f43f5e,#be123c);color:#fff;box-shadow:0 2px 0 #881337}
.btn.blue{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 2px 0 #1e3a8a}
#console{background:#05050c;color:#6ee7b7;font-family:'Menlo',monospace;font-size:11px;padding:10px;border-radius:8px;height:220px;overflow-y:auto;border:1px solid var(--border);line-height:1.5}
#console .err{color:#ff6b6b}
#console .warn{color:#fbbf24}
#console .ok{color:#4ade80}
#console .info{color:#38bdf8}
#console .dim{color:#6a6a85}
#console .sys{color:#a78bfa;font-weight:600}
.app-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;font-size:11px}
.app-row strong{color:var(--accent2);font-size:11px}
.app-row .meta{color:var(--dim);font-family:monospace;font-size:10px}
.app-row .actions{display:flex;gap:6px}
.app-row .actions button{padding:4px 10px;font-size:10px}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:20px}
</style>
</head>
<body>

<div class="device-wrapper">
  <div class="device">
    <div class="bezel-top">
      <div class="bezel-left">
        <span class="hw-led" id="led"></span>
        <span class="hw-label">KRYON·CORE</span>

    <div class="controls">

</div>

<div class="panel">
  <div class="status-bar">
    <div class="st"><span class="st-label">State</span><span class="st-val" id="st-state">LAUNCHER</span></div>
    <div class="st"><span class="st-label">WiFi</span><span class="st-val" id="st-wifi">ONLINE</span></div>

        <option value="esp32-s3-devkitc-1-n16r8">ESP32-S3 DevKitC-1 (240×320)</option>
        <option value="m5stack-cardputer">M5Stack Cardputer (240×135)</option>
        <option value="lilygo-t-hmi">LilyGO T-HMI (240×320)</option>

<script>
'use strict';

/* ─── 1. CONSTANTS ────────────────────────────────────────────── */
const TFT_BLACK=0x0000,TFT_WHITE=0xFFFF,TFT_RED=0xF800,TFT_GREEN=0x07E0;
const TFT_BLUE=0x001F,TFT_YELLOW=0xFFE0,TFT_CYAN=0x07FF,TFT_MAGENTA=0xF81F;
const TFT_ORANGE=0xFD20,TFT_DARKGREY=0x7BEF,TFT_LIGHTGREY=0xC618;
const TFT_PURPLE=0x780F,TFT_NAVY=0x000F,TFT_GOLD=0xFEA0;
const KRYONOS_VERSION="2.0.0";
const KRYONOS_API_LEVEL=2;
const S={LAUNCHER:0,SETTINGS:1,RUN_APP:2,INSTALLER:3,CALIBRATOR:4,WEB_APP:5,
  SETTINGS_WIFI:6,SETTINGS_ABOUT:7,SETTINGS_APPS:8,SETTINGS_TIME:9,
  SETTINGS_TIME_MANUAL:10,UPDATER_BOOT:11,UPDATER_MANUAL:12,APP_STORE:13,
  HELP_CENTER:14,SETTINGS_WIFI_SAVED:15,KRYON_CLOUD:16,SETTINGS_PERMISSIONS:17};

/* ─── 2. UTILITIES ────────────────────────────────────────────── */
const $=id=>document.getElementById(id);
const consoleEl=$('console');
function log(msg,cls){
  const d=document.createElement('div');
  if(cls)d.className=cls;
  d.textContent=`[${new Date().toLocaleTimeString('en-GB',{hour12:false})}] ${msg}`;
  consoleEl.appendChild(d);
  while(consoleEl.children.length>500)consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop=consoleEl.scrollHeight;
}
const escapeRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms|0)));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ─── 3. AUDIO PWM ────────────────────────────────────────────── */
class AudioPWM{
  constructor(){this.ctx=null;this.oscs=new Map();}
  _ensure(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
  setTone(pin,freq,dur=0){try{this._ensure();if(!this.ctx)return;this.stopTone(pin);if(freq<=0)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='square';o.frequency.value=freq;g.gain.value=0.05;
    o.connect(g);g.connect(this.ctx.destination);o.start();
    this.oscs.set(pin,{osc:o,gain:g});if(dur>0)setTimeout(()=>this.stopTone(pin),dur);
  }catch(e){}}
  stopTone(pin){const it=this.oscs.get(pin);if(it){try{it.gain.gain.value=0;it.osc.stop();it.osc.disconnect();}catch(e){}this.oscs.delete(pin);}}
  reset(){for(const p of [...this.oscs.keys()])this.stopTone(p);}
}
const audioHW=new AudioPWM();

/* ─── 4. VFS (IndexedDB-backed) ───────────────────────────────── */
class VFS{
  constructor(sim){this.sim=sim;this.dbName='KryonOS_VFS_v7';this.store='files';this.db=null;this.cache=new Map();}
  async init(){
    return new Promise(resolve=>{
      try{
        const req=indexedDB.open(this.dbName,1);
        req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(this.store))db.createObjectStore(this.store,{keyPath:'path'});};
        req.onsuccess=async e=>{this.db=e.target.result;await this._load();if(this.cache.size===0)await this.seedDefaults();resolve();};
        req.onerror=()=>{this.seedDefaults().then(resolve);};
      }catch(e){this.seedDefaults().then(resolve);}
    });
  }
  _load(){return new Promise(resolve=>{
    if(!this.db)return resolve();
    const tx=this.db.transaction(this.store,'readonly');
    const req=tx.objectStore(this.store).getAll();
    req.onsuccess=()=>{this.cache.clear();(req.result||[]).forEach(it=>this.cache.set(it.path,it));resolve();};
    req.onerror=()=>resolve();
  });}
  _norm(p){let c=String(p||'').replace(/\/+/g,'/');if(c.length>1&&c.endsWith('/'))c=c.slice(0,-1);if(!c.startsWith('/'))c='/'+c;return c;}
  async seedDefaults(){
    for(const d of ['/local','/local/apps','/local/system','/local/tmp_download','/sd','/sd/apps','/sd/system'])
      this._put(d,null,true,false);
    this._installDemo('com.kryon.calc',{name:'Calculator',packageName:'com.kryon.calc',version:'1.0.0',api:1,author:'KryonTeam',category:'Utility',type:'App',description:'Standard utility calculator.',permissions:[]},
`// KryonOS Calculator Demo
System.fillScreen(System.color(20,20,30));
System.setTextColor(WHITE, System.color(20,20,30));
System.drawString("Calculator", 55, 30, 4);
System.fillRoundRect(20, 100, 200, 40, 6, BLUE);
System.setTextColor(WHITE, BLUE);
System.drawString("Tap to beep", 70, 112, 2);
while (true) {
  var t = System.getTouch();
  if (t.touched) {
    PWM.setTone(18, 1400, 100);
    System.notify("Calc", "Button pressed", "info", 1500);
  }
  System.delay(40);
}`);
    this._installDemo('com.kryon.paint',{name:'Canvas Paint',packageName:'com.kryon.paint',version:'1.0.0',api:1,author:'KryonTeam',category:'Utility',type:'App',description:'Finger drawing demo.',permissions:[]},
`// KryonOS Paint Demo
System.fillScreen(BLACK);
System.setTextColor(YELLOW, BLACK);
System.drawString("Draw with finger", 30, 10, 2);
while (true) {
  var t = System.getTouch();
  if (t.touched && t.y > 40) {
    System.fillCircle(t.x, t.y, 4, CYAN);
  }
  System.delay(10);
}`);
    await this._persistAll();
  }
  _installDemo(pkg,meta,code){
    const dir='/local/apps/'+pkg;
    this._put(dir,null,true,false);
    this._put(dir+'/app.json',JSON.stringify(meta,null,2),false,false);
    this._put(dir+'/main.js',code,false,false);
  }
  _persistAll(){if(!this.db)return Promise.resolve();return new Promise(resolve=>{
    const tx=this.db.transaction(this.store,'readwrite');const store=tx.objectStore(this.store);
    for(const it of this.cache.values())store.put(it);
    tx.oncomplete=()=>resolve();tx.onerror=()=>resolve();
  });}
  _put(path,content,isDir=false,notify=true){
    const clean=this._norm(path);
    const rec={path:clean,content:isDir?null:String(content!=null?content:''),isDir,size:isDir?0:(content?String(content).length:0),modified:Date.now()};
    this.cache.set(clean,rec);
    if(this.db){try{const tx=this.db.transaction(this.store,'readwrite');tx.objectStore(this.store).put(rec);}catch(e){}}
    if(notify&&this.sim)this.sim.onStorageChanged();
    return true;
  }
  exists(p){return this.cache.has(this._norm(p));}
  isDir(p){const it=this.cache.get(this._norm(p));return it?it.isDir:false;}
  isFile(p){const it=this.cache.get(this._norm(p));return it?!it.isDir:false;}
  read(p){const it=this.cache.get(this._norm(p));return (it&&!it.isDir)?it.content:'';}
  write(p,c){if(!p)return false;this._mkparent(p);return this._put(p,c,false,true);}
  append(p,c){return this.write(p,this.read(p)+String(c));}
  mkdir(p){const clean=this._norm(p);if(this.cache.has(clean))return true;this._mkparent(clean);return this._put(clean,null,true,true);}
  remove(p){const clean=this._norm(p);this.cache.delete(clean);
    for(const k of [...this.cache.keys()])if(k.startsWith(clean+'/'))this.cache.delete(k);
    if(this.db){try{const tx=this.db.transaction(this.store,'readwrite');const store=tx.objectStore(this.store);store.delete(clean);for(const k of [...this.cache.keys()])if(k.startsWith(clean+'/'))store.delete(k);}catch(e){}}
    if(this.sim)this.sim.onStorageChanged();
    return true;
  }
  rename(from,to){const f=this._norm(from),t=this._norm(to);const it=this.cache.get(f);if(!it)return false;const content=it.content,isDir=it.isDir;this.remove(f);return this._put(t,content,isDir,true);}
  listDir(p){const clean=this._norm(p);const pre=clean.endsWith('/')?clean:clean+'/';const out=[];
    for(const k of this.cache.keys()){if(k.startsWith(pre)&&k!==clean){const sub=k.substring(pre.length);if(!sub.includes('/'))out.push(k);}}return out;}
  listDirFull(p){const clean=this._norm(p);const pre=clean.endsWith('/')?clean:clean+'/';const out=[];
    for(const [k,it] of this.cache.entries()){if(k.startsWith(pre)&&k!==clean){const sub=k.substring(pre.length);if(!sub.includes('/'))out.push({name:sub,path:k,isDir:it.isDir,size:it.size});}}return out;}
  size(p){const it=this.cache.get(this._norm(p));return it?it.size:0;}
  totalSpace(){return 16*1024*1024;}
  usedSpace(){let t=0;for(const it of this.cache.values())t+=it.size;return t;}
  freeSpace(){return this.totalSpace()-this.usedSpace();}
  _mkparent(p){const parts=this._norm(p).split('/').filter(Boolean);let cur='';for(let i=0;i<parts.length-1;i++){cur+='/'+parts[i];if(!this.cache.has(cur))this._put(cur,null,true,false);}}
  async reset(){if(this.db){const tx=this.db.transaction(this.store,'readwrite');tx.objectStore(this.store).clear();}this.cache.clear();await this.seedDefaults();log('Flash formatted, defaults restored.','warn');}
  md5(p){const content=this.read(p);let h=0x811c9dc5;for(let i=0;i<content.length;i++){h^=content.charCodeAt(i);h=(h*0x01000193)>>>0;}const seed=h.toString(16).padStart(8,'0');return (seed+seed+seed+seed).slice(0,32);}
}

/* ─── 5. TFT DISPLAY ──────────────────────────────────────────── */
class TFTDisplay{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d',{alpha:false});
    this.ctx.imageSmoothingEnabled=false;
    this.W=canvas.width;this.H=canvas.height;
    this.fg='#fff';this.bg=null;this.size=1;this.datum=0;
    this.activeSprite=null;this.clear();
  }
  clear(){this.ctx.fillStyle='#000';this.ctx.fillRect(0,0,this.W,this.H);}
  static c565(c){const r=((c>>11)&0x1F)*255/31|0,g=((c>>5)&0x3F)*255/63|0,b=(c&0x1F)*255/31|0;return `rgb(${r},${g},${b})`;}
  _t(){return this.activeSprite?this.activeSprite.ctx:this.ctx;}
  _w(){return this.activeSprite?this.activeSprite.canvas.width:this.W;}
  _h(){return this.activeSprite?this.activeSprite.canvas.height:this.H;}
  fillScreen(c){const x=this._t();x.fillStyle=TFTDisplay.c565(c);x.fillRect(0,0,this._w(),this._h());}
  fillRect(x,y,w,h,c){if(w<=0||h<=0)return;const t=this._t();t.fillStyle=TFTDisplay.c565(c);t.fillRect(x,y,w,h);}
  drawRect(x,y,w,h,c){const t=this._t();t.strokeStyle=TFTDisplay.c565(c);t.lineWidth=1;t.strokeRect(x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1));}
  drawLine(x0,y0,x1,y1,c){const t=this._t();t.strokeStyle=TFTDisplay.c565(c);t.lineWidth=1;t.beginPath();t.moveTo(x0+.5,y0+.5);t.lineTo(x1+.5,y1+.5);t.stroke();}
  drawFastHLine(x,y,w,c){this.drawLine(x,y,x+w-1,y,c);}

/* ─── 7. NOTIFICATION OVERLAY ─────────────────────────────────── */
class NotificationOverlay{
  constructor(sim){
    this.sim=sim;this.queue=[];this.nextId=1;
    this.ANIM=180;this.REST=8;this.HIDDEN=-44;
    this.CX=8;this.CW=224;this.CH=42;this.CR=6;
  }
  post(title,message,icon='info',dur=3000){
    const id=this.nextId++;
    let t='info';const s=String(icon).toLowerCase();
    if(s.includes('warn'))t='warn';
    else if(s.includes('err')||s.includes('danger'))t='error';
    else if(s.includes('succ')||s.includes('ok'))t='success';
    this.queue.push({id,title:String(title||'Notification').substring(0,24),message:String(message||'').substring(0,48),iconType:t,durationMs:clamp(dur||3000,500,15000),state:'SLIDE_IN',currentY:this.HIDDEN,animStart:performance.now(),displayStart:0});
    log(`[Notify #${id}] ${title}: ${message}`,'ok');
    return id;
  }
  dismiss(id){
    if(!this.queue.length)return false;
    const i=this.queue.findIndex(n=>n.id===id);
    if(i===-1)return false;
    if(i===0){if(this.queue[0].state!=='SLIDE_OUT'){this.queue[0].state='SLIDE_OUT';this.queue[0].animStart=performance.now();}}
    else this.queue.splice(i,1);
    return true;
  }
  clearAll(){this.queue=[];this.render();}
  render(){
    const oc=this.sim.overlayCtx;
    oc.clearRect(0,0,this.sim.overlayCanvas.width,this.sim.overlayCanvas.height);
    if(!this.queue.length)return;
    const it=this.queue[0];const now=performance.now();let y=it.currentY;
    if(it.state==='SLIDE_IN'){
      const e=now-it.animStart;
      if(e>=this.ANIM){y=this.REST;it.state='DISPLAYING';it.displayStart=now;}
      else{const t=e/this.ANIM,ea=1-Math.pow(1-t,3);y=this.HIDDEN+(this.REST-this.HIDDEN)*ea;}
    }else if(it.state==='DISPLAYING'){
      y=this.REST;
      if(now-it.displayStart>=it.durationMs){it.state='SLIDE_OUT';it.animStart=now;}
    }else if(it.state==='SLIDE_OUT'){
      const e=now-it.animStart;
      if(e>=this.ANIM){
        this.queue.shift();
        if(this.queue.length){this.queue[0].state='SLIDE_IN';this.queue[0].currentY=this.HIDDEN;this.queue[0].animStart=performance.now();}
        return;
      }
      const t=e/this.ANIM,ea=t*t*t;y=this.REST+(this.HIDDEN-this.REST)*ea;
    }
    it.currentY=y;
    const ctx=oc;
    let border='#00f0ff',badge='#007acc',text='i';
    if(it.iconType==='success'){border='#00e676';badge='#00e676';text='✓';}
    else if(it.iconType==='warn'){border='#ffb300';badge='#ffb300';text='!';}
    else if(it.iconType==='error'){border='#ff3d00';badge='#ff3d00';text='✕';}
    const rx=this.CX,r=this.CR,y0=Math.round(y);
    ctx.fillStyle='#0d1120';ctx.strokeStyle=border;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(rx+r,y0);ctx.arcTo(rx+this.CW,y0,rx+this.CW,y0+this.CH,r);ctx.arcTo(rx+this.CW,y0+this.CH,rx,y0+this.CH,r);ctx.arcTo(rx,y0+this.CH,rx,y0,r);ctx.arcTo(rx,y0,rx+this.CW,y0,r);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(rx+16,y0+21,10,0,Math.PI*2);ctx.fillStyle=badge;ctx.fill();
    ctx.font='bold 11px sans-serif';ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,rx+16,y0+21);
    ctx.font='bold 12px "Courier New",monospace';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(it.title,rx+34,y0+6);
    ctx.font='10px "Courier New",monospace';ctx.fillStyle='#b0b8c4';ctx.fillText(it.message,rx+34,y0+24);
  }
}

/* ─── 8. ON-SCREEN KEYBOARD ───────────────────────────────────── */
class OnScreenKeyboard{
  constructor(sim){
    this.sim=sim;this.active=false;this.text='';this.caps=false;this.resolve=null;this.prompt='';this.maxLen=30;
    // Row 3 col 0 fixed: no duplicate backslash
    this.keyset=[
      [['1','!'],['2','@'],['3','#'],['4','$'],['5','%'],['6','^'],['7','&'],['8','*'],['9','('],['0',')'],['-','_'],['=','+']],
      [['q','Q'],['w','W'],['e','E'],['r','R'],['t','T'],['y','Y'],['u','U'],['i','I'],['o','O'],['p','P'],['[','{'],[']','}']],
      [['a','A'],['s','S'],['d','D'],['f','F'],['g','G'],['h','H'],['j','J'],['k','K'],['l','L'],[';',':'],["'",'"'],['\\','|']],
      [['`','~'],['z','Z'],['x','X'],['c','C'],['v','V'],['b','B'],['n','N'],['m','M'],[',','<'],['.','>'],['/','?'],[' ',' ']]
    ];
  }
  show(prompt,initial='',maxLen=30){
    this.sim.touch.touched=false;this.sim.touch.justPressed=false;
    this.text=String(initial!=null?initial:'');this.caps=false;this.active=true;
    this.prompt=prompt||'Input';this.maxLen=maxLen;this._draw();
    return new Promise(res=>{this.resolve=res;});
  }
  _draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.setTextDatum(0);d.setTextColor(TFT_GREEN,TFT_BLACK);
    d.drawString(this.prompt.substring(0,26),5,10,2);
    d.drawRect(5,30,230,30,TFT_GREEN);
    d.setTextColor(TFT_WHITE,TFT_BLACK);
    const disp=this.text.length>18?this.text.slice(-18):this.text;
    d.drawString(disp+'_',10,38,2);
    const btnW=48;
    const btns=['OK',this.caps?'abc':'ABC','DEL','SPACE','ESC'];
    for(let i=0;i<5;i++){
      d.drawRect(i*btnW,70,btnW,30,TFT_GREEN);
      d.setTextColor(TFT_WHITE,TFT_BLACK);d.setTextDatum(4);
      d.drawString(btns[i],i*btnW+btnW/2,85,2);
    }
    const kw=12,kh=4;const keyW=240/kw,keyH=(320-110)/kh;
    for(let y=0;y<kh;y++)for(let x=0;x<kw;x++){
      const px=x*keyW,py=110+y*keyH;
      d.drawRect(px,py,keyW,keyH,TFT_DARKGREY);
      const c=this.caps?this.keyset[y][x][1]:this.keyset[y][x][0];
      d.setTextColor(TFT_WHITE,TFT_BLACK);d.setTextDatum(4);
      d.drawString(c,px+keyW/2,py+keyH/2,2);
    }
  }

    if(y>=70&&y<=100){
      const idx=Math.floor(x/48);
      if(idx===0)this._finish(this.text);
      else if(idx===1){this.caps=!this.caps;this._draw();}
      else if(idx===2){if(this.text.length>0)this.text=this.text.slice(0,-1);this._draw();}
      else if(idx===3){if(this.text.length<this.maxLen)this.text+=' ';this._draw();}
      else this._finish('');

    }
    if(y>=110){
      const kw=12,kh=4;const keyW=240/kw,keyH=(320-110)/kh;
      const kx=Math.floor(x/keyW),ky=Math.floor((y-110)/keyH);
      if(kx>=0&&kx<kw&&ky>=0&&ky<kh){

        if(this.text.length<this.maxLen)this.text+=c;
        this._draw();
      }
    }
  }
  _finish(val){
    if(!this.active)return;
    this.active=false;const r=this.resolve;this.resolve=null;
    if(r)r(val);
  }
}

/* ─── 9. TRANSPILER (token-based, string/comment safe) ────────── */
function shieldTokens(src){
  const tokens=[];
  let i=0,out='';
  while(i<src.length){
    const c=src[i];
    if(c==='"'||c==="'"||c==='`'){
      const q=c;let j=i+1;
      while(j<src.length&&src[j]!==q){if(src[j]==='\\')j++;j++;}
      tokens.push(src.substring(i,Math.min(j+1,src.length)));
      out+='\x00S'+(tokens.length-1)+'\x00';
      i=j+1;
    }else if(c==='/'&&src[i+1]==='/'){
      let end=src.indexOf('\n',i);if(end===-1)end=src.length;
      tokens.push(src.substring(i,end));out+='\x00C'+(tokens.length-1)+'\x00';i=end;
    }else if(c==='/'&&src[i+1]==='*'){
      let end=src.indexOf('*/',i+2);end=end===-1?src.length:end+2;
      tokens.push(src.substring(i,end));out+='\x00C'+(tokens.length-1)+'\x00';i=end;
    }else{out+=c;i++;}
  }
  return {code:out,tokens};

function transpile(src){
  // Reject Duktape-incompatible syntax up-front
  if(/\basync\s+function\b/.test(src)
    || /\basync\s*\(/.test(src)
    || /\basync\s+[A-Za-z_$][\w$]*\s*=>/.test(src)
    || /(^|[^\w$])await\s/.test(src)
    || /\bnew\s+Promise\b/.test(src)
    || /\bPromise\s*\.\s*(?:resolve|reject|all|race)\b/.test(src)){
    throw new Error('Duktape 2.7 runtime: async/await/Promise not supported. Use System.delay() (blocking on device).');
  }
  const needsAsync=/\bSystem\s*\.\s*(?:delay|delayMicroseconds|prompt)\s*\(/.test(src);
  if(!needsAsync)return src;

  const {code:shielded,tokens}=shieldTokens(src);
  let code=shielded;

  // 1. Convert function declarations/expressions to async
  code=code.replace(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g,'async function $1(');
  code=code.replace(/\bfunction\s*\(/g,'async function (');

  // 2. Convert plain arrow functions
  code=code.replace(/(\([^()]*\)|[A-Za-z_$][\w$]*)\s*=>\s*\{/g,'async $1 => {');

  // 3. Convert object method shorthand (skip keywords)
  const KW=new Set(['if','for','while','switch','catch','return','typeof','new','delete','do','else','try','finally','case','default','with','throw','void','function']);
  code=code.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*\(([^()]*)\)\s*\{/g,(m,pre,name,params)=>{
    if(KW.has(name))return m;
    return `${pre}async ${name}(${params}) {`;
  });

  // 4. Collect declared async function names
  const declared=new Set();
  const dr=/\basync\s+function\s+([A-Za-z_$][\w$]*)\s*\(/g;
  let m;while((m=dr.exec(code))!==null)declared.add(m[1]);

  // 5. Await System.delay/delayMicroseconds/prompt
  code=code.replace(/(^|[^.\w$])(System\s*\.\s*(?:delay|delayMicroseconds|prompt))\s*\(/g,'$1await $2(');

  // 6. Await calls to user-declared async functions — skip declarations
  for(const fn of declared){
    const re=new RegExp(`(^|[^\\w$.])(${escapeRegex(fn)})\\s*\\(`,'g');
    code=code.replace(re,(full,pre,name,offset)=>{
      const before=code.substring(0,offset+pre.length);
      if(/\b(?:async\s+)?function\s+$/.test(before))return full; // declaration
      if(/\b(?:typeof|new)\s+$/.test(before))return full;        // not a call
      if(/\bawait\s+$/.test(before))return full;                 // already awaited
      return pre+'await '+name+'(';
    });
  }

  return restoreTokens(code,tokens);
}

    // Logging

function buildFS(sim){
  const SYS='/local/system';
  const vfs=sim.vfs;
  const grants=sim.permissions;
  let sandbox='';
  function setSandbox(r){sandbox=r?(r.endsWith('/')?r:r+'/'):'';}
  function resolve(p){
    if(!p)return '';
    let s=String(p);
    if(!s.startsWith('/')&&!s.startsWith('local/')&&!s.startsWith('sd/'))s=sandbox+s;
    return s.replace(/\/+/g,'/');
  }
  function isSys(p){
    if(!p)return true;
    if(p.includes('..'))return true;
    if(p.startsWith(SYS))return true;
    if(p.endsWith('/app_permissions.json'))return true;
    if(p.endsWith('/wifi_credentials.enc'))return true;
    return false;
  }
  function allowed(p){
    if(!sandbox)return true;
    const r=resolve(p);
    if(isSys(r))return false;
    if(r.startsWith(sandbox))return true;
    const pkg=sim.currentPkg||'';
    if(grants.has(pkg+':storage'))return true;
    log(`[FS] Denied: "${r}" requires storage permission (would prompt on device)`,'warn');
    return false;
  }
  return {
    _setSandboxRoot:setSandbox,
    readTextFile:p=>allowed(p)?vfs.read(resolve(p)):null,
    writeTextFile:(p,c)=>allowed(p)?vfs.write(resolve(p),c):false,
    appendTextFile:(p,c)=>allowed(p)?vfs.append(resolve(p),c):false,
    deleteFile:p=>allowed(p)?vfs.remove(resolve(p)):false,
    renameFile:(a,b)=>allowed(a)&&allowed(b)?vfs.rename(resolve(a),resolve(b)):false,
    exists:p=>allowed(p)?vfs.exists(resolve(p)):false,
    listDir:p=>allowed(p)?vfs.listDir(resolve(p)):[],
    mkdir:p=>allowed(p)?vfs.mkdir(resolve(p)):false,
    rmdir:p=>allowed(p)?vfs.remove(resolve(p)):false,
    isDirectory:p=>allowed(p)?vfs.isDir(resolve(p)):false,
    isFile:p=>allowed(p)?vfs.isFile(resolve(p)):false,
    getFileSize:p=>allowed(p)?vfs.size(resolve(p)):0,
    getTotalSpace:()=>vfs.totalSpace(),
    getUsedSpace:()=>vfs.usedSpace(),
    getFreeSpace:()=>vfs.freeSpace(),
    getFileMD5:p=>allowed(p)?vfs.md5(resolve(p)):'',
    mountSD:()=>{log('[FS] mountSD emulated','dim');return true;},
    unmountSD:()=>{log('[FS] unmountSD emulated','dim');}
  };
}

class LauncherScreen{
  constructor(sim){this.sim=sim;this.sel=1;this.scroll=0;this.apps=[];}
  scan(){
    this.apps=[];
    for(const d of ['/local/apps','/sd/apps']){
      if(!this.sim.vfs.isDir(d))continue;
      for(const e of this.sim.vfs.listDirFull(d)){
        if(e.isDir){
          const jp=e.path+'/app.json';
          if(this.sim.vfs.exists(jp)){
            try{
              const o=JSON.parse(this.sim.vfs.read(jp));
              const n=o.name||e.name;
              if(!this.apps.find(a=>a.name===n))
                this.apps.push({name:n,path:e.path,pkg:o.packageName||e.name,meta:o});
            }catch(err){}
          }
        }else if(e.name.endsWith('.js')){
          if(!this.apps.find(a=>a.name===e.name))
            this.apps.push({name:e.name,path:e.path,pkg:e.name,meta:null,isLegacy:true});
        }
      }
    }
  }
  total(){return this.apps.length+7;}
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);
    d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);
    d.setTextDatum(4);
    d.drawString('KryonOS Home',120,21,2);
    d.fillRect(10,45,220,230,TFT_BLACK);
    const total=this.total();const pp=7;
    for(let i=0;i<pp;i++){
      const idx=this.scroll+i;if(idx>=total)break;
      const y=45+i*30;
      let name='',hdr=false;
      if(idx===0){name='[ SYSTEM ]';hdr=true;}
      else if(idx===1)name='App Store';
      else if(idx===2)name='App Installer';
      else if(idx===3)name='Kryon Cloud';
      else if(idx===4)name='Settings';
      else if(idx===5)name='Help Center';
      else if(idx===6){name='[ APPS ]';hdr=true;}
      else name=this.apps[idx-7].name;
      if(hdr){
        d.setTextColor(TFT_DARKGREY,TFT_BLACK);d.setTextDatum(3);
        d.drawString(name,15,y+12,2);
      }else if(idx===this.sel){
        d.fillRect(10,y,220,25,TFT_WHITE);
        d.setTextColor(TFT_BLACK,TFT_WHITE);d.setTextDatum(3);
        d.drawString('> '+name,15,y+12,2);
      }else{
        d.setTextColor(TFT_WHITE,TFT_BLACK);d.setTextDatum(3);
        d.drawString('  '+name,15,y+12,2);
      }
    }
    if(total>pp){
      const sbH=Math.max(16,(230*pp)/total);
      const sbY=45+(this.scroll*(230-sbH))/Math.max(1,total-pp);
      d.fillRect(231,45,3,230,TFT_DARKGREY);
      d.fillRect(231,sbY,3,sbH,TFT_WHITE);
    }
    d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);d.setTextDatum(4);
    d.drawString('UP',30,300,2);d.drawString('|',60,300,2);
    d.drawString('SEL',120,300,2);d.drawString('|',180,300,2);
    d.drawString('DN',210,300,2);
  }
  handleTouch(x,y){
    const total=this.total();const pp=7;
    if(y>=45&&y<=270){
      const c=this.scroll+Math.floor((y-45)/30);
      if(c<total&&c!==0&&c!==6){this.sel=c;this.draw();this.execute();}
      return;
    }
    if(y>=285){
      if(x<60){
        if(this.sel>1){
          this.sel--;
          if(this.sel===6)this.sel--;
          if(this.sel<this.scroll)this.scroll=this.sel;
          if(this.sel===1)this.scroll=0;
          this.draw();
        }
      }else if(x>60&&x<180)this.execute();
      else if(x>180){
        if(this.sel<total-1){
          this.sel++;
          if(this.sel===6)this.sel++;
          if(this.sel>=this.scroll+pp)this.scroll=this.sel-pp+1;
          this.draw();
        }
      }
    }
  }
  execute(){
    const s=this.sel;
    if(s===1)this.sim.setState(S.APP_STORE);
    else if(s===2)this.sim.setState(S.INSTALLER);
    else if(s===3)this.sim.setState(S.KRYON_CLOUD);
    else if(s===4)this.sim.setState(S.SETTINGS);
    else if(s===5)this.sim.setState(S.HELP_CENTER);
    else if(s>6&&this.apps[s-7])this.sim.launchApp(this.apps[s-7]);
  }
}

class AppStoreScreen{
  constructor(sim){
    this.sim=sim;this.state=0;
    this.INDEX='https://raw.githubusercontent.com/Haris16-code/KryonOS-AppStore/refs/heads/main/index.json';
    this.cats=[];this.apps=[];this.catName='';this.selCat=0;this.selApp=0;this.scroll=0;this.dialog='';this.loading=false;
  }
  async fetchCats(){
    this.loading=true;this.dialog='Fetching App Store...';this.draw();
    try{
      const res=await fetch(this.INDEX);const data=await res.json();
      this.cats=[{name:'[ Check For Apps Update ]',url:'UPDATE_ACTION'}];
      if(data&&data.categories)for(const [name,url] of Object.entries(data.categories))
        this.cats.push({name,url:String(url)});
      this.loading=false;this.draw();
    }catch(e){this.dialog='Store Offline: '+e.message;this.state=3;this.loading=false;this.draw();}
  }
  async fetchCatApps(url){
    if(url==='UPDATE_ACTION'){this.dialog='All apps are up to date (emulator).';this.state=3;this.draw();return;}
    this.loading=true;this.dialog='Loading '+this.catName+'...';this.draw();
    try{
      const res=await fetch(url);const data=await res.json();this.apps=[];
      if(data&&data.apps)for(const [id,info] of Object.entries(data.apps)){
        this.apps.push({
          id,name:id.charAt(0).toUpperCase()+id.slice(1),
          metaUrl:info.meta,appUrl:info.app,
          metaSha256:info.meta_sha256||info.metaSha256||'',
          appSha256:info.app_sha256||info.appSha256||'',
          author:'?',version:'1.0.0',description:'Tap to load details'
        });
      }
      this.state=1;this.selApp=0;this.scroll=0;this.loading=false;this.draw();
    }catch(e){this.dialog='Failed: '+e.message;this.state=3;this.loading=false;this.draw();}
  }
  async fetchDetails(app){
    this.loading=true;this.dialog='Loading details...';this.draw();
    try{
      const res=await fetch(app.metaUrl);const meta=await res.json();
      Object.assign(app,{name:meta.name||app.name,author:meta.author||'Unknown',version:meta.version||'1.0.0',description:meta.description||'No description',packageName:meta.packageName||app.id,permissions:meta.permissions||[],meta});
    }catch(e){}
    this.loading=false;this.state=2;this.draw();
  }
  async installApp(app){
    this.loading=true;this.dialog='Downloading '+app.name+'...';this.draw();
    try{
      const metaRes=await fetch(app.metaUrl);const metaText=await metaRes.text();
      if(app.metaSha256){
        const c=await this.sim.env.Crypto.sha256(metaText);
        if(c.toLowerCase()!==app.metaSha256.toLowerCase())throw new Error('Meta SHA-256 mismatch');
      }else log('[AppStore] WARNING: no meta_sha256 in index','warn');
      const meta=JSON.parse(metaText);
      const codeRes=await fetch(app.appUrl);const codeText=await codeRes.text();
      if(app.appSha256){
        const c=await this.sim.env.Crypto.sha256(codeText);
        if(c.toLowerCase()!==app.appSha256.toLowerCase())throw new Error('App SHA-256 mismatch');
      }else log('[AppStore] WARNING: no app_sha256 in index','warn');
      const reqApi=meta.api||1;
      if(reqApi>KRYONOS_API_LEVEL)throw new Error(`App requires API ${reqApi}, this OS is API ${KRYONOS_API_LEVEL}`);
      const pkg=meta.packageName||app.id;
      const dir='/local/apps/'+pkg;
      this.sim.vfs.mkdir(dir);
      this.sim.vfs.write(dir+'/app.json',JSON.stringify(meta,null,2));
      this.sim.vfs.write(dir+'/main.js',codeText);
      log(`[AppStore] Installed ${meta.name} (${pkg}) v${meta.version}`,'ok');
      this.dialog=`${meta.name}\nv${meta.version}\n\nInstalled successfully!`;
      this.state=3;
      this.sim.launcher.scan();
      this.sim.refreshAppList();
    }catch(e){
      log('[AppStore] Install failed: '+e.message,'err');
      this.dialog='Install error:\n'+e.message;
      this.state=3;
    }
    this.loading=false;this.draw();
  }
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);
    d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.setTextDatum(4);
    let h='App Store';
    if(this.state===1)h=this.catName;
    else if(this.state===2)h='App Details';
    else if(this.state===3)h='Notice';
    d.drawString(h,120,21,2);
    d.fillRect(10,45,220,230,TFT_BLACK);
    if(this.loading){d.setTextColor(TFT_YELLOW,TFT_BLACK);d.setTextDatum(4);d.drawString(this.dialog,120,160,2);return;}

  handleTouch(x,y){

    if(this.state===2){
      if(y>=230&&y<=260){
        if(x>=25&&x<=105)this.installApp(this.apps[this.selApp]);
        else if(x>=135&&x<=215){this.state=1;this.draw();}
      }
      return;
    }
    if(y>=45&&y<=270){
      const list=this.state===0?this.cats:this.apps;
      const c=this.scroll+Math.floor((y-45)/30);
      if(c<list.length){
        if(this.state===0){this.selCat=c;this.catName=list[c].name;this.fetchCatApps(list[c].url);}
        else{this.selApp=c;this.fetchDetails(list[c]);}
      }
      return;
    }
    if(y>=285){
      if(x<70){if(this.state===1){this.state=0;this.draw();}else this.sim.setState(S.LAUNCHER);}
      else if(x>=70&&x<130){
        if(this.state===0&&this.selCat>0){this.selCat--;if(this.selCat<this.scroll)this.scroll=this.selCat;this.draw();}
        else if(this.state===1&&this.selApp>0){this.selApp--;if(this.selApp<this.scroll)this.scroll=this.selApp;this.draw();}
      }else if(x>=130&&x<200){
        if(this.state===0){this.catName=this.cats[this.selCat].name;this.fetchCatApps(this.cats[this.selCat].url);}
        else if(this.state===1)this.fetchDetails(this.apps[this.selApp]);
      }else if(x>=200){
        if(this.state===0&&this.selCat<this.cats.length-1){this.selCat++;if(this.selCat>=this.scroll+7)this.scroll++;this.draw();}
        else if(this.state===1&&this.selApp<this.apps.length-1){this.selApp++;if(this.selApp>=this.scroll+7)this.scroll++;this.draw();}
      }
    }
  }

class InstallerScreen{
  constructor(sim){this.sim=sim;this.path='/';this.sel=0;this.scroll=0;this.dialog='';this.state=0;}
  list(){
    if(this.path==='/')return [{name:'/local',type:'dir',path:'/local'},{name:'/sd',type:'dir',path:'/sd'}];
    return this.sim.vfs.listDirFull(this.path).sort((a,b)=>{
      if(a.isDir&&!b.isDir)return -1;
      if(!a.isDir&&b.isDir)return 1;
      return a.name.localeCompare(b.name);
    });
  }
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);
    d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.setTextDatum(4);
    d.drawString('Installer  '+this.path,120,21,2);
    if(this.state===2){
      d.fillRoundRect(10,80,220,140,6,TFT_DARKGREY);
      d.setTextColor(TFT_WHITE,TFT_DARKGREY);
      const lines=this.dialog.split('\n');
      for(let i=0;i<lines.length;i++)d.drawString(lines[i],120,120+i*20,2);
      d.fillRoundRect(85,175,70,30,4,TFT_BLUE);
      d.setTextColor(TFT_WHITE,TFT_BLUE);d.drawString('OK',120,190,2);
      return;
    }
    const items=this.list();
    d.fillRect(10,45,220,230,TFT_BLACK);
    if(!items.length){d.setTextColor(TFT_DARKGREY,TFT_BLACK);d.setTextDatum(4);d.drawString('Folder empty',120,160,2);}
    for(let i=0;i<7;i++){
      const idx=this.scroll+i;if(idx>=items.length)break;
      const it=items[idx];const y=45+i*30;
      let label=it.name,col=TFT_WHITE;
      if(it.isDir){
        const jp=it.path+'/app.json';
        if(this.sim.vfs.exists(jp)){
          try{const meta=JSON.parse(this.sim.vfs.read(jp));label='[APP] '+(meta.name||it.name);col=TFT_GREEN;}catch(e){}
        }else label='[D] '+it.name;
      }
      if(idx===this.sel){
        d.fillRect(10,y,220,25,TFT_WHITE);
        d.setTextColor(TFT_BLACK,TFT_WHITE);d.setTextDatum(3);
        d.drawString('> '+label,15,y+12,2);
      }else{
        d.setTextColor(col,TFT_BLACK);d.setTextDatum(3);
        d.drawString('  '+label,15,y+12,2);
      }
    }
    d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);d.setTextDatum(4);
    d.drawString('ESC',30,300,2);d.drawString('|',60,300,2);
    d.drawString('UP',90,300,2);d.drawString('|',120,300,2);
    d.drawString('SEL',150,300,2);d.drawString('|',180,300,2);
    d.drawString('DN',210,300,2);
  }
  handleTouch(x,y){
    if(this.state===2){if(x>=85&&x<=155&&y>=175&&y<=210){this.state=0;this.draw();}return;}
    const items=this.list();
    if(y>=45&&y<=270){
      const c=this.scroll+Math.floor((y-45)/30);
      if(c<items.length){
        this.sel=c;const it=items[c];
        if(it.isDir&&!this.sim.vfs.exists(it.path+'/app.json')){this.path=it.path;this.sel=0;this.scroll=0;this.draw();}
        else if(it.isDir)this._installApp(it.path);
        else if(it.name.endsWith('.js')){
          const name=it.name.replace('.js','');
          this.sim.launchApp({name,path:it.path,pkg:name});
        }
      }
      return;
    }
    if(y>=285){
      if(x<60){
        if(this.path==='/')this.sim.setState(S.LAUNCHER);
        else{const p=this.path.split('/').filter(Boolean);p.pop();this.path='/'+p.join('/');this.sel=0;this.scroll=0;this.draw();}
      }else if(x>=60&&x<120){if(this.sel>0){this.sel--;if(this.sel<this.scroll)this.scroll=this.sel;this.draw();}}
      else if(x>=120&&x<180){
        if(this.sel<items.length){
          const it=items[this.sel];
          if(it.isDir&&this.sim.vfs.exists(it.path+'/app.json'))this._installApp(it.path);
        }
      }else{if(this.sel<items.length-1){this.sel++;if(this.sel>=this.scroll+7)this.scroll++;this.draw();}}
    }
  }
  _installApp(srcPath){
    const meta=JSON.parse(this.sim.vfs.read(srcPath+'/app.json'));
    const pkg=meta.packageName||'unknown.pkg';
    const dst='/local/apps/'+pkg;
    this.sim.vfs.mkdir(dst);
    this.sim.vfs.write(dst+'/app.json',JSON.stringify(meta,null,2));
    const code=this.sim.vfs.read(srcPath+'/main.js');
    this.sim.vfs.write(dst+'/main.js',code);
    this.dialog=`${meta.name} v${meta.version}\n\nInstalled successfully!`;
    this.state=2;
    this.sim.launcher.scan();
    this.sim.refreshAppList();
    this.draw();
  }
}

class UpdaterScreen{
  constructor(sim){this.sim=sim;this.checked=false;this.result=null;}
  async check(){
    this.result='checking';this.draw();
    try{
      const res=await fetch('https://raw.githubusercontent.com/Haris16-code/KryonOS/refs/heads/main/updates/esp32/v2/update.json');
      const data=await res.json();
      const rel=data.release||data;
      if(rel.version&&rel.version!==KRYONOS_VERSION)this.result='available:'+rel.version;
      else this.result='uptodate';
    }catch(e){this.result='failed:'+e.message;}
    this.draw();
  }
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);
    d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.setTextDatum(4);
    d.drawString('System Updates',120,21,2);
    if(!this.result){d.setTextColor(TFT_YELLOW,TFT_BLACK);d.drawString('Checking for updates...',120,160,2);}
    else if(this.result==='checking'){d.setTextColor(TFT_YELLOW,TFT_BLACK);d.drawString('Contacting server...',120,160,2);}
    else if(this.result==='uptodate'){
      d.setTextColor(TFT_GREEN,TFT_BLACK);
      d.drawString('System is up to date!',120,120,2);
      d.setTextColor(TFT_CYAN,TFT_BLACK);
      d.drawString('Current: v'+KRYONOS_VERSION,120,145,2);
    }else if(this.result.startsWith('available:')){
      d.setTextColor(TFT_YELLOW,TFT_BLACK);
      d.drawString('Update available',120,110,2);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      d.drawString('New: '+this.result.split(':')[1],120,135,2);
      d.setTextColor(TFT_DARKGREY,TFT_BLACK);
      d.drawString('OTA not supported in browser',120,165,2);
    }else{
      d.setTextColor(TFT_RED,TFT_BLACK);
      d.drawString('Check failed',120,140,2);
      d.setTextColor(TFT_WHITE,TFT_BLACK);
      d.drawString(this.result.replace('failed:','').substring(0,30),120,165,2);
    }
    d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);

  }

      if(x>=30&&x<=110){
        this.sim.vfs.remove(items[this.sel].path);
        this.sel=-1;this.sim.launcher.scan();this.sim.refreshAppList();this.draw();
      }else if(x>=130&&x<=210){this.sel=-1;this.draw();}
      return;
    }
    if(y>=45&&y<=270){
      const c=this.scroll+Math.floor((y-45)/30);
      if(c<items.length){this.sel=c;this.draw();}
    }else if(y>=285)this.sim.setState(S.SETTINGS);
  }
}
class PermissionsScreen{
  constructor(sim){this.sim=sim;this.scroll=0;this.sel=-1;}
  list(){return [...this.sim.permissions].filter(g=>g.endsWith(':storage')).map(g=>({pkg:g.replace(':storage','')}));}
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);
    d.fillRoundRect(6,6,228,30,5,TFT_BLACK);
    d.drawRoundRect(6,6,228,30,5,TFT_GREEN);
    d.setTextColor(TFT_GREEN,TFT_BLACK);d.setTextDatum(4);
    d.drawString('Permissions',120,21,2);
    const items=this.list();
    d.fillRect(10,45,220,230,TFT_BLACK);
    if(!items.length){d.setTextColor(TFT_DARKGREY,TFT_BLACK);d.drawString('No granted permissions',120,160,2);}
    for(let i=0;i<7;i++){
      const idx=this.scroll+i;if(idx>=items.length)break;
      const y=45+i*30;
      if(idx===this.sel){
        d.fillRect(10,y,220,25,TFT_WHITE);
        d.setTextColor(TFT_BLACK,TFT_WHITE);d.setTextDatum(3);
        d.drawString('> '+items[idx].pkg+' [storage]',15,y+12,2);
      }else{
        d.setTextColor(TFT_WHITE,TFT_BLACK);d.setTextDatum(3);
        d.drawString('  '+items[idx].pkg+' [storage]',15,y+12,2);
      }
    }
    d.drawRoundRect(5,285,230,30,5,TFT_WHITE);
    d.setTextColor(TFT_WHITE,TFT_BLACK);
    d.drawString('BACK',120,300,2);
  }
  handleTouch(x,y){
    const items=this.list();
    if(y>=45&&y<=270){
      const c=this.scroll+Math.floor((y-45)/30);
      if(c<items.length){
        this.sim.permissions.delete(items[c].pkg+':storage');
        this.sim.notif.post('Permissions','Revoked for '+items[c].pkg,'warn');
        this.draw();
      }
    }else if(y>=285)this.sim.setState(S.SETTINGS);
  }
}
class TimeScreen{
  constructor(sim){this.sim=sim;}
  draw(){
    const d=this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3,3,234,314,5,TFT_WHITE);

    else if(y>=285)this.sim.setState(S.SETTINGS);

}

/* ─── 13. SIMULATOR ───────────────────────────────────────────── */
class Simulator{
  constructor(){
    this.canvas=$('screen');
    this.overlayCanvas=$('overlay');
    this.overlayCtx=this.overlayCanvas.getContext('2d');
    this.disp=new TFTDisplay(this.canvas);
    this.vfs=new VFS(this);
    this.keyboard=new OnScreenKeyboard(this);
    this.notif=new NotificationOverlay(this);
    this.touch={x:0,y:0,touched:false,justPressed:false};
    this.exitRequested=false;
    this.startTime=Date.now();
    this.permissions=new Set();
    this.currentPkg='';
    this.pendingLaunch=null;
    this.sim={
      board:BOARDS['esp32-s3-devkitc-1-n16r8'],
      wifi:true,timezone:'UTC0',use24h:true,weather:'online'
    };
    this.kryon3D=new Kryon3DEngine();

    this.env={};
    this.env.FastMath=buildFastMath();
    this.env.Crypto=buildCrypto();
    this.env.PWM=buildPWM();
    this.env.I2C=buildI2C();
    this.env.Network=buildNetwork(this);
    this.env.HttpServer=buildHttpServer();
    this.env.WebSocket=buildWebSocketClass(this);
    this.env.IPC=buildIPC(this);
    this.env.AI=buildAI();
    this.env.FS=buildFS(this);
    this.env.System=buildSystem(this,this.disp,this.keyboard,this.notif,
      this.env.PWM,this.env.I2C,this.env.Crypto,this.env.IPC,this.env.AI,
      this.env.Network,this.env.HttpServer,this.kryon3D);

    this.launcher=new LauncherScreen(this);
    this.screens={
      [S.LAUNCHER]:this.launcher,
      [S.SETTINGS]:new SettingsScreen(this),
      [S.SETTINGS_WIFI]:new WiFiScreen(this),
      [S.SETTINGS_ABOUT]:new AboutScreen(this),
      [S.SETTINGS_APPS]:new AppsScreen(this),
      [S.SETTINGS_PERMISSIONS]:new PermissionsScreen(this),
      [S.SETTINGS_TIME]:new TimeScreen(this),
      [S.UPDATER_MANUAL]:new UpdaterScreen(this),
      [S.UPDATER_BOOT]:new UpdaterScreen(this),
      [S.APP_STORE]:new AppStoreScreen(this),
      [S.HELP_CENTER]:new HelpScreen(this),
      [S.INSTALLER]:new InstallerScreen(this),
      [S.CALIBRATOR]:new CalibratorScreen(this),
      [S.WEB_APP]:new WebServerScreen(this),
      [S.KRYON_CLOUD]:new CloudScreen(this)
    };
    this.state=S.LAUNCHER;
    this._bindInput();
    this._bindUI();

    this.vfs.init().then(()=>{
      this.launcher.scan();
      this.refreshAppList();
      this.setState(S.LAUNCHER);
    });

    const loop=()=>{this.notif.render();requestAnimationFrame(loop);};
    requestAnimationFrame(loop);

    let frames=0,last=performance.now();
    setInterval(()=>{
      const now=performance.now();
      $('st-fps').textContent=Math.round(frames*1000/(now-last));
      frames=0;last=now;
    },1000);
    const cf=()=>{frames++;requestAnimationFrame(cf);};
    requestAnimationFrame(cf);
  }
  onStorageChanged(){}
  setState(s){
    this.state=s;
    const labels={
      [S.LAUNCHER]:'LAUNCHER',[S.SETTINGS]:'SETTINGS',
      [S.RUN_APP]:'RUN_APP',[S.APP_STORE]:'APP_STORE',
      [S.SETTINGS_WIFI]:'WIFI',[S.SETTINGS_ABOUT]:'ABOUT',
      [S.HELP_CENTER]:'HELP',[S.INSTALLER]:'INSTALLER',[S.KRYON_CLOUD]:'CLOUD'
    };
    $('st-state').textContent=labels[s]||('STATE_'+s);
    const eb=$('hw-exit-btn');
    if(s===S.RUN_APP)eb.classList.add('active');
    else eb.classList.remove('active');
    if(s===S.RUN_APP)return;
    this.disp.fillScreen(TFT_BLACK);
    const scr=this.screens[s];
    if(scr&&scr.draw)scr.draw();
  }
  _bindInput(){
    const cvs=this.canvas;
    const getXY=(cx,cy)=>{
      const r=cvs.getBoundingClientRect();
      return {
        x:clamp(Math.floor((cx-r.left)*cvs.width/r.width),0,cvs.width-1),
        y:clamp(Math.floor((cy-r.top)*cvs.height/r.height),0,cvs.height-1)
      };
    };
    const press=(cx,cy)=>{const p=getXY(cx,cy);this._handlePress(p.x,p.y);};
    cvs.addEventListener('mousedown',e=>{e.preventDefault();press(e.clientX,e.clientY);});
    window.addEventListener('mouseup',()=>{if(this.state===S.RUN_APP)this.touch.touched=false;});
    cvs.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];press(t.clientX,t.clientY);},{passive:false});
    cvs.addEventListener('touchend',e=>{e.preventDefault();if(this.state===S.RUN_APP)this.touch.touched=false;},{passive:false});
    $('hw-exit-btn').addEventListener('click',()=>{
      this.exitRequested=true;
      if(this.keyboard.active)this.keyboard._finish('');
    });
    document.querySelectorAll('.ctrl-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const scr=this.screens[this.state];
        if(scr&&scr.handleTouch){
          const k=btn.dataset.key;
          const y=this.disp.H-20;
          if(k==='up')scr.handleTouch(30,y);
          else if(k==='sel')scr.handleTouch(120,y);
          else if(k==='dn')scr.handleTouch(210,y);
        }
      });
    });
  }
  _handlePress(x,y){
    if(this.state===S.RUN_APP&&x>=200&&y<=40){this.exitRequested=true;return;}
    if(this.keyboard.active){this.keyboard.handleTouch(x,y);return;}
    if(this.state===S.RUN_APP){
      this.touch.x=x;this.touch.y=y;
      this.touch.touched=true;this.touch.justPressed=true;
      return;
    }
    const scr=this.screens[this.state];
    if(scr&&scr.handleTouch)scr.handleTouch(x,y);
  }
  render3D(x=0,y=0){if(this.kryon3D.sprite)this.disp.ctx.drawImage(this.kryon3D.sprite.canvas,x,y);}
  async launchApp(app,codeOverride){
    let rawCode=codeOverride!=null?codeOverride:this.vfs.read(app.isLegacy?app.path:app.path+'/main.js');
    if(!rawCode){log('App main.js not found at '+app.path,'err');return;}
    this.exitRequested=false;
    this.touch={x:0,y:0,touched:false,justPressed:false};
    this.currentPkg=app.pkg||app.name;
    const appDir=app.path.endsWith('/')?app.path:app.path+'/';
    this.env.FS._setSandboxRoot(appDir);
    this.env.IPC._setCurrentAppId(this.currentPkg);
    this.env.IPC._setLaunchArgs('');
    this.setState(S.RUN_APP);
    this.disp.fillScreen(TFT_BLACK);

    let transformed;
    try{transformed=transpile(rawCode);}
    catch(err){await this._showError(err.message);return;}

    const scopeKeys=[
      'System','FS','Network','HttpServer','WebSocket','Notification',
      'IPC','Kryon','AI','PWM','I2C','Crypto','Kryon3D','FastMath',
      'console','print','println',
      'BLACK','WHITE','RED','GREEN','BLUE','YELLOW','CYAN','MAGENTA','ORANGE','DARKGREY','LIGHTGREY','PURPLE','NAVY',
      'C_BLACK','C_WHITE','C_RED','C_GREEN','C_BLUE','C_YELLOW','C_CYAN','C_MAGENTA','C_ORANGE','C_DARKGREY','C_PURPLE','C_NAVY'
    ];
    const scopeVals=[
      this.env.System,this.env.FS,this.env.Network,this.env.HttpServer,
      this.env.WebSocket,this.notif,this.env.IPC,
      {ai:this.env.AI},this.env.AI,this.env.PWM,this.env.I2C,this.env.Crypto,
      this.kryon3D,this.env.FastMath,
      {log:(...a)=>log(a.join(' '),'info'),error:(...a)=>log(a.join(' '),'err'),warn:(...a)=>log(a.join(' '),'warn'),info:(...a)=>log(a.join(' '),'info'),debug:(...a)=>log(a.join(' '),'dim')},
      (...a)=>log(a.join(' ')),(...a)=>log(a.join(' ')),
      TFT_BLACK,TFT_WHITE,TFT_RED,TFT_GREEN,TFT_BLUE,TFT_YELLOW,TFT_CYAN,TFT_MAGENTA,TFT_ORANGE,TFT_DARKGREY,TFT_LIGHTGREY,TFT_PURPLE,TFT_NAVY,
      TFT_BLACK,TFT_WHITE,TFT_RED,TFT_GREEN,TFT_BLUE,TFT_YELLOW,TFT_CYAN,TFT_MAGENTA,TFT_ORANGE,TFT_DARKGREY,TFT_PURPLE,TFT_NAVY
    ];

    let fn;
    try{fn=new Function(...scopeKeys,`"use strict"; return (async () => { ${transformed} })();`);}
    catch(err){await this._showError('Compile error: '+err.message);return;}

    log('▶ Running: '+app.name,'info');
    try{
      await fn(...scopeVals);
      log('■ App finished normally');
    }catch(e){
      audioHW.reset();
      if(e.message==='OS_EXIT'||e.code==='OS_EXIT')log('■ Exited via OS_EXIT');
      else{log('✖ Exception: '+e.message,'err');await this._showError(e.message);return;}
    }
    this.env.FS._setSandboxRoot('');
    this.env.IPC._clear();
    this.kryon3D.end();
    if(this.pendingLaunch){
      const p=this.pendingLaunch;this.pendingLaunch=null;
      const app={name:'chained',path:p.path,pkg:'chained'};
      this.env.IPC._setLaunchArgs(p.args);
      await this.launchApp(app);
      return;
    }
    this.exitRequested=false;
    this.setState(S.LAUNCHER);
  }
  _showError(msg){
    this.state=S.RUN_APP;
    $('st-state').textContent='ERROR';
    this.disp.fillScreen(TFT_RED);
    this.disp.setTextColor(TFT_WHITE,TFT_RED);
    this.disp.setTextDatum(0);
    this.disp.drawString('JS EXCEPTION!',10,10,4);
    const lines=String(msg).split('\n');
    let y=60;
    for(let i=0;i<lines.length&&i<8;i++){
      this.disp.drawString(lines[i].substring(0,38),10,y,2);
      y+=20;
    }
    return new Promise(res=>{
      const check=setInterval(()=>{if(this.exitRequested){clearInterval(check);res();}},40);
    }).then(()=>{this.exitRequested=false;this.setState(S.LAUNCHER);});
  }
  reboot(){this.disp.fillScreen(TFT_BLACK);this.notif.clearAll();this.setState(S.LAUNCHER);}
  updateStatus(){
    $('st-wifi').textContent=this.sim.wifi?'ONLINE':'OFF';
    $('st-wifi').style.color=this.sim.wifi?'var(--accent)':'var(--err)';
    $('st-heap').textContent=(this.sim.wifi?384:448)+' KB';
  }
  refreshAppList(){
    const el=$('app-list');el.innerHTML='';this.launcher.scan();
    for(const app of this.launcher.apps){
      const row=document.createElement('div');row.className='app-row';
      const left=document.createElement('div');
      left.innerHTML=`<strong>${app.name}</strong><br><span class="meta">${app.pkg}</span>`;
      const right=document.createElement('div');right.className='actions';
      const b1=document.createElement('button');b1.className='btn sec';b1.textContent='▶ Run';
      b1.onclick=()=>this.launchApp(app);
      const b2=document.createElement('button');b2.className='btn danger';b2.textContent='✕';
      b2.onclick=()=>{if(!confirm('Delete '+app.name+'?'))return;this.vfs.remove(app.path);this.refreshAppList();this.launcher.scan();};
      right.appendChild(b1);right.appendChild(b2);
      row.appendChild(left);row.appendChild(right);
      el.appendChild(row);
    }
    if(!this.launcher.apps.length)el.innerHTML='<div class="empty">No apps installed. Use Studio tab or App Store.</div>';
  }
  _bindUI(){
    document.querySelectorAll('.tab').forEach(t=>{
      t.onclick=()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        document.querySelector(`.tab-pane[data-pane="${t.dataset.tab}"]`).classList.add('active');
      };
    });
    $('btn-refresh-apps').onclick=()=>this.refreshAppList();
    $('btn-seed-demo').onclick=async()=>{await this.vfs.seedDefaults();this.refreshAppList();this.launcher.scan();this.notif.post('Storage','Demo apps installed','ok');};
    $('app-code').value=`// Touch Counter — KryonOS demo pattern
var bg = System.color(18,18,28);
System.fillScreen(bg);
var count = 0;

function drawUI() {
  System.fillScreen(bg);
  System.setTextColor(WHITE, bg);
  System.drawString("Touch Counter", 35, 30, 4);
  System.setTextColor(CYAN, bg);
  System.drawString("Count: " + count, 75, 110, 4);
  System.fillRoundRect(30, 200, 180, 50, 8, GREEN);
  System.setTextColor(BLACK, GREEN);
  System.drawString("TAP TO COUNT", 45, 215, 2);
}

drawUI();

while (true) {
  var t = System.getTouch();
  if (t.touched) {
    if (t.y >= 200 && t.y <= 250 && t.x >= 30 && t.x <= 210) {
      count++;
      PWM.setTone(18, 1200 + count * 40, 60);
      drawUI();
    }
  }
  System.delay(40);
}`;
    $('btn-install').onclick=()=>{
      const name=$('app-name').value.trim()||'My App';
      const pkg=$('app-pkg').value.trim()||'com.app.test';
      const code=$('app-code').value;
      const dir='/local/apps/'+pkg;
      this.vfs.mkdir(dir);
      this.vfs.write(dir+'/app.json',JSON.stringify({name,packageName:pkg,version:'1.0.0',api:2,author:'Developer',type:'App',category:'Utility'},null,2));
      this.vfs.write(dir+'/main.js',code);
      log('💾 Installed '+name+' at '+dir,'ok');
      this.refreshAppList();
      this.notif.post('Storage',name+' installed','ok');
    };
    $('btn-run-live').onclick=()=>{
      const name=$('app-name').value.trim()||'Live Test';
      const code=$('app-code').value;
      this.launchApp({name,path:'/tmp/live/',pkg:'com.kryon.live'},code);
    };
    $('btn-format').onclick=async()=>{if(!confirm('Format virtual flash?'))return;await this.vfs.reset();this.refreshAppList();this.launcher.scan();};
    $('board-select').onchange=e=>{
      const b=BOARDS[e.target.value];if(!b)return;
      this.sim.board=b;
      this.canvas.width=b.w;this.canvas.height=b.h;
      this.overlayCanvas.width=b.w;this.overlayCanvas.height=b.h;
      this.canvas.style.width=(b.w*1.2)+'px';
      this.canvas.style.height=(b.h*1.2)+'px';
      this.overlayCanvas.style.width=b.w+'px';
      this.overlayCanvas.style.height=b.h+'px';
      this.disp.W=b.w;this.disp.H=b.h;
      $('board-label').textContent=b.name;
      this.reboot();
    };
    $('sim-time').oninput=e=>{this.sim.timezone=e.target.value;};
    $('sim-24h').onchange=e=>{this.sim.use24h=e.target.checked;};
    $('sim-wifi').onchange=e=>{this.sim.wifi=e.target.checked;this.updateStatus();};
    $('sim-weather').onchange=e=>{this.sim.weather=e.target.value;};
    $('btn-reboot').onclick=()=>this.reboot();
    $('btn-launcher').onclick=()=>this.setState(S.LAUNCHER);
    $('btn-show-touch').onclick=()=>{
      this.canvas.style.outline='3px solid #00ff88';
      setTimeout(()=>{this.canvas.style.outline='';},1500);
      log('[Sim] Touch indicator flashes screen border','dim');
    };
    $('btn-clear-log').onclick=()=>{consoleEl.innerHTML='';};
    this.canvas.style.width=(this.canvas.width*1.2)+'px';
    this.canvas.style.height=(this.canvas.height*1.2)+'px';
    this.overlayCanvas.style.width=this.canvas.width+'px';
    this.overlayCanvas.style.height=this.canvas.height+'px';
    this.updateStatus();
  }
}
