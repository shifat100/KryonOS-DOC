<script>
/* =========================================================
   Constants matching KryonOS firmware
   ========================================================= */
const TFT_BLACK=0x0000, TFT_WHITE=0xFFFF, TFT_RED=0xF800;
const TFT_GREEN=0x07E0, TFT_BLUE=0x001F, TFT_YELLOW=0xFFE0;
const TFT_CYAN=0x07FF, TFT_MAGENTA=0xF81F, TFT_ORANGE=0xFD20;
const TFT_DARKGREY=0x7BEF, TFT_LIGHTGREY=0xC618, TFT_PURPLE=0x780F;

const KRYONOS_VERSION = "1.0.0";
const KRYONOS_API_LEVEL = 1;

const STATE_LAUNCHER             = 0;
const STATE_SETTINGS             = 1;
const STATE_RUN_APP              = 2;
const STATE_INSTALLER            = 3;
const STATE_CALIBRATOR           = 4;
const STATE_WEB_APP              = 5;
const STATE_SETTINGS_WIFI        = 6;
const STATE_SETTINGS_ABOUT       = 7;
const STATE_SETTINGS_APPS        = 8;
const STATE_SETTINGS_TIME        = 9;
const STATE_SETTINGS_TIME_MANUAL = 10;
const STATE_UPDATER_BOOT         = 11;
const STATE_UPDATER_MANUAL       = 12;
const STATE_APP_STORE            = 13;
const STATE_HELP_CENTER          = 14;

const consoleEl = document.getElementById('console');
function log(msg, cls){
  const d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('en-GB', {hour12:false}) + '] ' + msg;
  consoleEl.appendChild(d);
  while (consoleEl.children.length > 300) consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* =========================================================
   IndexedDB Virtual File System
   ========================================================= */
class IndexedDB_VFS {
  constructor(sim){
    this.sim = sim;
    this.dbName = 'KryonOS_Storage_v3';
    this.storeName = 'files';
    this.db = null;
    this.cache = new Map();
    this.channel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('kryon_vfs_sync') : null;

    if (this.channel) {
      this.channel.onmessage = (e) => {
        if (e.data && e.data.type === 'FS_MUTATION') {
          this.loadAllFromDB().then(() => {
            this.sim.onStorageChanged(e.data.path);
          });
        }
      };
    }
  }

  async init(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          db.createObjectStore(this.storeName, { keyPath: 'path' });
        }
      };
      req.onsuccess = async (e) => {
        this.db = e.target.result;
        await this.loadAllFromDB();
        if (this.cache.size === 0) {
          log('IndexedDB is fresh. Seeding system files...', 'info');
          await this.seedDefaults();
        } else {
          log(`IndexedDB loaded (${this.cache.size} files restored).`, 'ok');
        }
        resolve();
      };
      req.onerror = (e) => {
        log('IndexedDB error: ' + e.target.error, 'err');
        reject(e.target.error);
      };
    });
  }

  loadAllFromDB(){
    return new Promise((resolve) => {
      const tx = this.db.transaction(this.storeName, 'readonly');
      const store = tx.objectStore(this.storeName);
      const req = store.getAll();
      req.onsuccess = () => {
        this.cache.clear();
        (req.result || []).forEach(item => {
          this.cache.set(item.path, item);
        });
        resolve();
      };
      req.onerror = () => resolve();
    });
  }

  async seedDefaults(){
    const defs = [
      { path: '/local', isDir: true, content: null },
      { path: '/local/apps', isDir: true, content: null },
      { path: '/sd', isDir: true, content: null },
      { path: '/sd/apps', isDir: true, content: null },
      { path: '/local/tmp_download', isDir: true, content: null },
      { path: '/local/note.txt', isDir: false, content: 'Welcome to KryonOS!\n\nAll files persist inside IndexedDB.' },
      { path: '/local/config_time.txt', isDir: false, content: 'UTC0|1|1' },
      { path: '/local/wifi.txt', isDir: false, content: 'HomeNetwork\npassword123' }
    ];

    for (const d of defs) {
      await this._putDB(d.path, d.content, d.isDir, false);
    }

    await this._seedApp('com.demo.hello', 'Hello Kryon',
`System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("Hello KryonOS!", 15, 40, 4);
System.setTextColor(WHITE);
System.drawString("OS: " + System.getOSVersion(), 15, 110, 2);
System.drawString("API: " + System.getAPILevel(), 15, 130, 2);
System.drawString("Free RAM: " + Math.floor(System.getInfo().freeRAM/1024) + " KB", 15, 150, 2);
System.drawString("Tap to exit", 15, 220, 2);
while (true) {
  var t = System.getTouch();
  if (t.touched) break;
  System.delay(50);
}`);

    await this._seedApp('com.demo.draw', 'Drawing Pad',
`System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("Draw with finger", 5, 5, 2);
System.setTextColor(YELLOW);
System.drawString("Top=toggle color", 5, 305, 1);
var lastX = -1, lastY = -1, color = WHITE;
while (true) {
  var t = System.getTouch();
  if (t.touched) {
    if (t.y < 30) {
      color = (color === WHITE) ? RED : WHITE;
      System.delay(200);
    } else {
      if (lastX >= 0) System.drawLine(lastX, lastY, t.x, t.y, color);
      lastX = t.x; lastY = t.y;
    }
  } else {
    lastX = -1; lastY = -1;
  }
  System.delay(10);
}`);

    this._broadcast('/local', 'SEED');
  }

  async _seedApp(pkg, name, code){
    const dir = '/local/apps/' + pkg;
    await this._putDB(dir, null, true, false);
    await this._putDB(dir + '/app.json', JSON.stringify({
      name, packageName: pkg, version: '1.0.0', api: 1, author: 'KryonOS', type: 'App', category: 'Demo', description: 'Bundled demo'
    }, null, 2), false, false);
    await this._putDB(dir + '/main.js', code, false, false);
  }

  _putDB(path, content, isDir = false, notify = true){
    const record = {
      path,
      content: isDir ? null : String(content),
      isDir,
      size: isDir ? 0 : (content ? content.length : 0),
      mtime: Date.now()
    };
    this.cache.set(path, record);

    if (this.db) {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).put(record);
    }

    if (notify) {
      this._broadcast(path, 'PUT');
      this.sim.onStorageChanged(path);
    }
    return true;
  }

  _delDB(path, notify = true){
    this.cache.delete(path);
    if (this.db) {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).delete(path);
    }
    if (notify) {
      this._broadcast(path, 'DELETE');
      this.sim.onStorageChanged(path);
    }
    return true;
  }

  _broadcast(path, action){
    if (this.channel) {
      try { this.channel.postMessage({ type: 'FS_MUTATION', path, action }); } catch(e){}
    }
  }

  exists(p){ return this.cache.has(p); }
  isDirectory(p){ const it = this.cache.get(p); return it ? it.isDir : false; }
  isFile(p){ const it = this.cache.get(p); return it ? !it.isDir : false; }
  readTextFile(p){ const it = this.cache.get(p); return (it && !it.isDir) ? it.content : ''; }
  writeTextFile(p, c){
    if (!p) return false;
    this._mkpar(p);
    return this._putDB(p, c, false, true);
  }
  appendTextFile(p, c){
    const old = this.readTextFile(p);
    return this.writeTextFile(p, old + c);
  }
  deleteFile(p){ return this._delDB(p, true); }
  renameFile(a, b){
    if (!this.cache.has(a)) return false;
    const old = this.cache.get(a);
    this._mkpar(b);
    this._putDB(b, old.content, old.isDir, false);
    this._delDB(a, false);
    this._broadcast(b, 'RENAME');
    this.sim.onStorageChanged(b);
    return true;
  }
  mkdir(p){
    if (this.cache.has(p)) return false;
    this._mkpar(p);
    return this._putDB(p, null, true, true);
  }
  rmdir(p){ return this._delDB(p, true); }
  listDir(p){
    if (!this.isDirectory(p)) return [];
    const pre = p.endsWith('/') ? p : p + '/';
    const out = [];
    for (const k of this.cache.keys()){
      if (k.startsWith(pre) && k !== p){
        const rest = k.substring(pre.length);
        if (!rest.includes('/')) out.push(k);
      }
    }
    return out;
  }
  listDirFull(p){
    if (!this.isDirectory(p)) return [];
    const pre = p.endsWith('/') ? p : p + '/';
    const out = [];
    for (const [k, it] of this.cache.entries()){
      if (k.startsWith(pre) && k !== p){
        const rest = k.substring(pre.length);
        if (!rest.includes('/')) out.push({ name: rest, path: k, isDir: it.isDir });
      }
    }
    return out;
  }
  getFileSize(p){ const it = this.cache.get(p); return (it && !it.isDir) ? it.size : 0; }
  deleteRecursive(p){
    const pre = p.endsWith('/') ? p : p + '/';
    for (const k of [...this.cache.keys()]){
      if (k === p || k.startsWith(pre)) {
        this._delDB(k, false);
      }
    }
    this._broadcast(p, 'DELETE_RECURSIVE');
    this.sim.onStorageChanged(p);
  }
  _mkpar(p){
    const parts = p.split('/').filter(Boolean);
    let cur = '';
    for (let i = 0; i < parts.length - 1; i++){
      cur += '/' + parts[i];
      if (!this.cache.has(cur)) {
        this._putDB(cur, null, true, false);
      }
    }
  }
  async reset(){
    if (this.db) {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      tx.objectStore(this.storeName).clear();
    }
    this.cache.clear();
    await this.seedDefaults();
    log('Storage formatted and restored to factory defaults.', 'warn');
  }
}

/* =========================================================
   TFT Display with Exact Alignment Support
   ========================================================= */
const TL_DATUM=0, TC_DATUM=1, MC_DATUM=4, ML_DATUM=3;

class TFTDisplay {
  constructor(cv){
    this.canvas = cv;
    this.ctx = cv.getContext('2d', {alpha:false});
    this.ctx.imageSmoothingEnabled = false;
    this.W = cv.width; this.H = cv.height;
    this.fgColor = '#fff'; this.bgColor = null;
    this.textSize = 1; this.textDatum = TL_DATUM;
    this.sprite = null; this.spriteBound = false;
    this.clear();
  }
  get target(){ return (this.spriteBound && this.sprite) ? this.sprite : this; }
  clear(){ this.ctx.fillStyle = '#000'; this.ctx.fillRect(0, 0, this.W, this.H); }
  static c565(c){
    const r = ((c >> 11) & 0x1F) * 255 / 31 | 0;
    const g = ((c >> 5) & 0x3F) * 255 / 63 | 0;
    const b = (c & 0x1F) * 255 / 31 | 0;
    return `rgb(${r},${g},${b})`;
  }
  static FONTS = { 1: 8, 2: 14, 4: 26, 6: 44, 7: 44, 8: 56 };
  fillScreen(c){ const t = this.target; t.ctx.fillStyle = TFTDisplay.c565(c); t.ctx.fillRect(0, 0, t.W, t.H); }
  fillRect(x,y,w,h,c){ if(w<=0||h<=0)return; const t = this.target; t.ctx.fillStyle = TFTDisplay.c565(c); t.ctx.fillRect(x,y,w,h); }
  drawRect(x,y,w,h,c){ const t = this.target; t.ctx.strokeStyle = TFTDisplay.c565(c); t.ctx.lineWidth = 1; t.ctx.strokeRect(x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1)); }
  drawLine(x0,y0,x1,y1,c){ const t = this.target; t.ctx.strokeStyle = TFTDisplay.c565(c); t.ctx.beginPath(); t.ctx.moveTo(x0+.5,y0+.5); t.ctx.lineTo(x1+.5,y1+.5); t.ctx.stroke(); }
  drawPixel(x,y,c){ const t = this.target; t.ctx.fillStyle = TFTDisplay.c565(c); t.ctx.fillRect(x,y,1,1); }
  drawCircle(x,y,r,c){ const t = this.target; t.ctx.strokeStyle = TFTDisplay.c565(c); t.ctx.beginPath(); t.ctx.arc(x,y,Math.abs(r),0,Math.PI*2); t.ctx.stroke(); }
  fillCircle(x,y,r,c){ const t = this.target; t.ctx.fillStyle = TFTDisplay.c565(c); t.ctx.beginPath(); t.ctx.arc(x,y,Math.abs(r),0,Math.PI*2); t.ctx.fill(); }
  drawTriangle(x0,y0,x1,y1,x2,y2,c){ const t = this.target; t.ctx.strokeStyle = TFTDisplay.c565(c); t.ctx.beginPath(); t.ctx.moveTo(x0,y0); t.ctx.lineTo(x1,y1); t.ctx.lineTo(x2,y2); t.ctx.closePath(); t.ctx.stroke(); }
  fillTriangle(x0,y0,x1,y1,x2,y2,c){ const t = this.target; t.ctx.fillStyle = TFTDisplay.c565(c); t.ctx.beginPath(); t.ctx.moveTo(x0,y0); t.ctx.lineTo(x1,y1); t.ctx.lineTo(x2,y2); t.ctx.closePath(); t.ctx.fill(); }
  _rr(ctx,x,y,w,h,r){ r = Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  drawRoundRect(x,y,w,h,r,c){ const t = this.target; t.ctx.strokeStyle = TFTDisplay.c565(c); t.ctx.lineWidth = 1; this._rr(t.ctx,x+.5,y+.5,Math.max(0,w-1),Math.max(0,h-1),r); t.ctx.stroke(); }
  fillRoundRect(x,y,w,h,r,c){ if(w<=0||h<=0)return; const t = this.target; t.ctx.fillStyle = TFTDisplay.c565(c); this._rr(t.ctx,x,y,w,h,r); t.ctx.fill(); }
  drawFastVLine(x,y,h,c){ this.fillRect(x,y,1,h,c); }
  drawFastHLine(x,y,w,c){ this.fillRect(x,y,w,1,c); }
  setTextColor(fg,bg){ this.fgColor = TFTDisplay.c565(fg); this.bgColor = (bg != null) ? TFTDisplay.c565(bg) : null; }
  setTextSize(s){ this.textSize = s; }
  setTextDatum(d){ this.textDatum = d; }
  drawString(str,x,y,font=2){
    const t = this.target;
    const base = TFTDisplay.FONTS[font] || 14;
    const sz = Math.max(6, Math.floor(base * this.textSize));
    t.ctx.font = `bold ${sz}px "Courier New",monospace`;
    str = String(str);
    const w = t.ctx.measureText(str).width;

    let rx = x, ry = y;
    if (this.textDatum === MC_DATUM) { rx = x - w / 2; ry = y - sz / 2; }
    else if (this.textDatum === TC_DATUM) { rx = x - w / 2; ry = y; }
    else if (this.textDatum === ML_DATUM) { rx = x; ry = y - sz / 2; }
    // TL_DATUM: rx = x, ry = y (default)

    t.ctx.textBaseline = 'top';
    t.ctx.textAlign = 'left';

    if (this.bgColor) {
      t.ctx.fillStyle = this.bgColor;
      t.ctx.fillRect(rx, ry, w, sz);
    }
    t.ctx.fillStyle = this.fgColor;
    t.ctx.fillText(str, rx, ry);
  }
  textWidth(str, font=2){
    const base = TFTDisplay.FONTS[font] || 14;
    const sz = Math.max(6, Math.floor(base * this.textSize));
    this.ctx.font = `bold ${sz}px "Courier New",monospace`;
    return this.ctx.measureText(String(str)).width;
  }
  color(r,g,b){
    r = Math.max(0, Math.min(255, r|0));
    g = Math.max(0, Math.min(255, g|0));
    b = Math.max(0, Math.min(255, b|0));
    return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
  }
}

/* =========================================================
   Keyboard
   ========================================================= */
class OnScreenKeyboard {
  constructor(sim){
    this.sim = sim; this.text = ''; this.caps = false; this.active = false;
    this.resolve = null; this.reject = null; this.promptMsg = '';
    this.kw = 12; this.kh = 4;
    this.keyset = [
      [['1','!'],['2','@'],['3','#'],['4','$'],['5','%'],['6','^'],['7','&'],['8','*'],['9','('],['0',')'],['-','_'],['=','+']],
      [['q','Q'],['w','W'],['e','E'],['r','R'],['t','T'],['y','Y'],['u','U'],['i','I'],['o','O'],['p','P'],['[','{'],[']','}']],
      [['a','A'],['s','S'],['d','D'],['f','F'],['g','G'],['h','H'],['j','J'],['k','K'],['l','L'],[';',':'],['\'','"'],['\\','|']],
      [['\\','|'],['z','Z'],['x','X'],['c','C'],['v','V'],['b','B'],['n','N'],['m','M'],[',','<'],['.','>'],['/','?'],[' ',' ']]
    ];
  }
  show(promptMsg, initial){
    this.sim.touch.touched = false;
    this.sim.touch.justPressed = false;
    this.text = initial || ''; this.caps = false; this.active = true;
    this.promptMsg = promptMsg || 'Input';
    this.draw();
    return new Promise((res, rej) => {
      this.resolve = res; this.reject = rej;
    });
  }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.setTextDatum(TL_DATUM);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.drawString(String(this.promptMsg).substring(0, 24), 5, 10, 2);

    d.drawRect(5, 30, 230, 30, TFT_GREEN);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    const disp = this.text.length > 18 ? this.text.substring(this.text.length - 18) : this.text;
    d.drawString(disp + '_', 10, 38, 2);

    const btnW = 240 / 5;
    const btns = ['OK', this.caps ? 'abc' : 'ABC', 'DEL', 'SPACE', 'ESC'];
    d.setTextDatum(MC_DATUM);
    for (let i = 0; i < 5; i++){
      d.drawRect(i * btnW, 70, btnW, 30, TFT_GREEN);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString(btns[i], i * btnW + btnW / 2, 85, 2);
    }

    const keyW = 240 / this.kw;
    const keyH = (320 - 110) / this.kh;
    for (let y = 0; y < this.kh; y++){
      for (let x = 0; x < this.kw; x++){
        const px = x * keyW;
        const py = 110 + y * keyH;
        d.drawRect(px, py, keyW, keyH, TFT_DARKGREY);
        const c = this.caps ? this.keyset[y][x][1] : this.keyset[y][x][0];
        d.setTextColor(TFT_WHITE, TFT_BLACK);
        d.drawString(c, px + keyW / 2, py + keyH / 2, 2);
      }
    }
  }
  handleTouch(x, y){
    if (y >= 70 && y <= 100){
      const btnW = 240 / 5;
      const idx = Math.floor(x / btnW);
      if (idx === 0) this.finish(this.text);
      else if (idx === 1) { this.caps = !this.caps; this.draw(); }
      else if (idx === 2) { if (this.text.length > 0) this.text = this.text.slice(0, -1); this.draw(); }
      else if (idx === 3) { this.text += ' '; this.draw(); }
      else this.finish('');
      return;
    }
    if (y >= 110){
      const keyW = 240 / this.kw;
      const keyH = (320 - 110) / this.kh;
      const kx = Math.floor(x / keyW);
      const ky = Math.floor((y - 110) / keyH);
      if (kx >= 0 && kx < this.kw && ky >= 0 && ky < this.kh){
        const c = this.caps ? this.keyset[ky][kx][1] : this.keyset[ky][kx][0];
        this.text += c; this.draw();
      }
    }
  }
  finish(val){
    if (!this.active) return;
    this.active = false;
    const r = this.resolve;
    this.resolve = null; this.reject = null;
    if (r) r(val);
  }
  cancel(){
    if (!this.active) return;
    this.active = false;
    const r = this.reject;
    this.resolve = null; this.reject = null;
    if (r) r(Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' }));
  }
}

/* =========================================================
   System & FS API (Guaranteed Top-Left Datum for User Apps)
   ========================================================= */
function buildSystemAPI(sim){
  const disp = sim.disp, vfs = sim.vfs;
  const startTime = Date.now();
  const vpins = {};

  return {
    gpio: {
      OUTPUT: 1, INPUT: 0, INPUT_PULLUP: 2, HIGH: 1, LOW: 0,
      pinMode: (p) => { vpins[p] = vpins[p] || {on:false}; },
      digitalWrite: (p, v) => { vpins[p] = vpins[p] || {on:false}; vpins[p].on = !!v; },
      digitalRead: (p) => (vpins[p] && vpins[p].on) ? 1 : 0,
      analogRead: () => Math.floor(Math.random() * 4096),
      analogWrite: (p, v) => { vpins[p] = vpins[p] || {on:false}; vpins[p].on = v > 127; },
      pulseIn: () => Math.floor(Math.random() * 1000)
    },
    fillScreen: (c) => {
      disp.fillScreen(c);
      if (sim.state === STATE_RUN_APP && !sim.keyboard.active) {
        disp.fillRoundRect(200, 0, 40, 30, 5, TFT_RED);
        disp.setTextColor(TFT_WHITE, TFT_RED);
        disp.setTextDatum(MC_DATUM);
        disp.drawString("X", 220, 15, 2);
        disp.setTextDatum(TL_DATUM); // Always reset to TL_DATUM for apps!
      }
    },
    fillRect: (x,y,w,h,c) => disp.fillRect(x,y,w,h,c),
    drawRect: (x,y,w,h,c) => disp.drawRect(x,y,w,h,c),
    drawLine: (a,b,c,d,e) => disp.drawLine(a,b,c,d,e),
    drawPixel: (x,y,c) => disp.drawPixel(x,y,c),
    drawCircle: (x,y,r,c) => disp.drawCircle(x,y,r,c),
    fillCircle: (x,y,r,c) => disp.fillCircle(x,y,r,c),
    drawTriangle: (...a) => disp.drawTriangle(...a),
    fillTriangle: (...a) => disp.fillTriangle(...a),
    drawRoundRect: (...a) => disp.drawRoundRect(...a),
    fillRoundRect: (...a) => disp.fillRoundRect(...a),
    drawFastVLine: (...a) => disp.drawFastVLine(...a),
    drawFastHLine: (...a) => disp.drawFastHLine(...a),
    drawBMP: (path, x, y) => {
      disp.fillRect(x, y, 32, 32, TFT_DARKGREY);
      disp.drawRect(x, y, 32, 32, TFT_WHITE);
      return true;
    },
    // Exact match to JSBindings.cpp: forces TL_DATUM before drawing user string!
    drawString: (s, x, y, f=2) => {
      disp.setTextDatum(TL_DATUM);
      disp.drawString(s, x, y, f);
    },
    setTextColor: (f, b) => disp.setTextColor(f, b),
    setTextSize: (s) => disp.setTextSize(s),
    createSprite: (w, h) => {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const spr = new TFTDisplay(cv); spr.W = w; spr.H = h;
      disp.sprite = spr; disp.spriteBound = false;
      return true;
    },
    deleteSprite: () => { disp.sprite = null; disp.spriteBound = false; },
    pushSprite: (x, y) => { if (disp.sprite) disp.ctx.drawImage(disp.sprite.canvas, x, y); },
    bindSprite: (e) => { disp.spriteBound = !!e && !!disp.sprite; },
    color: (r, g, b) => disp.color(r, g, b),
    screenWidth: () => disp.W,
    screenHeight: () => disp.H,

    getTouch: () => {
      if (sim.exitRequested) throw Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' });
      if (sim.keyboard.active) return { x: 0, y: 0, touched: false };
      const t = sim.touch;
      if ((t.touched || t.justPressed) && t.x >= 200 && t.y <= 40) {
        throw Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' });
      }
      const wasTouched = t.touched || t.justPressed;
      t.justPressed = false;
      return { x: t.x, y: t.y, touched: wasTouched };
    },

    millis: () => Date.now() - startTime,
    micros: () => (Date.now() - startTime) * 1000,
    delay: (ms) => new Promise((res, rej) => {
      const cap = Math.min(Math.max(0, ms|0), 30000);
      const start = Date.now();
      const tick = () => {
        if (sim.exitRequested){ rej(Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' })); return; }
        if (Date.now() - start >= cap){ res(); return; }
        setTimeout(tick, 8);
      };
      tick();
    }),
    delayMicroseconds: (us) => new Promise((res, rej) => {
      const ms = Math.max(0, us / 1000);
      const cap = Math.min(ms, 30000);
      const start = Date.now();
      const tick = () => {
        if (sim.exitRequested){ rej(Object.assign(new Error('OS_EXIT'), { code: 'OS_EXIT' })); return; }
        if (Date.now() - start >= cap){ res(); return; }
        setTimeout(tick, 4);
      };
      tick();
    }),
    print: (m) => log(String(m)),
    getTemperature: () => 42 + Math.random() * 6,
    hasTemperatureSensor: () => true,
    getInfo: () => ({
      totalRAM: 327680,
      freeRAM: 180000 + Math.floor(Math.random() * 10000),
      minFreeRAM: 130000,
      maxAllocRAM: 110000,
      cpuFreqMHz: 240,
      chipModel: 'ESP32-D0WDQ6',
      chipCores: 2,
      chipRevision: 1,
      flashSize: 4 * 1024 * 1024,
      uptimeMs: Date.now() - startTime
    }),
    restart: () => { log('System.restart() called', 'warn'); setTimeout(() => location.reload(), 400); },
    getTime: () => {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    },
    getSeconds: () => new Date().getSeconds(),
    getDate: () => {
      const d = new Date();
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    },
    getYear: () => new Date().getFullYear(),
    getMonth: () => new Date().getMonth() + 1,
    getDay: () => new Date().getDate(),
    getTimezone: () => sim.timezone,
    getOSVersion: () => KRYONOS_VERSION,
    getAPILevel: () => KRYONOS_API_LEVEL,
    getIPAddress: () => sim.wifiConnected ? '192.168.4.1' : '',
    isWiFiActive: () => sim.wifiConnected,
    prompt: (msg, init) => sim.keyboard.show(msg, init)
  };
}

function buildFSAPI(vfs){
  return {
    readTextFile: (p) => vfs.exists(p) ? vfs.readTextFile(p) : null,
    writeTextFile: (p, c) => vfs.writeTextFile(p, c),
    appendTextFile: (p, c) => vfs.appendTextFile(p, c),
    deleteFile: (p) => vfs.deleteFile(p),
    renameFile: (a, b) => vfs.renameFile(a, b),
    exists: (p) => vfs.exists(p),
    listDir: (p) => vfs.listDir(p),
    mkdir: (p) => vfs.mkdir(p),
    rmdir: (p) => vfs.rmdir(p),
    isDirectory: (p) => vfs.isDirectory(p),
    isFile: (p) => vfs.isFile(p),
    getFileSize: (p) => vfs.getFileSize(p),
    getTotalSpace: (d) => d.startsWith('/sd') ? 16 * 1024 * 1024 : 4 * 1024 * 1024,
    getUsedSpace: (d) => d.startsWith('/sd') ? 1.2 * 1024 * 1024 : 512 * 1024,
    getFreeSpace: (d) => d.startsWith('/sd') ? 14.8 * 1024 * 1024 : 3.5 * 1024 * 1024,
    getFileMD5: (p) => 'd41d8cd98f00b204e9800998ecf8427e',
    mountSD: () => true,
    unmountSD: () => {}
  };
}

// --- 1. Launcher UI ---
class LauncherUI {
  constructor(sim){
    this.sim = sim; this.selectedIndex = 1; this.scrollOffset = 0;
    this.apps = [];
  }
  scanApps(){
    this.apps = [];
    for (const d of ['/local/apps', '/sd/apps']){
      if (!this.sim.vfs.isDirectory(d)) continue;
      for (const e of this.sim.vfs.listDirFull(d)){
        if (e.isDir){
          const jp = e.path + '/app.json';
          if (this.sim.vfs.exists(jp)){
            try {
              const o = JSON.parse(this.sim.vfs.readTextFile(jp));
              const n = o.name || e.name;
              if (!this.apps.find(a => a.name === n)) this.apps.push({ name: n, path: e.path, isFolder: true });
            } catch(err){}
          }
        } else if (e.name.endsWith('.js')){
          if (!this.apps.find(a => a.name === e.name)) this.apps.push({ name: e.name, path: e.path, isFolder: false });
        }
      }
    }
  }
  total(){ return this.apps.length + 6; }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('KryonOS Home', 120, 21, 2);

    d.fillRect(10, 45, 220, 230, TFT_BLACK);
    const total = this.total(), pp = 7;

    for (let i = 0; i < pp; i++){
      const idx = this.scrollOffset + i;
      if (idx >= total) break;
      const y = 45 + i * 30;
      let name = '', isHdr = false;

      if (idx === 0) { name = '[ SYSTEM ]'; isHdr = true; }
      else if (idx === 1) name = 'App Store';
      else if (idx === 2) name = 'App Installer';
      else if (idx === 3) name = 'Settings';
      else if (idx === 4) name = 'Help Center';
      else if (idx === 5) { name = '[ APPS ]'; isHdr = true; }
      else name = this.apps[idx - 6].name;

      if (isHdr){
        d.setTextColor(TFT_DARKGREY, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString(name, 15, y + 12, 2);
      } else if (idx === this.selectedIndex){
        d.fillRect(10, y, 220, 25, TFT_WHITE);
        d.setTextColor(TFT_BLACK, TFT_WHITE);
        d.setTextDatum(ML_DATUM);
        d.drawString('> ' + name, 15, y + 12, 2);
      } else {
        d.setTextColor(TFT_WHITE, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString('  ' + name, 15, y + 12, 2);
      }
    }

    if (total > pp){
      const sbH = 230;
      const th = Math.max(20, Math.floor((sbH * pp) / total));
      const maxTY = sbH - th;
      const ty = 45 + Math.floor((this.scrollOffset * maxTY) / (total - pp));
      d.fillRect(232, 45, 3, sbH, TFT_DARKGREY);
      d.fillRect(232, ty, 3, th, TFT_WHITE);
    }

    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('UP', 30, 300, 2);  d.drawString('|', 60, 300, 2);
    d.drawString('SEL', 120, 300, 2); d.drawString('|', 180, 300, 2);
    d.drawString('DN', 210, 300, 2);
  }
  handleTouch(x, y){
    if (y < 40){ this.sim.setState(STATE_INSTALLER); return; }
    const total = this.total();
    if (y >= 45 && y <= 270){
      const idx = this.scrollOffset + Math.floor((y - 45) / 30);
      if (idx < total && idx !== 0 && idx !== 5){
        this.selectedIndex = idx;
        this.draw();
        this.execute();
      }
      return;
    }

    if (y >= 285 && y <= 315){
      if (x < 60){
        if (this.selectedIndex > 1){
          this.selectedIndex--;
          if (this.selectedIndex === 5) this.selectedIndex--;
          if (this.selectedIndex < this.scrollOffset) this.scrollOffset = this.selectedIndex;
          if (this.selectedIndex === 1) this.scrollOffset = 0;
          this.draw();
        }
      } else if (x > 60 && x < 180){
        this.execute();
      } else if (x > 180){
        if (this.selectedIndex < total - 1){
          let next = this.selectedIndex + 1;
          if (next === 5) next++;
          if (next < total){
            this.selectedIndex = next;
            if (this.selectedIndex >= this.scrollOffset + 7) this.scrollOffset = this.selectedIndex - 6;
            this.draw();
          }
        }
      }
    }
  }
  execute(){
    const s = this.selectedIndex;
    if (s === 1) this.sim.setState(STATE_APP_STORE);
    else if (s === 2) this.sim.setState(STATE_INSTALLER);
    else if (s === 3) this.sim.setState(STATE_SETTINGS);
    else if (s === 4) this.sim.setState(STATE_HELP_CENTER);
    else if (s > 5 && this.apps[s - 6]) this.sim.launchApp(this.apps[s - 6]);
  }
  physical(k){
    if (k === 'up') this.handleTouch(30, 300);
    else if (k === 'sel') this.handleTouch(120, 300);
    else if (k === 'dn') this.handleTouch(210, 300);
  }
}

// --- 2. Installer UI ---
class InstallerUI {
  constructor(sim){
    this.sim = sim; this.currentPath = '/';
    this.files = []; this.selectedIndex = 0; this.scrollOffset = 0;
    this.dialog = null;
  }
  enter(){ this.refresh(); }
  refresh(){
    if (this.currentPath === '/'){
      this.files = [
        { name: 'SD Card', path: '/sd/', isDir: true },
        { name: 'Internal Storage', path: '/local/', isDir: true },
        { name: 'Help / Guide', path: '/help/', isDir: true }
      ];
    } else if (this.currentPath === '/help/'){
      this.files = [];
    } else {
      this.files = this.sim.vfs.listDirFull(this.currentPath);
      this.files.sort((a,b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
    }
    const hasUp = (this.currentPath !== '/');
    if (this.selectedIndex >= this.files.length + (hasUp ? 1 : 0)) {
      this.selectedIndex = 0; this.scrollOffset = 0;
    }
  }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    if (this.dialog) { this._drawDialog(); return; }
    if (this.currentPath === '/help/') { this._drawHelp(); return; }

    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    let title = 'App Installer';
    if (this.currentPath.startsWith('/sd')) title = 'Installer   /sdcard';
    else if (this.currentPath.startsWith('/local')) title = 'Installer   /internal';
    d.drawString(title, 120, 21, 2);

    d.fillRect(10, 45, 220, 230, TFT_BLACK);
    const hasUp = (this.currentPath !== '/');
    const total = this.files.length + (hasUp ? 1 : 0);

    for (let i = 0; i < 7; i++){
      const idx = this.scrollOffset + i;
      if (idx >= total) break;
      const y = 45 + i * 30;
      let label = '', isApp = false;

      if (hasUp && idx === 0){
        label = '[..] UP';
      } else {
        const f = this.files[idx - (hasUp ? 1 : 0)];
        if (f.isDir){
          const jp = f.path.replace(/\/+$/, '') + '/app.json';
          if (this.sim.vfs.exists(jp)){
            try {
              const meta = JSON.parse(this.sim.vfs.readTextFile(jp));
              label = '[' + (meta.type || 'App') + '] ' + (meta.name || f.name);
              isApp = true;
            } catch(e){ label = '[D] ' + f.name; }
          } else { label = '[D] ' + f.name; }
        } else {
          label = f.name;
        }
      }

      if (idx === this.selectedIndex){
        d.fillRect(10, y, 220, 25, TFT_WHITE);
        d.setTextColor(TFT_BLACK, TFT_WHITE);
        d.setTextDatum(ML_DATUM);
        d.drawString('> ' + label, 15, y + 12, 2);
      } else {
        d.setTextColor(isApp ? TFT_GREEN : TFT_WHITE, TFT_BLACK);
        d.setTextDatum(ML_DATUM);
        d.drawString('  ' + label, 15, y + 12, 2);
      }
    }

    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('ESC', 30, 300, 2);  d.drawString('|', 60, 300, 2);
    d.drawString('UP', 90, 300, 2);   d.drawString('|', 120, 300, 2);
    d.drawString('SEL', 150, 300, 2);  d.drawString('|', 180, 300, 2);
    d.drawString('DN', 210, 300, 2);
  }
  _drawHelp(){
    const d = this.sim.disp;
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('Installer Help', 120, 21, 2);

    d.setTextDatum(TL_DATUM);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    let y = 50;
    d.drawString("How to Install Apps:", 10, y, 2); y += 20;
    d.setTextColor(TFT_LIGHTGREY, TFT_BLACK);
    d.drawString("1. Put app folder in /sd/ or /local/", 10, y, 2); y += 18;
    d.drawString("2. Needs app.json & main.js", 10, y, 2); y += 18;
    d.drawString("3. Tap [App] to install", 10, y, 2); y += 18;
    d.drawString("4. App appears in KryonOS Home", 10, y, 2); y += 25;

    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('BACK', 120, 300, 2);
  }
  _drawDialog(){
    const d = this.sim.disp;
    const dlg = this.dialog;
    d.fillRoundRect(10, 50, 220, 220, 8, TFT_DARKGREY);
    d.setTextDatum(MC_DATUM);
    d.setTextColor(dlg.ok ? TFT_GREEN : TFT_RED, TFT_DARKGREY);
    d.drawString(dlg.title, 120, 75, 4);

    d.setTextColor(TFT_WHITE, TFT_DARKGREY);
    let y = 110;
    for (const l of (dlg.lines || [])){
      d.drawString(String(l).substring(0, 30), 120, y, 2);
      y += 20;
    }

    if (dlg.actions === 'OK'){
      d.fillRoundRect(85, 220, 70, 30, 4, TFT_BLUE);
      d.setTextColor(TFT_WHITE, TFT_BLUE);
      d.drawString('OK', 120, 235, 2);
    } else if (dlg.actions === 'INSTALL_CANCEL'){
      d.fillRoundRect(25, 220, 80, 30, 4, TFT_GREEN);
      d.setTextColor(TFT_BLACK, TFT_GREEN);
      d.drawString('Install', 65, 235, 2);

      d.fillRoundRect(135, 220, 80, 30, 4, TFT_RED);
      d.setTextColor(TFT_WHITE, TFT_RED);
      d.drawString('Cancel', 175, 235, 2);
    }
  }
  handleTouch(x, y){
    if (this.dialog){
      if (this.dialog.actions === 'OK' && x >= 85 && x <= 155 && y >= 220 && y <= 250){
        this.dialog = null; this.draw(); return;
      }
      if (this.dialog.actions === 'INSTALL_CANCEL'){
        if (x >= 25 && x <= 105 && y >= 220 && y <= 250){
          this._doInstall(this.dialog.meta);
        } else if (x >= 135 && x <= 215 && y >= 220 && y <= 250){
          this.dialog = null; this.draw();
        }
      }
      return;
    }

    if (this.currentPath === '/help/'){
      if (y >= 285) { this.currentPath = '/'; this.refresh(); this.draw(); }
      return;
    }

    const hasUp = (this.currentPath !== '/');
    const total = this.files.length + (hasUp ? 1 : 0);

    if (y >= 45 && y <= 270){
      const idx = this.scrollOffset + Math.floor((y - 45) / 30);
      if (idx < total){ this.selectedIndex = idx; this.activate(); }
      return;
    }

    if (y >= 285 && y <= 315){
      if (x < 60) this.sim.setState(STATE_LAUNCHER);
      else if (x < 120){
        if (this.selectedIndex > 0){
          this.selectedIndex--;
          if (this.selectedIndex < this.scrollOffset) this.scrollOffset--;
          this.draw();
        }
      } else if (x < 180) this.activate();
      else {
        if (this.selectedIndex < total - 1){
          this.selectedIndex++;
          if (this.selectedIndex >= this.scrollOffset + 7) this.scrollOffset++;
          this.draw();
        }
      }
    }
  }
  activate(){
    const hasUp = (this.currentPath !== '/');
    if (hasUp && this.selectedIndex === 0){
      let parts = this.currentPath.split('/').filter(Boolean);
      parts.pop();
      this.currentPath = parts.length ? ('/' + parts.join('/') + '/') : '/';
      this.selectedIndex = 0; this.scrollOffset = 0;
      this.refresh(); this.draw(); return;
    }
    const f = this.files[this.selectedIndex - (hasUp ? 1 : 0)];
    if (!f) return;
    if (f.path === '/help/'){
      this.currentPath = '/help/'; this.draw(); return;
    }
    if (f.isDir){
      const jp = f.path.replace(/\/+$/, '') + '/app.json';
      if (this.sim.vfs.exists(jp)){
        try {
          const meta = JSON.parse(this.sim.vfs.readTextFile(jp));
          meta.folderPath = f.path;
          this.dialog = {
            title: meta.name || 'App Details',
            lines: ['v' + (meta.version||'1.0.0'), 'by ' + (meta.author||'Unknown'), meta.type||'App'],
            actions: 'INSTALL_CANCEL',
            meta: meta
          };
          this.draw(); return;
        } catch(e){}
      }
      this.currentPath = f.path.endsWith('/') ? f.path : (f.path + '/');
      this.selectedIndex = 0; this.scrollOffset = 0;
      this.refresh(); this.draw();
    } else if (f.name.endsWith('.js')){
      this.sim.launchApp({ name: f.name, path: f.path, isFolder: false });
    }
  }
  _doInstall(meta){
    const useSD = this.sim.vfs.exists('/local/config_install_sd.txt');
    const dest = (useSD ? '/sd/apps/' : '/local/apps/') + (meta.packageName || 'com.app.demo');
    this.sim.vfs.mkdir(dest);
    this.sim.vfs.writeTextFile(dest + '/app.json', JSON.stringify(meta, null, 2));

    const srcMain = meta.folderPath.replace(/\/+$/, '') + '/main.js';
    const code = this.sim.vfs.exists(srcMain) ? this.sim.vfs.readTextFile(srcMain) : 'System.fillScreen(BLACK); System.drawString("Hello", 20, 20, 2);';
    this.sim.vfs.writeTextFile(dest + '/main.js', code);

    log('Installed app to IndexedDB: ' + meta.name, 'ok');
    this.dialog = { title: 'Installed!', lines: [meta.name, 'v' + meta.version], actions: 'OK', ok: true };
    this.draw();
  }
  physical(k){
    if (k === 'up') this.handleTouch(90, 300);
    else if (k === 'sel') this.handleTouch(150, 300);
    else if (k === 'dn') this.handleTouch(210, 300);
  }
}

// --- 6. Manage Apps UI ---
class ManageAppsUI {
  constructor(sim){ this.sim = sim; this.apps = []; this.selected = -1; this.modal = false; }
  enter(){ this.refresh(); }
  refresh(){
    this.apps = [];
    for (const d of ['/local/apps', '/sd/apps']){
      if (!this.sim.vfs.isDirectory(d)) continue;
      for (const e of this.sim.vfs.listDirFull(d)){
        let name = e.name;
        const jp = e.path + '/app.json';
        if (this.sim.vfs.exists(jp)){
          try { const o = JSON.parse(this.sim.vfs.readTextFile(jp)); name = o.name || name; } catch(err){}
        }
        this.apps.push({ name, path: e.path, drive: d.startsWith('/sd') ? '[SD]' : '[LFS]' });
      }
    }
  }
  draw(){
    const d = this.sim.disp;
    d.fillScreen(TFT_BLACK);
    d.drawRoundRect(3, 3, 234, 314, 5, TFT_WHITE);
    d.fillRoundRect(6, 6, 228, 30, 5, TFT_BLACK);
    d.drawRoundRect(6, 6, 228, 30, 5, TFT_GREEN);
    d.setTextColor(TFT_GREEN, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('Manage Apps', 120, 21, 2);

    const defaultSD = this.sim.vfs.exists('/local/config_install_sd.txt');
    d.fillRoundRect(10, 40, 220, 30, 4, TFT_DARKGREY);
    d.setTextColor(TFT_WHITE, TFT_DARKGREY);
    d.drawString(defaultSD ? 'Default Install: SD' : 'Default Install: LFS', 120, 55, 2);

    d.setTextDatum(TL_DATUM);
    let y = 80;
    this.apps.slice(0, 5).forEach((a) => {
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString(a.name.substring(0, 18), 15, y + 8, 2);
      d.setTextColor(TFT_YELLOW, TFT_BLACK);
      d.drawString(a.drive, 190, y + 8, 2);
      y += 35;
    });

    d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
    d.setTextColor(TFT_WHITE, TFT_BLACK);
    d.setTextDatum(MC_DATUM);
    d.drawString('BACK', 120, 300, 2);

    if (this.modal && this.selected >= 0){
      const a = this.apps[this.selected];
      d.fillRoundRect(20, 80, 200, 150, 5, TFT_DARKGREY);
      d.drawRoundRect(20, 80, 200, 150, 5, TFT_WHITE);
      d.setTextColor(TFT_YELLOW, TFT_DARKGREY);
      d.drawString('App Actions', 120, 95, 2);

      d.fillRoundRect(30, 110, 180, 30, 4, TFT_RED);
      d.setTextColor(TFT_WHITE, TFT_RED);
      d.drawString('Uninstall', 120, 125, 2);

      d.fillRoundRect(30, 150, 180, 30, 4, TFT_ORANGE);
      d.setTextColor(TFT_BLACK, TFT_ORANGE);
      d.drawString(a.drive === '[SD]' ? 'Move to LFS' : 'Move to SD', 120, 165, 2);

      d.fillRoundRect(30, 190, 180, 30, 4, TFT_BLACK);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.drawString('Cancel', 120, 205, 2);
    }
  }
  handleTouch(x, y){
    if (this.modal && this.selected >= 0){
      const a = this.apps[this.selected];
      if (y >= 110 && y <= 140){
        this.sim.vfs.deleteRecursive(a.path);
        log('Uninstalled app: ' + a.name, 'warn');
        this.modal = false; this.refresh(); this.draw(); return;
      }
      if (y >= 150 && y <= 180){
        const isSD = a.drive === '[SD]';
        const newPath = (isSD ? '/local/apps/' : '/sd/apps/') + a.path.split('/').filter(Boolean).pop();
        this.sim.vfs.mkdir(isSD ? '/local/apps/' : '/sd/apps/');
        for (const k of [...this.sim.vfs.cache.keys()]){
          if (k.startsWith(a.path)){
            const rest = k.substring(a.path.length);
            const content = this.sim.vfs.readTextFile(k);
            this.sim.vfs.writeTextFile(newPath + rest, content);
          }
        }
        this.sim.vfs.deleteRecursive(a.path);
        log('Moved app: ' + a.name, 'ok');
        this.modal = false; this.refresh(); this.draw(); return;
      }
      if (y >= 190 && y <= 220){ this.modal = false; this.draw(); return; }
      return;
    }

    if (y >= 285) { this.sim.setState(STATE_SETTINGS); return; }
    if (y >= 40 && y <= 70){
      if (this.sim.vfs.exists('/local/config_install_sd.txt')) this.sim.vfs.deleteFile('/local/config_install_sd.txt');
      else this.sim.vfs.writeTextFile('/local/config_install_sd.txt', '1');
      this.draw(); return;
    }
    if (y >= 80 && y <= 260){
      const idx = Math.floor((y - 80) / 35);
      if (idx < this.apps.length){ this.selected = idx; this.modal = true; this.draw(); }
    }
  }
  physical(k){ if (k === 'sel') this.handleTouch(120, 300); }
}

      d.setTextColor(TFT_BLACK, TFT_GREEN);
      d.drawString('INSTALL', 65, 245, 2);

      d.fillRoundRect(135, 230, 80, 30, 4, TFT_RED);
      d.setTextColor(TFT_WHITE, TFT_RED);
      d.drawString('CANCEL', 175, 245, 2);
    }
    else if (this.state === 3){
      d.fillRoundRect(10, 80, 220, 140, 6, TFT_DARKGREY);
      d.setTextColor(TFT_WHITE, TFT_DARKGREY);
      d.setTextDatum(MC_DATUM);
      d.drawString(this.dialogMsg, 120, 130, 2);

      d.fillRoundRect(85, 175, 70, 30, 4, TFT_BLUE);
      d.setTextColor(TFT_WHITE, TFT_BLUE);
      d.drawString('OK', 120, 190, 2);
    }
  }

  handleTouch(x, y){
    if (this.state === 3){
      if (x >= 85 && x <= 155 && y >= 175 && y <= 210){
        this.state = 1; this.draw();
      }
      return;
    }

    if (this.state === 2){
      if (y >= 230 && y <= 260){
        if (x >= 25 && x <= 105){
          const a = (this.storeData[this.currentCategory] || [])[this.appIndex];
          this._installApp(a);
        } else if (x >= 135 && x <= 215){
          this.state = 1; this.draw();
        }
      }
      return;
    }

    if (y >= 45 && y <= 270){
      const list = this.getCurrentList();
      const clickedIdx = this.scrollOffset + Math.floor((y - 45) / 30);
      if (clickedIdx < list.length){
        if (this.state === 0) {
          this.catIndex = clickedIdx;
          this.selectCategory();
        } else {
          this.appIndex = clickedIdx;
          this.state = 2;
          this.draw();
        }
      }
      return;
    }

    if (y >= 285 && y <= 315){
      if (x < 70){
        if (this.state === 1) { this.state = 0; this.scrollOffset = 0; this.draw(); }
        else this.sim.setState(STATE_LAUNCHER);
      } else if (x >= 70 && x < 130){
        this.navUp();
      } else if (x >= 130 && x < 200){
        this.navSel();
      } else if (x >= 200){
        this.navDown();
      }
    }
  }

  navUp(){
    const list = this.getCurrentList();
    if (this.state === 0){
      if (this.catIndex > 0){
        this.catIndex--;
        if (this.catIndex < this.scrollOffset) this.scrollOffset = this.catIndex;
        this.draw();
      }
    } else if (this.state === 1){
      if (this.appIndex > 0){
        this.appIndex--;
        if (this.appIndex < this.scrollOffset) this.scrollOffset = this.appIndex;
        this.draw();
      }
    }
  }

  navDown(){
    const list = this.getCurrentList();
    if (this.state === 0){
      if (this.catIndex < list.length - 1){
        this.catIndex++;
        if (this.catIndex >= this.scrollOffset + 7) this.scrollOffset = this.catIndex - 6;
        this.draw();
      }
    } else if (this.state === 1){
      if (this.appIndex < list.length - 1){
        this.appIndex++;
        if (this.appIndex >= this.scrollOffset + 7) this.scrollOffset = this.appIndex - 6;
        this.draw();
      }
    }
  }

  navSel(){
    if (this.state === 0) this.selectCategory();
    else if (this.state === 1) { this.state = 2; this.draw(); }
  }

  selectCategory(){
    const sel = this.categories[this.catIndex];
    if (sel === '[ Check For Apps Update ]'){
      this.dialogMsg = 'All Apps are up to date!';
      this.state = 3;
      this.draw();
      return;
    }
    this.currentCategory = sel;
    this.appIndex = 0;
    this.scrollOffset = 0;
    this.state = 1;
    this.draw();
  }

  _installApp(a){
    const dir = '/local/apps/' + a.pkg;
    this.sim.vfs.mkdir(dir);
    this.sim.vfs.writeTextFile(dir + '/app.json', JSON.stringify({
      name: a.name, packageName: a.pkg, version: a.version, api: 1, author: a.author, type: 'App', category: this.currentCategory, description: a.desc
    }, null, 2));

    const code = `System.fillScreen(BLACK);
System.setTextColor(GREEN);
System.drawString("${a.name}", 15, 30, 4);
System.setTextColor(WHITE);
System.drawString("Version: ${a.version}", 15, 80, 2);
System.drawString("Author: ${a.author}", 15, 105, 2);
System.drawString("Category: ${this.currentCategory}", 15, 130, 2);
System.setTextColor(YELLOW);
System.drawString("Installed via App Store", 15, 170, 2);
System.setTextColor(WHITE);
System.drawString("Tap anywhere to exit", 15, 250, 2);
while (true) {
  var t = System.getTouch();
  if (t.touched) break;
  System.delay(50);
}`;
    this.sim.vfs.writeTextFile(dir + '/main.js', code);
    log(`Installed ${a.name} into IndexedDB (/local/apps/${a.pkg})`, 'ok');
    this.dialogMsg = `${a.name} Installed!`;
    this.state = 3;
    this.draw();
  }

  physical(k){
    if (k === 'up') this.navUp();
    else if (k === 'sel') this.navSel();
    else if (k === 'dn') this.navDown();
  }
}

      topList.forEach((t, i) => {

          d.fillRect(10, y - 2, 220, 26, TFT_WHITE);
          d.setTextColor(TFT_BLACK, TFT_WHITE);
          d.drawString('> ' + t, 15, y + 2, 2);
        } else {
          d.setTextColor(TFT_WHITE, TFT_BLACK);
          d.drawString('  ' + t, 15, y + 2, 2);
        }
        y += 32;
      });

      d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.setTextDatum(MC_DATUM);
      d.drawString('BACK', 35, 300, 2); d.drawString('|', 70, 300, 2);
      d.drawString('UP', 100, 300, 2);  d.drawString('|', 130, 300, 2);
      d.drawString('SEL', 165, 300, 2); d.drawString('|', 200, 300, 2);
      d.drawString('DN', 220, 300, 2);
    } 
    else if (this.state === 5){
      d.setTextDatum(TL_DATUM);
      d.setTextColor(TFT_CYAN, TFT_BLACK);
      d.drawString(this.viewerTitle, 15, 48, 2);

      d.setTextColor(TFT_WHITE, TFT_BLACK);
      const words = this.viewerContent.split(' ');
      let line = '', y = 75;
      for (const w of words){
        if ((line + ' ' + w).length > 25){
          d.drawString(line, 15, y, 2);
          y += 18; line = w;
        } else line += (line ? ' ' : '') + w;
      }
      if (line) d.drawString(line, 15, y, 2);

      d.drawRoundRect(5, 285, 230, 30, 5, TFT_WHITE);
      d.setTextColor(TFT_WHITE, TFT_BLACK);
      d.setTextDatum(MC_DATUM);
      d.drawString('BACK', 120, 300, 2);
    }
  }

  handleTouch(x, y){
    if (this.state === 0){
      if (y >= 80 && y <= 120){ this.state = 1; this.catIndex = 0; this.draw(); return; }
      if (y >= 140 && y <= 180){ log('Online Help requires network.', 'info'); return; }
      if (y >= 285){ this.sim.setState(STATE_LAUNCHER); return; }
    }
    else if (this.state === 1){
      if (y >= 45 && y <= 260){
        const idx = Math.floor((y - 45) / 32);
        if (idx < this.categories.length){
          this.catIndex = idx; this.topicIndex = 0; this.state = 2; this.draw();
        }
        return;
      }
      if (y >= 285){
        if (x < 70) { this.state = 0; this.draw(); }
        else if (x >= 70 && x < 130) { if (this.catIndex > 0) { this.catIndex--; this.draw(); } }
        else if (x >= 130 && x < 200) { this.topicIndex = 0; this.state = 2; this.draw(); }
        else if (x >= 200) { if (this.catIndex < this.categories.length - 1) { this.catIndex++; this.draw(); } }
      }
    }
    else if (this.state === 2){
      const topList = this.topics[this.catIndex] || [];
      if (y >= 45 && y <= 260){
        const idx = Math.floor((y - 45) / 32);
        if (idx < topList.length){
          this.topicIndex = idx;
          this.openArticle(topList[idx]);
        }
        return;
      }
      if (y >= 285){
        if (x < 70) { this.state = 1; this.draw(); }
        else if (x >= 70 && x < 130) { if (this.topicIndex > 0) { this.topicIndex--; this.draw(); } }
        else if (x >= 130 && x < 200) { this.openArticle(topList[this.topicIndex]); }
        else if (x >= 200) { if (this.topicIndex < topList.length - 1) { this.topicIndex++; this.draw(); } }
      }
    }
    else if (this.state === 5){
      if (y >= 285) { this.state = 2; this.draw(); }
    }
  }

  openArticle(title){
    this.viewerTitle = title;
    this.viewerContent = this.content[title] || 'No information available for this topic.';
    this.state = 5;
    this.draw();
  }

  physical(k){
    if (this.state === 1){
      if (k === 'up' && this.catIndex > 0) { this.catIndex--; this.draw(); }
      else if (k === 'dn' && this.catIndex < this.categories.length - 1) { this.catIndex++; this.draw(); }
      else if (k === 'sel') { this.topicIndex = 0; this.state = 2; this.draw(); }
    } else if (this.state === 2){
      const topList = this.topics[this.catIndex] || [];
      if (k === 'up' && this.topicIndex > 0) { this.topicIndex--; this.draw(); }
      else if (k === 'dn' && this.topicIndex < topList.length - 1) { this.topicIndex++; this.draw(); }
      else if (k === 'sel') { this.openArticle(topList[this.topicIndex]); }
    } else if (this.state === 5 && k === 'sel'){
      this.state = 2; this.draw();
    }
  }
}

/* =========================================================
   Simulator Core Class
   ========================================================= */
class Simulator {
  constructor(){
    this.canvas = document.getElementById('screen');
    this.disp = new TFTDisplay(this.canvas);
    this.vfs = new IndexedDB_VFS(this);
    this.keyboard = new OnScreenKeyboard(this);
    this.touch = { x: 0, y: 0, touched: false, justPressed: false };
    this.exitRequested = false;
    this.system = buildSystemAPI(this);
    this.fsAPI = buildFSAPI(this.vfs);

    this.wifiConnected = true;
    this.timezone = 'UTC0';
    this.state = STATE_LAUNCHER;

    this.screens = {
      [STATE_LAUNCHER]: new LauncherUI(this),
      [STATE_SETTINGS]: new SettingsUI(this),
      [STATE_INSTALLER]: new InstallerUI(this),
      [STATE_CALIBRATOR]: new TouchCalibratorUI(this),
      [STATE_WEB_APP]: new WebServerUI(this),
      [STATE_SETTINGS_WIFI]: new WiFiSettingsUI(this),
      [STATE_SETTINGS_ABOUT]: new AboutDeviceUI(this),
      [STATE_SETTINGS_APPS]: new ManageAppsUI(this),
      [STATE_SETTINGS_TIME]: new TimeSettingsUI(this),
      [STATE_APP_STORE]: new AppStoreUI(this),
      [STATE_HELP_CENTER]: new HelpCenterUI(this),
      [STATE_UPDATER_MANUAL]: new AboutDeviceUI(this)
    };
    this.launcher = this.screens[STATE_LAUNCHER];

    this._bindInput();
    this._bindUI();

    this.vfs.init().then(() => {
      this.wifiConnected = !this.vfs.exists('/local/nowifi.txt');
      this.launcher.scanApps();
      this.setState(STATE_LAUNCHER);
    });

    let frames = 0, lastT = performance.now();
    const countFrame = () => { frames++; requestAnimationFrame(countFrame); };
    requestAnimationFrame(countFrame);
    setInterval(() => {
      const now = performance.now();
      document.getElementById('fps-label').textContent = Math.round(frames * 1000 / (now - lastT)) + ' fps';
      frames = 0; lastT = now;
    }, 1000);
  }

  onStorageChanged(path){
    this.launcher.scanApps();
    if (this.state === STATE_LAUNCHER) {
      this.launcher.draw();
    } else if (this.state === STATE_SETTINGS_APPS) {
      this.screens[STATE_SETTINGS_APPS].enter();
      this.screens[STATE_SETTINGS_APPS].draw();
    } else if (this.state === STATE_INSTALLER) {
      this.screens[STATE_INSTALLER].refresh();
      this.screens[STATE_INSTALLER].draw();
    }
  }

  setState(s){
    this.state = s;
    const labels = {
      [STATE_LAUNCHER]: 'LAUNCHER',
      [STATE_SETTINGS]: 'SETTINGS',
      [STATE_RUN_APP]: 'RUN_APP',
      [STATE_INSTALLER]: 'INSTALLER',
      [STATE_APP_STORE]: 'APP_STORE',
      [STATE_HELP_CENTER]: 'HELP_CENTER',
      [STATE_SETTINGS_WIFI]: 'SETTINGS_WIFI',
      [STATE_SETTINGS_APPS]: 'SETTINGS_APPS',
      [STATE_SETTINGS_TIME]: 'SETTINGS_TIME',
      [STATE_SETTINGS_ABOUT]: 'SETTINGS_ABOUT',
      [STATE_WEB_APP]: 'WEB_APP',
      [STATE_CALIBRATOR]: 'CALIBRATOR'
    };
    document.getElementById('state-label').textContent = labels[s] || ('STATE_' + s);
    if (s === STATE_RUN_APP) return;
    this.disp.fillScreen(TFT_BLACK);
    const scr = this.screens[s];
    if (scr){
      if (scr.enter) scr.enter();
      scr.draw();
    }
  }

  _bindInput(){
    const cvs = this.canvas;
    const getXY = (cx, cy) => {
      const r = cvs.getBoundingClientRect();
      const x = Math.floor((cx - r.left) * cvs.width / r.width);
      const y = Math.floor((cy - r.top) * cvs.height / r.height);
      return { x: Math.max(0, Math.min(cvs.width - 1, x)), y: Math.max(0, Math.min(cvs.height - 1, y)) };
    };
    const press = (cx, cy) => {
      const p = getXY(cx, cy);
      this._handlePress(p.x, p.y);
    };
    const move = (cx, cy) => {
      if (!this.touch.touched || this.state !== STATE_RUN_APP) return;
      const p = getXY(cx, cy);
      this.touch.x = p.x; this.touch.y = p.y;
    };
    const release = () => {
      if (this.state === STATE_RUN_APP) this.touch.touched = false;
    };

    cvs.addEventListener('mousedown', e => { e.preventDefault(); press(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => { if (e.buttons === 1) move(e.clientX, e.clientY); });
    window.addEventListener('mouseup', release);

    cvs.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; press(t.clientX, t.clientY); }, {passive:false});
    cvs.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; move(t.clientX, t.clientY); }, {passive:false});
    cvs.addEventListener('touchend', e => { e.preventDefault(); release(); }, {passive:false});

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const scr = this.screens[this.state];
        if (scr && scr.physical) scr.physical(btn.dataset.key);
      });
    });
  }

  _handlePress(x, y){
    if (this.state === STATE_RUN_APP && x >= 200 && y <= 40){
      this.exitRequested = true;
      if (this.keyboard.active) this.keyboard.cancel();
      return;
    }
    if (this.keyboard.active){
      this.keyboard.handleTouch(x, y);
      return;
    }
    if (this.state === STATE_RUN_APP){
      this.touch.x = x; this.touch.y = y;
      this.touch.touched = true;
      this.touch.justPressed = true;
      return;
    }
    const scr = this.screens[this.state];
    if (scr && scr.handleTouch) {
      scr.handleTouch(x, y);
    }
  }

  async launchApp(app, codeOverride){
    let code = (codeOverride != null) ? codeOverride : this.vfs.readTextFile(app.isFolder ? app.path + '/main.js' : app.path);
    if (!code){ log('Error: main.js not found', 'err'); return; }

    this.exitRequested = false;
    this.touch = { x: 0, y: 0, touched: false, justPressed: false };
    this.state = STATE_RUN_APP;
    document.getElementById('state-label').textContent = 'RUN_APP';

    this.disp.fillScreen(TFT_BLACK);
    // Draw exit button
    this.disp.fillRoundRect(200, 0, 40, 30, 5, TFT_RED);
    this.disp.setTextColor(TFT_WHITE, TFT_RED);
    this.disp.setTextDatum(MC_DATUM);
    this.disp.drawString("X", 220, 15, 2);
    // Reset to TL_DATUM for the app
    this.disp.setTextDatum(TL_DATUM);

    let transformed = code
      .replace(/(?<!await\s+)\bSystem\.delay\(/g, 'await System.delay(')
      .replace(/(?<!await\s+)\bSystem\.delayMicroseconds\(/g, 'await System.delayMicroseconds(')
      .replace(/(?<!await\s+)\bSystem\.prompt\(/g, 'await System.prompt(');

    let fn;
    try {
      fn = new Function('System', 'FS', 'BLACK', 'WHITE', 'RED', 'GREEN', 'BLUE', 'YELLOW', 'CYAN', 'MAGENTA', 'ORANGE', 'DARKGREY',
        `"use strict"; return (async () => { ${transformed} })();`);
    } catch(err) {
      await this._showError(err.message);
      return;
    }

    log('▶ Running: ' + app.name, 'info');
    let forceExited = false;
    try {
      await fn(this.system, this.fsAPI,
        TFT_BLACK, TFT_WHITE, TFT_RED, TFT_GREEN, TFT_BLUE, TFT_YELLOW,
        TFT_CYAN, TFT_MAGENTA, TFT_ORANGE, TFT_DARKGREY);
      log('■ App finished');
    } catch(e) {
      if (e.message === 'OS_EXIT' || e.code === 'OS_EXIT'){
        log('■ App cleanly exited via X');
        forceExited = true;
      } else {
        log('✖ App error: ' + e.message, 'err');
        await this._showError(e.message);
        return;
      }
    }

    if (!forceExited){
      this.disp.fillRoundRect(200, 0, 40, 30, 5, TFT_RED);
      this.disp.setTextColor(TFT_WHITE, TFT_RED);
      this.disp.setTextDatum(MC_DATUM);
      this.disp.drawString("X", 220, 15, 2);
      this.disp.setTextDatum(TL_DATUM);
      await new Promise(res => {
        const check = setInterval(() => {
          if (this.exitRequested){ clearInterval(check); res(); }
        }, 30);
      });
    }

    this.exitRequested = false;
    this.setState(STATE_LAUNCHER);
  }

  _showError(msg){
    this.state = STATE_RUN_APP;
    document.getElementById('state-label').textContent = 'ERROR';
    this.disp.fillScreen(TFT_RED);
    this.disp.setTextColor(TFT_WHITE, TFT_RED);
    this.disp.setTextDatum(TL_DATUM);
    this.disp.drawString('JS EXCEPTION!', 10, 10, 4);

    const lines = String(msg).split('\n');
    let y = 60;
    for (let i = 0; i < lines.length && i < 8; i++){
      this.disp.drawString(lines[i].substring(0, 38), 10, y, 2);
      y += 20;
    }

    this.disp.fillRoundRect(200, 0, 40, 30, 5, TFT_WHITE);
    this.disp.setTextColor(TFT_RED, TFT_WHITE);
    this.disp.setTextDatum(MC_DATUM);
    this.disp.drawString("X", 220, 15, 2);
    this.disp.setTextDatum(TL_DATUM);

    return new Promise(res => {
      const check = setInterval(() => {
        if (this.exitRequested){ clearInterval(check); res(); }
      }, 40);
    }).then(() => this.setState(STATE_LAUNCHER));
  }

  _bindUI(){
    document.getElementById('btn-install').addEventListener('click', () => {
      const name = document.getElementById('app-name').value.trim() || 'My App';
      let pkg = document.getElementById('app-pkg').value.trim() || 'com.demo.app';
      pkg = pkg.toLowerCase().replace(/\s+/g, '');
      if (!pkg.includes('.')) pkg = 'com.demo.' + pkg.replace(/[^a-z0-9]/g, '');

      const code = document.getElementById('app-code').value;
      const dir = '/local/apps/' + pkg;
      this.vfs.mkdir(dir);
      this.vfs.writeTextFile(dir + '/app.json', JSON.stringify({
        name, packageName: pkg, version: '1.0.0', api: 1, author: 'You', type: 'App', category: 'User', description: 'Installed via editor'
      }, null, 2));
      this.vfs.writeTextFile(dir + '/main.js', code);

      log('💾 Saved & Installed to IndexedDB: ' + name + ' (' + pkg + ')', 'ok');
    });

    document.getElementById('btn-run').addEventListener('click', () => {
      const name = document.getElementById('app-name').value.trim() || 'My App';
      const code = document.getElementById('app-code').value;
      this.launchApp({ name, path: '__tmp__', isFolder: true }, code);
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
      if (!confirm('Format IndexedDB storage? All installed apps and saved data will be wiped.')) return;
      await this.vfs.reset();
      this.setState(STATE_LAUNCHER);
    });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.KryonOS = new Simulator();
  log('KryonOS Simulator v2.6 ready — Text Alignment Fixed', 'ok');
});
</script>
</body>
 </html>
